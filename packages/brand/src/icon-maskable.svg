<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    ANDROID MASKABLE ICON — coral tile, white mark at 52%.
    The safe zone is the central 66% circle: any part of the mark outside it
    may be cropped by the launcher's mask, so the mark is kept well inside.
    Full-bleed background, no radius, no transparency.
  -->
  <rect width="240" height="240" fill="#FF4B55"/>
  <g transform="translate(120 120) scale(0.52) translate(-120 -120)">
    <path d="M40 104 C40 196 200 196 200 104" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <circle cx="120" cy="58" r="24" fill="#FFFFFF"/>
  </g>
</svg>
