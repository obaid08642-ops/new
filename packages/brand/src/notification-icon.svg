<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    NOTIFICATION ICON — Android renders notification icons as a mask, so this
    must be a single flat silhouette in white on transparency. No colour, no
    alpha gradient, no detail: anything else disappears into the mask.
    The mark is at 70% so the silhouette stays readable at status-bar size.
  -->
  <g transform="translate(120 120) scale(0.7) translate(-120 -120)">
    <path d="M40 104 C40 196 200 196 200 104" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <circle cx="120" cy="58" r="24" fill="#FFFFFF"/>
  </g>
</svg>
