<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    iOS APP ICON — coral tile, white mark at 65% (canvas Main.dc.html).
    Square with NO radius and NO transparency: iOS masks it itself and
    rejects an icon that carries an alpha channel.
  -->
  <rect width="240" height="240" fill="#FF4B55"/>
  <g transform="translate(120 120) scale(0.65) translate(-120 -120)">
    <path d="M40 104 C40 196 200 196 200 104" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
    <circle cx="120" cy="58" r="24" fill="#FFFFFF"/>
  </g>
</svg>
