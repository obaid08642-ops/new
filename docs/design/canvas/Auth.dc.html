<div style="width: 44px"></div>
</div>

</div>

</div>
</sc-for>
<sc-if value="{{is.login}}" hint-placeholder-val="{{false}}"><a href="#" style="align-self: flex-start; font-size: 14px; font-weight: 500; color: {{c.link}}; text-decoration: none; padding: 4px 0">نسيت كلمة المرور؟</a></sc-if>

</label>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<button onClick="{{press}}" style="height: 56px; border-radius: 18px; border: 0; background: {{btn.bg}}; box-shadow: {{c.actionShadow}}; color: {{c.actionText}}; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 240ms ease">
<sc-if value="{{btn.loading}}" hint-placeholder-val="{{false}}"><span style="width: 18px; height: 18px; border-radius: 9px; border: 2.5px solid {{c.spinTrack}}; border-top-color: {{c.actionText}}; box-sizing: border-box; animation: ndSpin 700ms linear infinite"></span></sc-if>
<sc-if value="{{btn.done}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.actionText}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10" pathLength="100" style="stroke-dasharray: 100; animation: ndDraw 360ms ease-out both"></path></svg></sc-if>
{{btn.label}}</button>
<sc-if value="{{showSocial}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 12px; color: {{c.muted}}; font-size: 12.5px"><div style="flex-grow: 1; height: 1px; background: {{c.hair}}"></div>أو تابع عبر<div style="flex-grow: 1; height: 1px; background: {{c.hair}}"></div></div>

<button aria-label="{{s.aria}}" style="width: 64px; height: 52px; border-radius: 16px; border: 1px solid {{c.hair}}; background: {{s.bg}}; display: flex; align-items: center; justify-content: center; padding: 0">
<span style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px dashed {{s.fg}}; font-size: 7px; color: {{s.fg}}; display: flex; align-items: center; justify-content: center">{{s.k}}</span></button>
</sc-for>
</div>
</sc-if>
<div style="text-align: center; font-size: 14px; color: {{c.muted}}">{{f.alt}} <a href="#" style="color: {{c.link}}; font-weight: 600; text-decoration: none">{{f.altLink}}</a></div>
</div>
</div>
</sc-if>

</div>
</x-dc>
