<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Consultations hub</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
@keyframes ndRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1660px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 20px; font-weight: 700">استشارات</h1>
<a href="#" aria-label="مواعيدي" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="FIcon" icon="calendar-dots" tone="ink" chip="none" size="{{g20}}" hint-size="20px,20px"></dc-import></a>
</div>

<div style="display: flex; gap: 8px">
<label style="flex-grow: 1; height: 52px; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.08); display: flex; align-items: center; gap: 10px; padding: 0 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0 M20 20l-4-4"></path></svg>
<input placeholder="ابحث عن طبيب أو تخصص…" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 15px; outline: none">
</label>
<button aria-label="تصفية" style="width: 52px; height: 52px; border-radius: 18px; border: 0; background: #0B1B2B; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10 M18 7h2 M4 17h4 M12 17h8 M16 5v4 M10 15v4"></path></svg></button>
</div>

<div role="radiogroup" aria-label="نوع الاستشارة" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 48px; border-radius: 16px; border: {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-family: inherit; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 200ms ease">
<svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true"><path d="{{m.d}}" fill="currentColor"></path></svg>{{m.l}}</button>
</sc-for>
</div>

<div role="radiogroup" aria-label="طريقة الدفع" style="align-self: flex-start; display: flex; padding: 4px; border-radius: 16px; background: #EAEAEF">
<sc-for list="{{pays}}" as="p" hint-placeholder-count="3">
<button role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" style="height: 36px; padding: 0 18px; border-radius: 12px; border: 0; background: {{p.bg}}; box-shadow: {{p.shadow}}; color: #0B1B2B; font-family: inherit; font-size: 13.5px; font-weight: {{p.w}}">{{p.l}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">التخصصات</h2><a href="#" style="font-size: 13px; text-decoration: none; font-weight: 500">عرض الكل</a></div>
<div style="display: flex; gap: 12px; margin: 0 -16px; padding: 0 16px; overflow: hidden">
<sc-for list="{{specs}}" as="s" hint-placeholder-count="6">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #0B1B2B; flex-shrink: 0; width: 64px">
<dc-import name="FIcon" icon="{{s.icon}}" tone="{{s.tone}}" chip="soft" size="{{chip58}}" hint-size="58px,58px"></dc-import>
<span style="font-size: 12.5px; font-weight: 500">{{s.l}}</span>
</a>
</sc-for>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">أطباء متاحون</h2><span style="font-size: 12.5px; color: #6E6E73">مرتّبون حسب أقرب موعد</span></div>

<sc-for list="{{docs}}" as="d" hint-placeholder-count="2">
<a href="#" style="border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.05); box-shadow: 0 10px 28px rgba(11,27,43,0.07); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: #0B1B2B; animation: ndRise 420ms cubic-bezier(.22,1,.36,1) {{d.delay}} both">
<div style="padding: 16px; display: flex; gap: 14px">
<div style="width: 104px; height: 118px; flex-shrink: 0; border-radius: 52% 48% 46% 54% / 44% 46% 54% 56%; background: {{d.bg}}; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6E6E73">[صورة الطبيب]</div>
<span style="position: absolute; bottom: 8px; left: 8px; width: 14px; height: 14px; border-radius: 7px; background: #1F9D6E; border: 3px solid #FFFFFF"></span>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 17px; font-weight: 700">د. [اسم الطبيب]</span>
<svg width="17" height="17" viewBox="0 0 24 24" aria-label="موثّق"><path d="M12 2l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z" fill="#2D4FD6"></path><path d="M8.5 12.2l2.3 2.3 4.7-4.7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<span style="align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 12px; background: #E7ECFF; color: #2D4FD6; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">[الدرجة: استشاري / أخصائي]</span>
<span style="font-size: 13px; color: #3C4651">[التخصص الدقيق]</span>
<span style="font-size: 12.5px; color: #6E6E73; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 256 256" aria-hidden="true" style="flex-shrink: 0"><path d="{{pin}}" fill="#D42A38"></path></svg>[اسم المستشفى أو العيادة] · [المسافة] كم</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{d.modes}}" as="m" hint-placeholder-count="3">
<span style="height: 26px; padding: 0 9px; border-radius: 13px; background: {{m.bg}}; color: {{m.fg}}; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px"><svg width="13" height="13" viewBox="0 0 256 256" aria-hidden="true"><path d="{{m.d}}" fill="currentColor"></path></svg>{{m.l}}</span>
</sc-for>
</div>
</div>
</div>
<div style="padding: 12px 14px 12px 12px; background: linear-gradient(180deg, #E8384A 0%, #D42A38 100%); color: #FFFFFF; display: flex; align-items: center; gap: 10px">
<span style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 256 256" aria-hidden="true"><path d="{{star}}" fill="#FFD166"></path></svg>[N.N] <span style="font-size: 12px; font-weight: 400; opacity: 0.85">([العدد])</span></span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18z M12 7v5l3 2"></path></svg>{{d.next}}</span>
<span style="margin-inline-start: auto; font-size: 16px; font-weight: 700">[السعر] <span style="font-size: 11px; font-weight: 400">ر.س</span></span>
<span style="height: 40px; padding: 0 18px; border-radius: 14px; background: #FFFFFF; color: #D42A38; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center">احجز</span>
</div>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1660}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 0, pay: 0 }; }
renderVals() {
const s = this.state;
const D = {"hospital": "M248,208h-8V128a16,16,0,0,0-16-16H168V48a16,16,0,0,0-16-16H56A16,16,0,0,0,40,48V208H32a8,8,0,0,0,0,16H248a8,8,0,0,0,0-16Zm-120,0H80V160h48Zm0-104H112v16a8,8,0,0,1-16,0V104H80a8,8,0,0,1,0-16H96V72a8,8,0,0,1,16,0V88h16a8,8,0,0,1,0,16Zm96,104H168V128h56Z", "house": "M224,120v96a8,8,0,0,1-8,8H160a8,8,0,0,1-8-8V164a4,4,0,0,0-4-4H108a4,4,0,0,0-4,4v52a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V120a16,16,0,0,1,4.69-11.31l80-80a16,16,0,0,1,22.62,0l80,80A16,16,0,0,1,224,120Z", "video": "M192,72V184a16,16,0,0,1-16,16H32a16,16,0,0,1-16-16V72A16,16,0,0,1,32,56H176A16,16,0,0,1,192,72Zm58,.25a8.23,8.23,0,0,0-6.63,1.22L209.78,95.86A4,4,0,0,0,208,99.19v57.62a4,4,0,0,0,1.78,3.33l33.78,22.52a8,8,0,0,0,8.58.19,8.33,8.33,0,0,0,3.86-7.17V80A8,8,0,0,0,250,72.25Z", "pin": "M128,16a88.1,88.1,0,0,0-88,88c0,75.3,80,132.17,83.41,134.55a8,8,0,0,0,9.18,0C136,236.17,216,179.3,216,104A88.1,88.1,0,0,0,128,16Zm0,56a32,32,0,1,1-32,32A32,32,0,0,1,128,72Z", "star": "M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z"};
const M = [['عيادة', D.hospital], ['منزلي', D.house], ['أونلاين', D.video]];
const modes = M.map((m, k) => ({ l: m[0], d: m[1], on: s.mode === k, bg: s.mode === k ? '#0B1B2B' : '#FFFFFF', fg: s.mode === k ? '#FFFFFF' : '#0B1B2B', border: s.mode === k ? '0' : '1px solid rgba(11,27,43,0.08)', pick: () => this.setState({ mode: k }) }));
const pays = ['الكل', 'كاش', 'تأمين'].map((l, k) => ({ l, on: s.pay === k, bg: s.pay === k ? '#FFFFFF' : 'transparent', shadow: s.pay === k ? '0 2px 6px rgba(11,27,43,0.10)' : 'none', w: s.pay === k ? 700 : 500, pick: () => this.setState({ pay: k }) }));
const specs = [['باطنة', 'stethoscope', 'blue'], ['أسنان', 'tooth', 'mint'], ['جلدية', 'hand-heart', 'pink'], ['عيون', 'eye', 'teal'], ['قلب', 'heart', 'coral'], ['أطفال', 'baby', 'amber'], ['عظام', 'bone', 'violet']].map(x => ({ l: x[0], icon: x[1], tone: x[2] }));
const chip = (l, d, bg, fg) => ({ l, d, bg, fg });
const docs = [
{ bg: 'linear-gradient(180deg, #E7ECFF 0%, #D6DFFF 100%)', next: 'اليوم [الوقت]', delay: '80ms', modes: [chip('عيادة', D.hospital, '#E7ECFF', '#2D4FD6'), chip('منزلي', D.house, '#E1F6EE', '#0F8A68'), chip('أونلاين', D.video, '#EFEAFF', '#6A3FD1')] },
{ bg: 'linear-gradient(180deg, #FFE8EA 0%, #FFD6DA 100%)', next: 'غدًا [الوقت]', delay: '140ms', modes: [chip('عيادة', D.hospital, '#E7ECFF', '#2D4FD6'), chip('أونلاين', D.video, '#EFEAFF', '#6A3FD1')] },
];
return { modes, pays, specs, docs, pin: D.pin, star: D.star, chip58: 58, g20: 20 };
}
}
</script>
</body>
</html>
