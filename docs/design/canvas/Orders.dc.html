<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
@keyframes ndRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ndDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ndPulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes ndBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1)}36%{transform:scale(1.15)}60%{transform:scale(1)}}
@keyframes ndMove{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px"><h1 style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">طلباتي</h1></div>
<div role="radiogroup" style="display: flex; padding: 4px; border-radius: 16px; background: #EAEAEF">
<sc-for list="{{tab}}" as="sg" hint-placeholder-count="3">
<button role="radio" aria-checked="{{sg.on}}" onClick="{{sg.pick}}" style="flex-grow: 1; flex-basis: 0; height: 38px; padding: 0 14px; border-radius: 12px; border: 0; background: {{sg.bg}}; box-shadow: {{sg.shadow}}; color: #0B1B2B; font-family: inherit; font-size: 13.5px; font-weight: {{sg.w}}; white-space: nowrap; transition: background 200ms ease">{{sg.l}}</button>
</sc-for>
</div>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<a href="#" style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 14px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #0B1B2B">
<div style="display: flex; align-items: center; gap: 12px">
<dc-import name="FIcon" icon="{{o.i}}" tone="{{o.t}}" chip="soft" size="44" hint-size="44px,44px"></dc-import>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{o.title}}</span><span style="font-size: 12px; color: #6E6E73">#[الرقم] · [التاريخ]</span></div>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{o.sb}}; color: {{o.sf}}; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">{{o.st}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #EFEFF2"><span style="font-size: 15px; font-weight: 700">[المبلغ] <span style="font-size: 11px; font-weight: 400">ر.س</span></span>
<span style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #0B1B2B; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center">{{o.act}}</span></div>
</a>
</sc-for>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const s = this.state;
const mkSeg = (labels, key) => labels.map((l, k) => ({ l, on: (this.state[key] || 0) === k, bg: (this.state[key] || 0) === k ? '#FFFFFF' : 'transparent', shadow: (this.state[key] || 0) === k ? '0 2px 6px rgba(11,27,43,0.10)' : 'none', w: (this.state[key] || 0) === k ? 700 : 500, pick: () => this.setState({ [key]: k }) }));
const tab = mkSeg(['الحالية','السابقة'], 'tab');
const orders = [['طلب صيدلية','pill','coral','في الطريق','#FFE8EA','#B81E2B','تتبع'],['تحاليل منزلية','test-tube','mint','بانتظار السحب','#FFF1DB','#8A4B00','التفاصيل'],['طلب صيدلية','pill','coral','تم التوصيل','#E1F6EE','#0F8A68','أعد الطلب']].map(x => ({ title: x[0], i: x[1], t: x[2], st: x[3], sb: x[4], sf: x[5], act: x[6] }));
return { tab, orders };
}
}
</script>
</body>
</html>
