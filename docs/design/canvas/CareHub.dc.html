<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Care hub template (maternity)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
@keyframes ndRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ndDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ndPulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes ndBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1)}36%{transform:scale(1.15)}60%{transform:scale(1)}}
@keyframes ndMove{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px"><button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button><h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 19px; font-weight: 700">رعاية الأمومة</h1><button aria-label="الإعدادات" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; position: relative; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 256 256" aria-hidden="true" style="flex-shrink: 0"><path d="M216,130.16q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.6,107.6,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.29,107.29,0,0,0-26.25-10.86,8,8,0,0,0-7.06,1.48L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.6,107.6,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z" fill="#0B1B2B"></path></svg></button></div>
<div role="radiogroup" style="display: flex; padding: 4px; border-radius: 16px; background: #EAEAEF">
<sc-for list="{{mode}}" as="sg" hint-placeholder-count="3">
<button role="radio" aria-checked="{{sg.on}}" onClick="{{sg.pick}}" style="flex-grow: 1; flex-basis: 0; height: 42px; padding: 0 14px; border-radius: 12px; border: 0; background: {{sg.bg}}; box-shadow: {{sg.shadow}}; color: #0B1B2B; font-family: inherit; font-size: 14px; font-weight: {{sg.w}}; white-space: nowrap; transition: background 200ms ease">{{sg.l}}</button>
</sc-for>
</div>
<div style="border-radius: 28px; background: linear-gradient(160deg, #FFFFFF 0%, #FFEEF5 100%); border: 1px solid rgba(194,41,110,0.10); padding: 18px; display: flex; align-items: center; gap: 16px">
<svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true" style="flex-shrink: 0"><circle cx="52" cy="52" r="44" fill="none" stroke="#FBD9E8" stroke-width="10"></circle><circle cx="52" cy="52" r="44" fill="none" stroke="#D63B80" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100" transform="rotate(-90 52 52)" style="stroke-dashoffset: 45; animation: ndDraw 1200ms cubic-bezier(.65,0,.35,1) both"></circle><text x="52" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#0B1B2B" font-family="Readex Pro">[٢٢]</text><text x="52" y="70" text-anchor="middle" font-size="11" fill="#6E6E73" font-family="Readex Pro">أسبوع</text></svg>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700">الثلث الثاني</span><span style="font-size: 13px; color: #6E6E73">موعد الولادة المتوقع [التاريخ]</span><span style="font-size: 13px; color: #6E6E73">حجم الجنين تقريبًا [الوصف]</span></div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="#" style="height: 104px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 14px; text-decoration: none; color: #0B1B2B"><dc-import name="FIcon" icon="baby" tone="pink" chip="soft" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 14px; font-weight: 600">تتبع الحمل</span></a><a href="#" style="height: 104px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 14px; text-decoration: none; color: #0B1B2B"><dc-import name="FIcon" icon="chart-line-up" tone="mint" chip="soft" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 14px; font-weight: 600">نمو الطفل</span></a><a href="#" style="height: 104px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 14px; text-decoration: none; color: #0B1B2B"><dc-import name="FIcon" icon="calendar-dots" tone="violet" chip="soft" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 14px; font-weight: 600">حاسبة الولادة</span></a><a href="#" style="height: 104px; border-radius: 22px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 14px; text-decoration: none; color: #0B1B2B"><dc-import name="FIcon" icon="stethoscope" tone="blue" chip="soft" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 14px; font-weight: 600">مواعيد المتابعة</span></a>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">اقرئي هذا الأسبوع</h2><a href="#" style="font-size: 13px; color: #C8202F; text-decoration: none; font-weight: 500">كل المقالات</a></div>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); overflow: hidden"><a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #0B1B2B; border-bottom: 1px solid #EFEFF2;"><div style="width: 56px; height: 56px; border-radius: 16px; background: #F2F3F5; flex-shrink: 0"></div><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">[عنوان المقال]</span><span style="font-size: 12.5px; color: #6E6E73">[مدة القراءة] · [المصدر الطبي]</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"></path></svg></a><a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #0B1B2B; "><div style="width: 56px; height: 56px; border-radius: 16px; background: #F2F3F5; flex-shrink: 0"></div><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">[عنوان المقال]</span><span style="font-size: 12.5px; color: #6E6E73">[مدة القراءة] · [المصدر الطبي]</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"></path></svg></a></div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const s = this.state;
const mkSeg = (labels, key) => labels.map((l, k) => ({ l, on: (this.state[key] || 0) === k, bg: (this.state[key] || 0) === k ? '#FFFFFF' : 'transparent', shadow: (this.state[key] || 0) === k ? '0 2px 6px rgba(11,27,43,0.10)' : 'none', w: (this.state[key] || 0) === k ? 700 : 500, pick: () => this.setState({ [key]: k }) }));
const mode = mkSeg(['الحمل','الدورة والتبويض'], 'mode'); return { mode };
}
}
</script>
</body>
</html>
