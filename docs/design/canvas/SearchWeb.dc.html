<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Search results — desktop web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1180px; box-sizing: border-box; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif; display: flex; flex-direction: column">
<div style="height: 76px; padding: 0 64px; background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid #E5E5EA; display: flex; align-items: center; gap: 32px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 22a14 14 0 0 0 28 0" fill="none" stroke="#0B1B2B" stroke-width="5" stroke-linecap="round"></path><circle cx="24" cy="10" r="5" fill="#FF4B55"></circle></svg>
<div style="font-size: 22px; font-weight: 700">نبض<span style="color: #FF4B55">+</span></div>
</div>
<label style="flex-grow: 1; max-width: 620px; height: 48px; border-radius: 24px; background: #FFFFFF; border: 2px solid #0B1B2B; display: flex; align-items: center; gap: 10px; padding: 0 18px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14a7 7 0 0 0 0 14z M20 20l-4-4"></path></svg>
<input value="باراسيتامول" aria-label="بحث" style="flex-grow: 1; border: 0; background: transparent; font-family: inherit; font-size: 15px; outline: none">
</label>
<div style="margin-inline-start: auto; display: flex; gap: 8px">
<button aria-label="السلة" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E5E5EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5 M8 20.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0 M16 20.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0"></path></svg></button>
<button aria-label="الحساب" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E5E5EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8z M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></button>
</div>
</div>
<div style="width: 1200px; margin: 0 auto; padding: 28px 0; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: start">
<aside style="border-radius: 24px; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 17px; font-weight: 700">تصفية</div><button style="border: 0; background: transparent; font-family: inherit; font-size: 13px; color: #C8202F; padding: 6px 0">مسح الكل</button></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 14px; font-weight: 700; margin-bottom: 10px">{{g.t}}</legend>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 28px">
<span style="width: 22px; height: 22px; border-radius: 7px; border: {{it.border}}; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span>
<span style="flex-grow: 1">{{it.l}}</span><span style="font-size: 12px; color: #6E6E73">{{it.n}}</span>
</label>
</sc-for>
</fieldset>
</sc-for>
</aside>
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 26px; font-weight: 700">نتائج «باراسيتامول»</h1><div style="font-size: 14px; color: #6E6E73">[العدد] نتيجة في [المدينة]</div></div>
<label style="height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid #E5E5EA; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px">ترتيب: <span style="font-weight: 700">الأنسب</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></label>
</div>
<div role="tablist" style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="6">
<button role="tab" aria-selected="{{ch.on}}" onClick="{{ch.pick}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: {{ch.border}}; background: {{ch.bg}}; color: {{ch.fg}}; font-family: inherit; font-size: 14px; font-weight: {{ch.w}}">{{ch.l}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{cards}}" as="p" hint-placeholder-count="8">
<a href="#" style="border-radius: 24px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #0B1B2B">
<div style="height: 160px; border-radius: 18px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; position: relative"><dc-import name="PIcon" look="bare" icon="pharmacy" size="{{cardIcon}}" hint-size="64px,64px"></dc-import>
<sc-if value="{{p.sale}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 10px; right: 10px; height: 24px; padding: 0 8px; border-radius: 12px; background: #D42A38; color: #FFFFFF; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center">خصم [٪]</span></sc-if>
</div>
<div style="font-size: 14.5px; font-weight: 500; line-height: 1.4">[اسم المنتج] [التركيز]</div>
<div style="font-size: 12.5px; color: #6E6E73">[الشركة] · [حجم العبوة]</div>
<span style="align-self: flex-start; height: 22px; padding: 0 8px; border-radius: 11px; background: {{p.chipBg}}; color: {{p.chipFg}}; font-size: 11.5px; font-weight: 500; display: inline-flex; align-items: center">{{p.chip}}</span>
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-size: 17px; font-weight: 700">[السعر] <span style="font-size: 12px; font-weight: 400">ر.س</span></div>
<button aria-label="أضف للسلة" style="width: 40px; height: 40px; border-radius: 14px; border: 0; background: #0B1B2B; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
</div>
</a>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 1 }; }
renderVals() {
const s = this.state;
const chips = ['الكل', 'أدوية', 'أطباء', 'تحاليل', 'أشعة', 'صيدليات'].map((l, k) => ({ l, on: s.tab === k, bg: s.tab === k ? '#0B1B2B' : '#FFFFFF', fg: s.tab === k ? '#F5F5F7' : '#0B1B2B', border: s.tab === k ? '0' : '1px solid #E5E5EA', w: s.tab === k ? 700 : 500, pick: () => this.setState({ tab: k }) }));
const it = (l, on) => ({ l, n: '[N]', bg: on ? '#0B1B2B' : '#FFFFFF', border: on ? '0' : '1.5px solid #C7C7CC' });
const groups = [
{ t: 'الوصفة', items: [it('بدون وصفة', true), it('يحتاج وصفة', false)] },
{ t: 'التوفر', items: [it('متوفر قريبًا مني', true), it('توصيل اليوم', false)] },
{ t: 'التأمين', items: [it('مشمول في تأميني', false)] },
{ t: 'الشكل', items: [it('أقراص', false), it('شراب', false), it('فوار', false)] },
];
const T = ['#F2F3F5','#F2F3F5','#F2F3F5','#F2F3F5','#F2F3F5','#F2F3F5','#F2F3F5','#F2F3F5'];
const cards = T.map((tint, k) => ({ tint, sale: k === 1 || k === 4, chip: k === 6 ? 'يحتاج وصفة' : 'بدون وصفة', chipBg: k === 6 ? '#FFF4D6' : '#DDF4EC', chipFg: k === 6 ? '#6B4600' : '#1F7A5C' }));
return { chips, groups, cards, cardIcon: 64 };
}
}
</script>
</body>
</html>
