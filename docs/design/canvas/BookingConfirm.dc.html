<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Booking confirm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
@keyframes ndRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ndDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ndPulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes ndBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1)}36%{transform:scale(1.15)}60%{transform:scale(1)}}
@keyframes ndMove{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1180px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 54px 16px 130px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px"><button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button><h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 19px; font-weight: 700">تأكيد الحجز</h1><div style="width: 44px; flex-shrink: 0"></div></div>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 16px; display: flex; flex-direction: column; gap: 14px; "><div style="display: flex; gap: 12px; align-items: center"><div style="width: 64px; height: 72px; border-radius: 50% 46% 48% 52% / 46% 48% 52% 54%; background: linear-gradient(180deg, #E7ECFF 0%, #D6DFFF 100%); flex-shrink: 0"></div><div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700">د. [اسم الطبيب]</span><span style="font-size: 12.5px; color: #6E6E73">[التخصص] · [المنشأة]</span></div></div><div style="display: flex; align-items: center; gap: 10px"><dc-import name="FIcon" icon="video-camera" tone="violet" chip="soft" size="38" hint-size="38px,38px"></dc-import><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #6E6E73">نوع الاستشارة</span><span style="font-size: 14.5px; font-weight: 600">فيديو</span></div></div><div style="display: flex; align-items: center; gap: 10px"><dc-import name="FIcon" icon="calendar-dots" tone="coral" chip="soft" size="38" hint-size="38px,38px"></dc-import><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #6E6E73">الموعد</span><span style="font-size: 14.5px; font-weight: 600">[اليوم] · [الوقت]</span></div></div><div style="display: flex; align-items: center; gap: 10px"><dc-import name="FIcon" icon="clock-counter-clockwise" tone="teal" chip="soft" size="38" hint-size="38px,38px"></dc-import><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #6E6E73">المدة</span><span style="font-size: 14.5px; font-weight: 600">[N] دقيقة</span></div></div></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">سبب الزيارة</h2><span style="font-size: 12.5px; color: #6E6E73">اختياري</span></div>
<textarea placeholder="اكتب الأعراض باختصار، تساعد الطبيب يجهز" style="height: 96px; border-radius: 18px; border: 1px solid rgba(11,27,43,0.1); padding: 12px 14px; font-family: inherit; font-size: 15px; resize: none; outline: none"></textarea>
<button style="height: 56px; border-radius: 18px; border: 1.5px dashed rgba(11,27,43,0.2); background: transparent; font-family: inherit; color: #0B1B2B; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" style="flex-shrink: 0"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,176H96a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm0-32H96a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm-8-56V44l44,44Z" fill="#0B1B2B"></path></svg>إرفاق تقارير أو تحاليل سابقة</button>
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">طريقة الدفع</h2></div>
<div role="radiogroup" style="display: flex; padding: 4px; border-radius: 16px; background: #EAEAEF">
<sc-for list="{{pay}}" as="sg" hint-placeholder-count="3">
<button role="radio" aria-checked="{{sg.on}}" onClick="{{sg.pick}}" style="flex-grow: 1; flex-basis: 0; height: 38px; padding: 0 14px; border-radius: 12px; border: 0; background: {{sg.bg}}; box-shadow: {{sg.shadow}}; color: #0B1B2B; font-family: inherit; font-size: 13.5px; font-weight: {{sg.w}}; white-space: nowrap; transition: background 200ms ease">{{sg.l}}</button>
</sc-for>
</div>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 16px; display: flex; flex-direction: column; gap: 10px; "><div style="display: flex; justify-content: space-between; font-size: 14px; color: #6E6E73"><span>رسوم الاستشارة</span><span style="font-weight: 500">[المبلغ] ر.س</span></div><div style="display: flex; justify-content: space-between; font-size: 14px; color: #1F7A5C"><span>خصم النقاط</span><span style="font-weight: 600">− [المبلغ] ر.س</span></div><div style="height: 1px; background: #EFEFF2"></div><div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 700"><span>الإجمالي</span><span>[المبلغ] ر.س</span></div></div>

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px; background: rgba(245,245,247,0.86); backdrop-filter: blur(24px); border-top: 1px solid rgba(11,27,43,0.06); display: flex; gap: 10px; align-items: center"><button style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: linear-gradient(180deg, #E8384A 0%, #D42A38 100%); box-shadow: 0 10px 22px rgba(212,42,56,0.28), inset 0 1px 0 rgba(255,255,255,0.25); color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; ">تأكيد الحجز والدفع</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const s = this.state;
const mkSeg = (labels, key) => labels.map((l, k) => ({ l, on: (this.state[key] || 0) === k, bg: (this.state[key] || 0) === k ? '#FFFFFF' : 'transparent', shadow: (this.state[key] || 0) === k ? '0 2px 6px rgba(11,27,43,0.10)' : 'none', w: (this.state[key] || 0) === k ? 700 : 500, pick: () => this.setState({ [key]: k }) }));
const pay = mkSeg(['دفع مباشر','عبر التأمين'], 'pay'); return { pay };
}
}
</script>
</body>
</html>
