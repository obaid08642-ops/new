<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Doctor profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1120px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="height: 250px; background: #E3E9FF; position: relative; overflow: hidden">
<div style="position: absolute; width: 220px; height: 220px; border-radius: 110px; background: #D3DCFF; top: -70px; left: -60px"></div>
<div style="position: absolute; width: 120px; height: 120px; border-radius: 60px; background: #F4B8E4; opacity: 0.5; top: 110px; right: -30px"></div>
<div style="position: absolute; top: 56px; right: 20px; left: 20px; display: flex; justify-content: space-between">
<button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<div style="display: flex; gap: 8px">
<button aria-label="مشاركة" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3 M7 8l5-5 5 5 M5 13v7h14v-7"></path></svg>
</button>
<button aria-label="المفضلة" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D42A38" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>
</button>
</div>
</div>
</div>
<div style="margin: -120px 16px 0; position: relative; border-radius: 32px; background: #FFFFFF; box-shadow: 0 16px 40px rgba(11,27,43,0.08); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 112px; height: 112px; border-radius: 36px; background: #F5F5F7; border: 4px solid #FFFFFF; box-shadow: 0 8px 20px rgba(11,27,43,0.10); display: flex; align-items: center; justify-content: center; margin-top: -60px">
<dc-import name="Icon" icon="doctor" size="{{avatar}}" hint-size="84px,84px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<div style="font-size: 21px; font-weight: 700">د. [اسم الطبيب]</div>
<svg width="20" height="20" viewBox="0 0 24 24" aria-label="موثّق"><path d="M12 2l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z" fill="#3A56D4"></path><path d="M8.5 12.2l2.3 2.3 4.7-4.7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<div style="font-size: 14px; color: #6E6E73">[التخصص] · [المستشفى أو العيادة]</div>
<div style="width: 100%; display: flex; gap: 8px; margin-top: 6px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="flex-grow: 1; flex-basis: 0; border-radius: 18px; background: {{s.bg}}; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 17px; font-weight: 700; color: {{s.fg}}">{{s.v}}</div>
<div style="font-size: 12px; color: #6E6E73">{{s.l}}</div>
</div>
</sc-for>
</div>
</div>
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 17px; font-weight: 700">اختر نوع الاستشارة</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button style="flex-grow: 1; flex-basis: 0; border-radius: 22px; border: {{m.border}}; background: #FFFFFF; box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: inherit; color: #0B1B2B" onClick="{{m.pick}}">
<div style="width: 44px; height: 44px; border-radius: 14px; background: {{m.tint}}; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{m.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
</div>
<span style="font-size: 13.5px; font-weight: 500">{{m.label}}</span>
<span style="font-size: 12.5px; color: #6E6E73">[السعر]</span>
</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 17px; font-weight: 700">أقرب المواعيد</div>
<a href="#" style="font-size: 13px; color: #C8202F; text-decoration: none">كل المواعيد</a>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
<button style="flex-grow: 1; height: 58px; border-radius: 18px; border: {{s.border}}; background: {{s.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; color: #0B1B2B" onClick="{{s.pick}}">
<span style="font-size: 12px; color: #6E6E73">{{s.day}}</span><span style="font-size: 15px; font-weight: 700">{{s.t}}</span>
</button>
</sc-for>
</div>
<div style="border-radius: 22px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 18px rgba(11,27,43,0.05)">
<div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F7A5C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9c-4.5-1-8-4-8-9V6z M9 12l2 2 4-4"></path></svg>
يقبل التأمين</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: #F5F5F7; font-size: 12.5px; display: inline-flex; align-items: center">[شركة تأمين]</span>
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: #F5F5F7; font-size: 12.5px; display: inline-flex; align-items: center">[شركة تأمين]</span>
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: #F5F5F7; font-size: 12.5px; display: inline-flex; align-items: center">+[العدد]</span>
</div>
</div>
<div style="border-radius: 22px; background: #FFFFFF; overflow: hidden; box-shadow: 0 6px 18px rgba(11,27,43,0.05)">
<div style="height: 96px; background: #EAF1FF; position: relative">
<div style="position: absolute; inset: 0; background-image: linear-gradient(#DCE5FF 1px, transparent 1px), linear-gradient(90deg, #DCE5FF 1px, transparent 1px); background-size: 22px 22px"></div>
<div style="position: absolute; top: 30px; right: 170px; width: 36px; height: 36px; border-radius: 18px 18px 18px 4px; background: #D42A38; transform: rotate(-45deg); box-shadow: 0 6px 12px rgba(212,42,56,0.35)"></div>
</div>
<div style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 500">[اسم العيادة]</div>
<div style="font-size: 12.5px; color: #6E6E73">[الحي]، [المدينة] · على بعد حوالي [المسافة] كم</div>
</div>
<a href="#" style="font-size: 13px; color: #C8202F; text-decoration: none">الاتجاهات</a>
</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 34px; background: rgba(255,255,255,0.82); backdrop-filter: blur(20px); border-top: 1px solid rgba(11,27,43,0.06); display: flex; gap: 10px">
<button aria-label="محادثة" style="width: 56px; height: 56px; border-radius: 18px; border: 1.5px solid #0B1B2B; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
</button>
<button style="flex-grow: 1; height: 56px; border-radius: 18px; border: 0; background: #D42A38; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 0, slot: 0 }; }
renderVals() {
const s = this.state;
const stats = [
{ v: '[N] سنة', l: 'الخبرة', bg: '#E3E9FF', fg: '#3A56D4' },
{ v: '[N]', l: 'استشارة', bg: '#DDF4EC', fg: '#1F7A5C' },
{ v: '[N.N]', l: 'التقييم', bg: '#FFF1CC', fg: '#8A5A00' },
];
const md = [
['فيديو', 'M3 7h12v10H3z M15 10l6-3v10l-6-3', '#E3E9FF', '#3A56D4'],
['في العيادة', 'M4 21V8l8-5 8 5v13 M10 21v-5h4v5 M12 8v4 M10 10h4', '#DDF4EC', '#1F7A5C'],
['زيارة منزلية', 'M3 11.5L12 4l9 7.5 M5 10v10h14V10', '#FFF1CC', '#8A5A00'],
];
const modes = md.map((m, k) => ({ label: m[0], d: m[1], tint: m[2], fg: m[3], border: s.mode === k ? '2px solid #0B1B2B' : '1px solid rgba(11,27,43,0.04)', pick: () => this.setState({ mode: k }) }));
const sd = [['اليوم', '٤:٣٠ م'], ['غدًا', '١٠:٠٠ ص'], ['الخميس', '٧:٠٠ م']];
const slots = sd.map((x, k) => ({ day: x[0], t: x[1], bg: s.slot === k ? '#FFE3E5' : '#FFFFFF', border: s.slot === k ? '2px solid #D42A38' : '1px solid rgba(11,27,43,0.06)', pick: () => this.setState({ slot: k }) }));
const cta = 'احجز ' + md[s.mode][0] + ' · ' + sd[s.slot][0] + ' ' + sd[s.slot][1];
return { stats, modes, slots, cta, avatar: 84 };
}
}
</script>
</body>
</html>
