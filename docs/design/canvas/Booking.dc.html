<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>One-screen doctor booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E5E5EA">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #E3E9FF; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3A56D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 17px; font-weight: 700">د. [اسم الطبيب]</div>
<div style="font-size: 13px; color: #5B6470">[التخصص] · [سنوات الخبرة]</div>
<div style="font-size: 12.5px; color: #1F7A5C">يقبل [شركات التأمين]</div>
</div>
</div>
<div style="font-size: 15px; font-weight: 700">نوع الاستشارة</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button style="flex-grow: 1; height: 72px; border-radius: 18px; border: {{m.border}}; background: {{m.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; color: #0B1B2B; padding: 0" onClick="{{m.pick}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
{{m.label}}
</button>
</sc-for>
</div>
<div style="font-size: 15px; font-weight: 700">اليوم</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<button style="width: 62px; height: 72px; border-radius: 18px; border: 0; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; padding: 0" onClick="{{d.pick}}">
<span style="font-size: 12px">{{d.name}}</span><span style="font-size: 18px; font-weight: 700">{{d.num}}</span>
</button>
</sc-for>
</div>
<div style="font-size: 15px; font-weight: 700">الوقت المتاح</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<button style="height: 44px; border-radius: 14px; border: {{s.border}}; background: {{s.bg}}; font-family: inherit; font-size: 14px; color: #0B1B2B; padding: 0" onClick="{{s.pick}}">{{s.t}}</button>
</sc-for>
</div>
<div style="display: flex; padding: 4px; border-radius: 16px; background: #E8E8ED">
<button style="flex-grow: 1; height: 42px; border-radius: 12px; border: 0; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #0B1B2B">تأمين</button>
<button style="flex-grow: 1; height: 42px; border-radius: 12px; border: 0; background: transparent; font-family: inherit; font-size: 14px; color: #0B1B2B">دفع مباشر</button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 34px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid #E5E5EA">
<button style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: #D42A38; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">احجز الموعد</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 0, day: 0, slot: 2 }; }
renderVals() {
const s = this.state;
const modeDefs = [
['فيديو', 'M3 7h12v10H3z M15 10l6-3v10l-6-3'],
['في العيادة', 'M4 21V8l8-5 8 5v13 M10 21v-5h4v5 M12 8v4 M10 10h4'],
['زيارة منزلية', 'M3 11.5L12 4l9 7.5 M5 10v10h14V10'],
];
const modes = modeDefs.map((m, k) => ({ label: m[0], d: m[1], bg: s.mode === k ? '#FFFFFF' : 'transparent', border: s.mode === k ? '2px solid #0B1B2B' : '1px solid #D8D8DE', pick: () => this.setState({ mode: k }) }));
const dayDefs = [['اليوم', '١٤'], ['غدًا', '١٥'], ['الخميس', '١٦'], ['الجمعة', '١٧'], ['السبت', '١٨']];
const days = dayDefs.map((d, k) => ({ name: d[0], num: d[1], bg: s.day === k ? '#0B1B2B' : '#FFFFFF', fg: s.day === k ? '#F5F5F7' : '#0B1B2B', pick: () => this.setState({ day: k }) }));
const slotDefs = ['٩:٠٠', '٩:٣٠', '١٠:٠٠', '١١:٠٠', '٤:٠٠', '٤:٣٠', '٦:٠٠', '٧:٣٠'];
const slots = slotDefs.map((t, k) => ({ t, bg: s.slot === k ? '#FFE3E5' : '#FFFFFF', border: s.slot === k ? '2px solid #D42A38' : '1px solid #E5E5EA', pick: () => this.setState({ slot: k }) }));
return { modes, days, slots };
}
}
</script>
</body>
</html>
