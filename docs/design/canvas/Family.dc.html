<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Family</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
@keyframes ndRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ndDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ndPulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes ndBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1)}36%{transform:scale(1.15)}60%{transform:scale(1)}}
@keyframes ndMove{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1060px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 54px 16px 40px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px"><h1 style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">عائلتي</h1><button aria-label="إضافة فرد" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; position: relative; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 256 256" aria-hidden="true" style="flex-shrink: 0"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM184,136H136v48a8,8,0,0,1-16,0V136H72a8,8,0,0,1,0-16h48V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z" fill="#0B1B2B"></path></svg></button></div>
<div style="border-radius: 26px; background: linear-gradient(160deg, #FFFFFF 0%, #FFF0E8 100%); border: 1px solid rgba(194,80,30,0.10); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><dc-import name="FIcon" icon="users-three" tone="peach" chip="solid" size="52" hint-size="52px,52px"></dc-import><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">اطلب واحجز لعائلتك</span><span style="font-size: 12.5px; color: #6E6E73">كل فرد له ملف صحي وصلاحيات تتحكم فيها</span></div></div>
<div style="display: flex; gap: 8px"><button style="flex-grow: 1; height: 44px; border-radius: 14px; border: 0; background: #0B1B2B; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600">إضافة فرد</button><button style="flex-grow: 1; height: 44px; border-radius: 14px; border: 1.5px solid #0B1B2B; background: transparent; color: #0B1B2B; font-family: inherit; font-size: 14px; font-weight: 600">دعوة برابط</button></div></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">الأفراد</h2></div>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); overflow: hidden"><sc-for list="{{fam}}" as="m" hint-placeholder-count="3">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #0B1B2B; border-bottom: {{m.line}}">
<div style="width: 48px; height: 48px; border-radius: 24px; background: {{m.bg}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: {{m.fg}}; flex-shrink: 0">{{m.ini}}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{m.n}}</span><span style="font-size: 12px; color: #6E6E73">{{m.r}}</span></div>
<span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #F0F0F3; color: #3C4651; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap">{{m.perm}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"></path></svg></a>
</sc-for></div>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); overflow: hidden"><a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #0B1B2B; border-bottom: 1px solid #EFEFF2;"><dc-import name="FIcon" icon="calendar-dots" tone="coral" chip="soft" size="40" hint-size="40px,40px"></dc-import><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">تقويم العائلة</span><span style="font-size: 12.5px; color: #6E6E73">مواعيد وأدوية الجميع</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"></path></svg></a><a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #0B1B2B; border-bottom: 1px solid #EFEFF2;"><dc-import name="FIcon" icon="lock" tone="blue" chip="soft" size="40" hint-size="40px,40px"></dc-import><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">الصلاحيات</span><span style="font-size: 12.5px; color: #6E6E73">من يشوف ويطلب لمن</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"></path></svg></a><a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: #0B1B2B; "><dc-import name="FIcon" icon="address-book" tone="amber" chip="soft" size="40" hint-size="40px,40px"></dc-import><div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">جهات الطوارئ</span><span style="font-size: 12.5px; color: #6E6E73">[N] جهات</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A9AA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"></path></svg></a></div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const s = this.state;
const mkSeg = (labels, key) => labels.map((l, k) => ({ l, on: (this.state[key] || 0) === k, bg: (this.state[key] || 0) === k ? '#FFFFFF' : 'transparent', shadow: (this.state[key] || 0) === k ? '0 2px 6px rgba(11,27,43,0.10)' : 'none', w: (this.state[key] || 0) === k ? 700 : 500, pick: () => this.setState({ [key]: k }) }));
const fam = [['[الاسم]','الزوجة','[ح]','#FFE7F1','#C2296E','كامل'],['[الاسم]','الابن · [العمر]','[م]','#E7ECFF','#2D4FD6','مُدار'],['[الاسم]','الأم','[ف]','#E1F6EE','#0F8A68','مشاهدة']].map((x, k) => ({ n: x[0], r: x[1], ini: x[2], bg: x[3], fg: x[4], perm: x[5], line: k < 2 ? '1px solid #EFEFF2' : '0' }));
return { fam };
}
}
</script>
</body>
</html>
