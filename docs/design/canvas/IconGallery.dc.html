<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Premium vector icon set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
</style>
</helmet>
<div dir="rtl" style="width: 1200px; height: 900px; box-sizing: border-box; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif; padding: 48px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="font-size: 30px; font-weight: 700">أيقونات الخدمات</div><div style="font-size: 15px; color: #6E6E73">رسم متجه بلونين: خط داكن دقيق وتعبئة ناعمة بلون القسم. نفس السُمك والزوايا في كل الأيقونات.</div></div>
<div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{services}}" as="s" hint-placeholder-count="11">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<dc-import name="PIcon" icon="{{s.k}}" look="tile" size="{{big}}" hint-size="80px,80px"></dc-import>
<div style="font-size: 12.5px; font-weight: 500; text-align: center">{{s.l}}</div>
</div>
</sc-for>
</div>
<div style="border-radius: 32px; background: #0B1B2B; padding: 28px; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{services}}" as="s" hint-placeholder-count="11">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<dc-import name="PIcon" icon="{{s.k}}" look="tileDark" size="{{big}}" hint-size="80px,80px"></dc-import>
<div style="font-size: 12.5px; font-weight: 500; color: #F5F5F7; text-align: center">{{s.l}}</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px"><div style="font-size: 18px; font-weight: 700">أيقونات الواجهة</div>
<div style="display: flex; gap: 22px; flex-wrap: wrap">
<sc-for list="{{ui}}" as="u" hint-placeholder-count="16">
<dc-import name="PIcon" icon="{{u}}" tone="ink" look="bare" size="{{small}}" hint-size="28px,28px"></dc-import>
</sc-for>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const services = [['pharmacy', 'الصيدلية'], ['consult', 'استشارة'], ['lab', 'تحاليل'], ['radiology', 'أشعة'], ['nursing', 'تمريض'], ['mind', 'صحة نفسية'], ['nutrition', 'تغذية'], ['family', 'العائلة'], ['maternity', 'الأمومة'], ['chronic', 'مزمنة'], ['doctor', 'الطبيب']].map(x => ({ k: x[0], l: x[1] }));
const ui = ['house', 'magnifying-glass', 'bell', 'globe', 'moon', 'sun', 'map-pin', 'shield-check', 'calendar-dots', 'video-camera', 'heart', 'drop', 'smiley', 'barcode', 'hospital', 'syringe', 'bandaids', 'sparkle'];
return { services, ui, big: 80, small: 28 };
}
}
</script>
</body>
</html>
