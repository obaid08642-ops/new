<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Checkout (payment)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
a{color:#C8202F}
@keyframes ndRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ndDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ndPulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes ndBeat{0%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1)}36%{transform:scale(1.15)}60%{transform:scale(1)}}
@keyframes ndMove{0%{transform:translateX(0)}100%{transform:translateX(-60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 1100px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 54px 16px 130px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 10px"><button aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(11,27,43,0.08); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button><h1 style="margin: 0; flex-grow: 1; text-align: center; font-size: 19px; font-weight: 700">الدفع</h1><div style="width: 44px; flex-shrink: 0"></div></div>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 14px; display: flex; flex-direction: column; gap: 12px; "><div style="display: flex; align-items: center; gap: 12px"><dc-import name="FIcon" icon="storefront" tone="coral" chip="soft" size="44" hint-size="44px,44px"></dc-import><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">[اسم الصيدلية]</span><span style="font-size: 12.5px; color: #6E6E73">يصل خلال [الوقت] · إلى [العنوان]</span></div></div></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 700">طريقة الدفع</h2></div>
<div role="radiogroup" style="display: flex; padding: 4px; border-radius: 16px; background: #EAEAEF">
<sc-for list="{{kind}}" as="sg" hint-placeholder-count="3">
<button role="radio" aria-checked="{{sg.on}}" onClick="{{sg.pick}}" style="flex-grow: 1; flex-basis: 0; height: 38px; padding: 0 14px; border-radius: 12px; border: 0; background: {{sg.bg}}; box-shadow: {{sg.shadow}}; color: #0B1B2B; font-family: inherit; font-size: 13.5px; font-weight: {{sg.w}}; white-space: nowrap; transition: background 200ms ease">{{sg.l}}</button>
</sc-for>
</div>
<sc-if value="{{direct}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; gap: 8px"><sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.pick}}" style="height: 60px; border-radius: 18px; border: {{m.border}}; background: #FFFFFF; font-family: inherit; color: #0B1B2B; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: start">
<div style="width: 46px; height: 32px; border-radius: 8px; background: #F2F3F5; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #6E6E73; flex-shrink: 0">[شعار]</div>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{m.l}}</span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: {{m.ring}}; box-sizing: border-box; flex-shrink: 0"></span></button>
</sc-for></div></sc-if>
<sc-if value="{{ins}}" hint-placeholder-val="{{false}}"><div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 16px; display: flex; flex-direction: column; gap: 12px; "><div style="display: flex; align-items: center; gap: 12px"><dc-import name="FIcon" icon="shield-check" tone="blue" chip="soft" size="44" hint-size="44px,44px"></dc-import><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">[شركة التأمين] · [الفئة]</span><span style="font-size: 12.5px; color: #6E6E73">الصيدلية تطلب الموافقة، وأنت تدفع نسبة التحمل فقط</span></div></div><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #6E6E73">نسبة التحمل</span><span style="font-weight: 700">[المبلغ] ر.س</span></div></div></sc-if>
<div style="border-radius: 24px; background: #FFFFFF; border: 1px solid rgba(11,27,43,0.06); box-shadow: 0 6px 18px rgba(11,27,43,0.05); padding: 16px; display: flex; flex-direction: column; gap: 10px; "><div style="display: flex; justify-content: space-between; font-size: 14px; color: #6E6E73"><span>الأصناف ([N])</span><span style="font-weight: 500">[المبلغ] ر.س</span></div><div style="display: flex; justify-content: space-between; font-size: 14px; color: #6E6E73"><span>التوصيل</span><span style="font-weight: 500">[المبلغ] ر.س</span></div><div style="display: flex; justify-content: space-between; font-size: 14px; color: #1F7A5C"><span>خصم النقاط</span><span style="font-weight: 600">− [المبلغ] ر.س</span></div><div style="display: flex; justify-content: space-between; font-size: 14px; color: #6E6E73"><span>الضريبة</span><span style="font-weight: 500">شاملة</span></div><div style="height: 1px; background: #EFEFF2"></div><div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 700"><span>الإجمالي</span><span>[المبلغ] ر.س</span></div></div>

</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px; background: rgba(245,245,247,0.86); backdrop-filter: blur(24px); border-top: 1px solid rgba(11,27,43,0.06); display: flex; gap: 10px; align-items: center"><button style="width: 100%; height: 56px; border-radius: 18px; border: 0; background: linear-gradient(180deg, #E8384A 0%, #D42A38 100%); box-shadow: 0 10px 22px rgba(212,42,56,0.28), inset 0 1px 0 rgba(255,255,255,0.25); color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; ">ادفع [المبلغ] ر.س</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = {}; }
renderVals() {
const s = this.state;
const mkSeg = (labels, key) => labels.map((l, k) => ({ l, on: (this.state[key] || 0) === k, bg: (this.state[key] || 0) === k ? '#FFFFFF' : 'transparent', shadow: (this.state[key] || 0) === k ? '0 2px 6px rgba(11,27,43,0.10)' : 'none', w: (this.state[key] || 0) === k ? 700 : 500, pick: () => this.setState({ [key]: k }) }));
const kind = mkSeg(['دفع مباشر','عبر التأمين'], 'kind');
const methods = ['Apple Pay','مدى','بطاقة ائتمانية'].map((l, k) => ({ l, border: (s.m||0) === k ? '2px solid #0B1B2B' : '1px solid rgba(11,27,43,0.08)', ring: (s.m||0) === k ? '7px solid #D42A38' : '2px solid #C7C7CC', pick: () => this.setState({ m: k }) }));
return { kind, methods, direct: (s.kind||0) === 0, ins: s.kind === 1 };
}
}
</script>
</body>
</html>
