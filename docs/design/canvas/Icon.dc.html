<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Nabd+ illustrated icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
<sc-if value="{{is.pharmacy}}" hint-placeholder-val="{{true}}">
<g transform="rotate(-40 22 22)">
<rect x="6" y="15" width="32" height="14" rx="7" fill="#FFFFFF"></rect>
<path d="M13 15 H22 V29 H13 A7 7 0 0 1 13 15 Z" fill="#FF6B73"></path>
<rect x="6" y="15" width="32" height="14" rx="7" stroke="#0B1B2B" stroke-width="2.2"></rect>
<path d="M22 15 V29" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M27 19.5 h6" stroke="#0B1B2B" stroke-width="2" opacity="0.3"></path>
</g>
<circle cx="36" cy="36" r="7" fill="#FFD166" stroke="#0B1B2B" stroke-width="2.2"></circle>
<path d="M32 36 h8" stroke="#0B1B2B" stroke-width="2"></path>
</sc-if>
<sc-if value="{{is.consult}}" hint-placeholder-val="{{false}}">
<path d="M18 17 v-4 a3 3 0 0 1 3-3 h6 a3 3 0 0 1 3 3 v4" stroke="#0B1B2B" stroke-width="2.2"></path>
<rect x="7" y="17" width="34" height="24" rx="7" fill="#9DB0FF" stroke="#0B1B2B" stroke-width="2.2"></rect>
<path d="M11 21 h26" stroke="#6E8BFF" stroke-width="3"></path>
<path d="M24 24 v11 M18.5 29.5 h11" stroke="#FFFFFF" stroke-width="4"></path>
</sc-if>
<sc-if value="{{is.lab}}" hint-placeholder-val="{{false}}">
<g transform="rotate(28 22 26)">
<path d="M17 25 V36 a5 5 0 0 0 10 0 V25 Z" fill="#3FBF9A"></path>
<path d="M17 8 V36 a5 5 0 0 0 10 0 V8" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M15 8 h14" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M17 25 h10" stroke="#0B1B2B" stroke-width="2"></path>
<path d="M20 14 v6" stroke="#0B1B2B" stroke-width="1.8" opacity="0.3"></path>
</g>
<circle cx="37" cy="11" r="3.5" fill="#FFD166" stroke="#0B1B2B" stroke-width="2"></circle>
<circle cx="41" cy="20" r="2.2" fill="#6FE0B8"></circle>
</sc-if>
<sc-if value="{{is.radiology}}" hint-placeholder-val="{{false}}">
<rect x="7" y="7" width="34" height="34" rx="9" fill="#C3A8FF" stroke="#0B1B2B" stroke-width="2.2"></rect>
<path d="M24 12 v24" stroke="#FFFFFF" stroke-width="3.2"></path>
<path d="M16 17 c3 1.2 5.5 1.2 8 0 M32 17 c-3 1.2-5.5 1.2-8 0 M15 23.5 c4 1.6 6.5 1.6 9 0 M33 23.5 c-4 1.6-6.5 1.6-9 0 M16 30 c3 1.2 5.5 1.2 8 0 M32 30 c-3 1.2-5.5 1.2-8 0" stroke="#FFFFFF" stroke-width="2.2"></path>
<circle cx="37" cy="11" r="2" fill="#FFD166"></circle>
</sc-if>
<sc-if value="{{is.nursing}}" hint-placeholder-val="{{false}}">
<path d="M10 23 L24 11 L38 23 V40 H10 Z" fill="#FFD166" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M6 25 L24 9 L42 25" stroke="#FF6B73" stroke-width="3.6"></path>
<path d="M24 36 s-7-4.4-7-9 a3.5 3.5 0 0 1 7-1.2 a3.5 3.5 0 0 1 7 1.2 c0 4.6-7 9-7 9 z" fill="#FFFFFF" stroke="#0B1B2B" stroke-width="2"></path>
</sc-if>
<sc-if value="{{is.mind}}" hint-placeholder-val="{{false}}">
<path d="M23 10 a6 6 0 0 0-10 3 a6 6 0 0 0-3 10 a6 6 0 0 0 4 9 a6 6 0 0 0 9 4 Z" fill="#D2B8FF" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M25 10 a6 6 0 0 1 10 3 a6 6 0 0 1 3 10 a6 6 0 0 1-4 9 a6 6 0 0 1-9 4 Z" fill="#F4B8E4" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M14 20 c2 0 3 1.5 3 3 M34 20 c-2 0-3 1.5-3 3" stroke="#0B1B2B" stroke-width="1.8" opacity="0.4"></path>
<path d="M41 4 l1.4 3.4 3.4 1.4-3.4 1.4 L41 13.6 l-1.4-3.4 L36.2 8.8 l3.4-1.4 z" fill="#FFD166"></path>
</sc-if>
<sc-if value="{{is.nutrition}}" hint-placeholder-val="{{false}}">
<path d="M24 16 c-3-3-14-2-14 9 c0 9 6 15 10 15 c2 0 3-1 4-1 s2 1 4 1 c4 0 10-6 10-15 c0-11-11-12-14-9 z" fill="#8EDC5E" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M24 16 c0-4 2-7 6-8" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M27 11 c3-4 8-3 9-1 c-2 3-6 4-9 1 z" fill="#3FBF9A" stroke="#0B1B2B" stroke-width="1.8"></path>
<path d="M15 23 c1-3 3-4 5-4" stroke="#FFFFFF" stroke-width="2.6" opacity="0.8"></path>
</sc-if>
<sc-if value="{{is.family}}" hint-placeholder-val="{{false}}">
<circle cx="17" cy="15" r="6" fill="#FFB38A" stroke="#0B1B2B" stroke-width="2.2"></circle>
<circle cx="32" cy="18" r="5" fill="#9DB0FF" stroke="#0B1B2B" stroke-width="2.2"></circle>
<path d="M7 40 c0-7 4.5-12 10-12 s10 5 10 12 z" fill="#FF6B73" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M24 40 c0-6 3.5-10 8-10 s8 4 8 10 z" fill="#6E8BFF" stroke="#0B1B2B" stroke-width="2.2"></path>
</sc-if>
<sc-if value="{{is.doctor}}" hint-placeholder-val="{{false}}">
<path d="M10 42 c0-8 6-13 14-13 s14 5 14 13 z" fill="#FFFFFF" stroke="#0B1B2B" stroke-width="2.2"></path>
<path d="M20 29.5 l4 6 4-6" stroke="#0B1B2B" stroke-width="2"></path>
<circle cx="24" cy="17" r="8" fill="#FFB38A" stroke="#0B1B2B" stroke-width="2.2"></circle>
<path d="M16 16 c1-6 5-8 8-8 s7 2 8 8 c-3-2-6-3-8-3 s-5 1-8 3 z" fill="#0B1B2B"></path>
<path d="M31 33 v4 a3 3 0 0 1-6 0" stroke="#6E8BFF" stroke-width="2"></path>
<circle cx="25" cy="38.5" r="2" fill="#6E8BFF"></circle>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["pharmacy","consult","lab","radiology","nursing","mind","nutrition","family","doctor"],"default":"pharmacy"},"size":{"editor":"int","default":48,"min":16,"max":240},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
renderVals() {
const n = this.props.icon ?? 'pharmacy';
const size = Number(this.props.size ?? 48);
const is = {};
['pharmacy','consult','lab','radiology','nursing','mind','nutrition','family','doctor'].forEach(k => { is[k] = n === k; });
return { is, size, px: size + 'px' };
}
}
</script>
</body>
</html>
