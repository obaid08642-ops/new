<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>One-page checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Readex Pro',sans-serif}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F5F7; color: #0B1B2B; font-family: 'Readex Pro', sans-serif">
<div style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<button aria-label="رجوع" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #E5E5EA; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1B2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<div style="font-size: 20px; font-weight: 700">إتمام الطلب</div>
</div>
<div style="font-size: 13px; color: #5B6470">كل الخطوات في صفحة واحدة — الاختيارات محفوظة من طلبك السابق</div>
<div style="display: flex; padding: 4px; border-radius: 16px; background: #E8E8ED">
<button style="flex-grow: 1; height: 44px; border-radius: 12px; border: 0; background: {{d1}}; font-family: inherit; font-size: 14px; font-weight: 500; color: #0B1B2B" onClick="{{setDelivery}}">توصيل</button>
<button style="flex-grow: 1; height: 44px; border-radius: 12px; border: 0; background: {{d2}}; font-family: inherit; font-size: 14px; font-weight: 500; color: #0B1B2B" onClick="{{setPickup}}">استلام من الصيدلية</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E5E5EA">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #FFE3E5; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B81E2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z M9.5 9a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0"></path></svg>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 500">{{placeTitle}}</div>
<div style="font-size: 12.5px; color: #5B6470">{{placeSub}}</div>
</div>
<a href="#" style="font-size: 13px; color: #C8202F; text-decoration: none">تغيير</a>
</div>
<div style="display: flex; padding: 4px; border-radius: 16px; background: #E8E8ED">
<button style="flex-grow: 1; height: 44px; border-radius: 12px; border: 0; background: {{p1}}; font-family: inherit; font-size: 14px; font-weight: 500; color: #0B1B2B" onClick="{{setCash}}">دفع مباشر</button>
<button style="flex-grow: 1; height: 44px; border-radius: 12px; border: 0; background: {{p2}}; font-family: inherit; font-size: 14px; font-weight: 500; color: #0B1B2B" onClick="{{setIns}}">تأمين</button>
</div>
<sc-if value="{{ins}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E5E5EA">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #E3E9FF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A56D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9c-4.5-1-8-4-8-9V6z M9 12l2 2 4-4"></path></svg>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 500">[شركة التأمين] · [الفئة]</div>
<div style="font-size: 12.5px; color: #5B6470">الصيدلية تطلب الموافقة، وتدفع نسبة التحمل فقط بعد الرد</div>
</div>
</div>
</sc-if>
<sc-if value="{{cash}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 8px">
<div style="flex-grow: 1; height: 48px; border-radius: 14px; background: #0B1B2B; color: #F5F5F7; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Apple Pay</div>
<div style="flex-grow: 1; height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E5E5EA; display: flex; align-items: center; justify-content: center; font-size: 14px">مدى / بطاقة</div>
</div>
</sc-if>
<label style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E5E5EA">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #FFF1CC; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.3 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"></path></svg>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 500">استخدم نقاط الولاء</div>
<div style="font-size: 12.5px; color: #5B6470">حتى ١٠٪ من قيمة الطلب</div>
</div>
<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #D42A38">
</label>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 34px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid #E5E5EA; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5B6470"><span>المنتجات [العدد]</span><span>[المبلغ]</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #1F7A5C"><span>خصم النقاط</span><span>− [المبلغ]</span></div>
<div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700"><span>الإجمالي</span><span>[الإجمالي] ر.س</span></div>
<button style="height: 56px; border-radius: 18px; border: 0; background: #D42A38; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { delivery: true, ins: false }; }
renderVals() {
const s = this.state;
const on = '#FFFFFF', off = 'transparent';
return {
d1: s.delivery ? on : off, d2: s.delivery ? off : on,
p1: s.ins ? off : on, p2: s.ins ? on : off,
ins: s.ins, cash: !s.ins,
placeTitle: s.delivery ? 'المنزل · [الحي]' : 'أقرب صيدلية لديها كل الأصناف',
placeSub: s.delivery ? '[العنوان المحفوظ]' : 'على بعد حوالي [المسافة] كم',
cta: s.ins ? 'إرسال الطلب للموافقة' : 'تأكيد والدفع',
setDelivery: () => this.setState({ delivery: true }), setPickup: () => this.setState({ delivery: false }),
setCash: () => this.setState({ ins: false }), setIns: () => this.setState({ ins: true }),
};
}
}
</script>
</body>
</html>
