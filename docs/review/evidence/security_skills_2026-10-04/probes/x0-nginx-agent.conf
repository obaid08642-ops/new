events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=api:20m rate=500r/s; limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m; limit_conn_zone $binary_remote_addr zone=conn:20m;
  proxy_cache_path /var/cache/nginx/api8091 levels=1:2 keys_zone=api_cache:50m max_size=1g inactive=60m use_temp_path=off;
  upstream backend_pool { server 127.0.0.1:8003; keepalive 16; }
  server { listen 8091;
  # ── X0 allow-list: ONLY these anonymous catalog reads are cached. ──────────
  # Everything else falls through to `location /` (no shared cache) and the
  # backend default `private, no-store`. Every cached location bypasses on
  # Authorization or any session cookie. Real session cookies:
  # nabd_patient_access / nabd_patient_refresh (app), nabd_access /
  # nabd_refresh / nabd_device (web BFF), nabd_admin_token /
  # nabd_admin_device (admin). Cloudflare is NOT touched here (owner action).

  # Medicine catalog root list — @Public() GET /api/v1/medicines
  location = /api/v1/medicines {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Medicine public leaves only — never bookings/mine, me/*, search/recent, admin/*.
  location ~ ^/api/v1/medicines/(autocomplete|by-barcode/[^/]+|categories|filters|hot|stream|search/did-you-mean|search/trending|[^/]+/details|[^/]+/alternatives)/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Medicine item detail — single path segment, excluding private leaves.
  location ~ ^/api/v1/medicines/(?!admin($|/)|search($|/)|me($|/))[^/]+/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Health endpoints — no rate limit
  location ~ ^/(health|api/v1/health) {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  # Auth endpoints — strict rate limit
  location ~ ^/api/v1/auth/(login|register|send-otp|verify-otp|social-login) {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Radiology + labs public catalog reads only (15 min).
  # Public: radiology/{services,compatible-providers,modalities,services/:id},
  # labs/{services,packages,categories,compatible-providers,services/:id,packages/:id}.
  # Private (bookings/mine, bookings/:id, tracking, reports/mine,
  # provider/inbox, team/*, samples, wallet, queue, admin/*) are NOT matched
  # and fall through to `location /` with no shared cache.
  location ~ ^/api/v1/radiology/(services|compatible-providers|modalities|services/[^/]+)/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  location ~ ^/api/v1/labs/(services|packages|categories|compatible-providers|services/[^/]+|packages/[^/]+)/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Everything else
  location / {
    limit_req zone=api burst=500 nodelay;
    limit_conn conn 1000;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
  }
}
