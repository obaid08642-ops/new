events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=api:20m rate=500r/s; limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m; limit_conn_zone $binary_remote_addr zone=conn:20m;
  proxy_cache_path /var/cache/nginx/api8090 levels=1:2 keys_zone=api_cache:50m max_size=1g inactive=60m use_temp_path=off;
  upstream backend_pool { server 127.0.0.1:8002; keepalive 16; }
  server { listen 8090;
  # Medicine catalog — cached 5 min at Nginx
  location ~ ^/api/v1/medicines {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Health endpoints — no rate limit
  location ~ ^/(health|api/v1/health) {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  # Auth endpoints — strict rate limit
  location ~ ^/api/v1/auth/(login|register|send-otp|verify-otp|social-login) {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Catalog endpoints — cached 15 min
  location ~ ^/api/v1/(lab-services|radiology|care/services) {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Everything else
  location / {
    limit_req zone=api burst=500 nodelay;
    limit_conn conn 1000;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
  }
}
