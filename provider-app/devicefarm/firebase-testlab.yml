# Device-farm matrix — provider-app (Phase 15.10)
#
# The device coverage the phase contract requires, as data. `run.sh` turns this into a
# Firebase Test Lab run; nothing here is executed by the unit-test suite.
#
# BLOCKED: the actual farm run is not performed in this worktree. Firebase Test Lab and
# BrowserStack App Automate are paid external services, this machine has no docker, and
# no farm account/credentials are configured. See README.md in this directory.

version: 1

# The binary under test. Built by EAS; not committed.
app:
  ios:
    bundleId: com.nabd.provider
    # `eas build --platform ios --profile production`
  android:
    package: com.nabd.provider
    # `eas build --platform android --profile production`

# Minimum OS the app is compiled against. Anything below cannot install a build, but the
# runtime gate still tells those users where to go. Keep in sync with
# src/deviceSupport/minOs.ts.
minimumOs:
  ios: "16.4"
  android: "7"

# Environments crossed with the device list.
environments:
  - name: en-light
    locale: en
    darkMode: false
    fontScale: 1.0
  - name: en-dark
    locale: en
    darkMode: true
    fontScale: 1.0
  - name: en-fontscale-200
    locale: en
    darkMode: false
    fontScale: 2.0
  - name: ar-light
    locale: ar
    darkMode: false
    fontScale: 1.0
  - name: ar-dark
    locale: ar
    darkMode: true
    fontScale: 1.0
  - name: ar-rtl
    locale: ar
    darkMode: false
    fontScale: 2.0

# The contract's coverage list, one entry per required class of device.
# `blocking: true` means a failure here blocks the release gate
# ("a device-farm report per release with 0 blocking issues").
devices:
  # ── small phone ────────────────────────────────────────────────────────────
  - id: iphone-se
    platform: IOS
    model: iphone-se-3
    class: small-phone
    note: "smallest supported iPhone; the tightest width/layout case"
    blocking: true
  - id: android-small
    platform: ANDROID
    model: pixel-2
    class: small-phone
    blocking: true

  # ── large phone ────────────────────────────────────────────────────────────
  - id: iphone-15-pro-max
    platform: IOS
    model: iphone-15-pro-max
    class: large-phone
    note: "iPhone Pro Max, as required by the contract"
    blocking: true
  - id: android-large
    platform: ANDROID
    model: pixel-8-pro
    class: large-phone
    blocking: true

  # ── tablet ─────────────────────────────────────────────────────────────────
  - id: ipad
    platform: IOS
    model: ipad-pro-11
    class: tablet
    note: "supportsTablet is true in app.json; iOS 16.4+ required"
    blocking: true
  - id: android-tablet
    platform: ANDROID
    model: tablet-7-in
    class: tablet
    blocking: true

  # ── low-end Android, 2–3 GB RAM ────────────────────────────────────────────
  - id: android-lowend-2gb
    platform: ANDROID
    model: moto-g5-plus
    class: low-end-android
    ramGb: 3
    note: "the RAM floor the contract calls out; catches jank and OOM on big lists"
    blocking: true

  # ── Huawei without Google services ─────────────────────────────────────────
  - id: huawei-no-gms
    platform: ANDROID
    model: moto-g5-plus
    class: no-google-services
    ramGb: 3
    # Huawei hardware cannot run on Firebase Test Lab (no GMS images), so this entry is
    # executed on BrowserStack App Automate, which ships Huawei devices.
    provider: browserstack
    model_bs: "Huawei P20"
    os_bs: "11.0"
    note: "verifies the app degrades without Play Services instead of crashing at launch; Firebase Test Lab has no Huawei image, so this device requires the second provider"
    blocking: true

# Blocking vs non-blocking triage used by run.sh when deciding the release verdict.
severity:
  blocking:
    - app-crash-on-launch
    - white-screen (no ErrorBoundary fallback)
    - unsupported-device message shown on a supported device
    - layout clipped at font scale 200%
    - Arabic RTL text truncated or mirrored wrongly
    - dark mode unreadable (contrast)
  nonBlocking:
    - console warnings
    - animation jank below the threshold
    - non-actionable network timeouts on an offline profile

# Runs are limited to this many devices to control cost; `-1` means the whole matrix.
maxDevicesPerRun: 12