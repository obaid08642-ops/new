# Coturn Server Configuration
listening-port=3478
tls-listening-port=5349

# Use REST API authentication (HMAC-SHA1 time-limited credentials)
use-auth-secret
static-auth-secret=change_this_secret
realm=turn.example.com

# IPs and Network
listening-ip=0.0.0.0
# external-ip should match the public IP of the Coturn server
# external-ip=1.2.3.4

# SSL Certificates (TLS)
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# Security & Traversal Options
fingerprint
lt-cred-mech
no-multicast-peers
no-stdout-log
syslog

# Ports limit for WebRTC relay
min-port=49152
max-port=65535
