# Single-VPS max-performance nginx — 3 backend replicas behind upstream
# Deploy: docker-compose -f docker-compose.infra.yml -f docker-compose.app.yml up -d
upstream nabdah_backend {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 80;
    server_name api.nabd.plus;
    # Cloudflare already terminates TLS; nginx does HTTP keepalive + gzip

    gzip on;
    gzip_comp_level 6;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 256;

    # Rate limit: 100 req/s per IP burst 50
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://nabdah_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Health — bypass rate limit
    location = /api/health {
        proxy_pass http://nabdah_backend;
        access_log off;
    }
}
