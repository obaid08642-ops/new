# iOS shows its "Save Password?" sheet after a sign-in, sometimes more than once and at moments of its own choosing (run 41593508288: it covered
# the appointments list a minute after the first one was answered); it sits over the app and swallows the next tap. A flow calls this before
# a tap that matters; it does nothing when the sheet is not showing (and on Android, where it never shows).
appId: com.patient.nabd
---
- runFlow:
    when:
      visible: "Not Now|ليس الآن"
    commands:
      - tapOn: "Not Now|ليس الآن"
