# Shared sign-in sub-flow of every patient flow (called with runFlow): fresh install -> language step -> intro -> Welcome -> Log in ->
# Home. EMAIL / PASSWORD (and on iOS EMAIL_LOCAL / EMAIL_DOMAIN) come from the runner (run_job.sh / run_job_ios.sh) and reach this file from
# the calling flow. Not named patient_*.yaml, so the runner does not run it as a flow of its own.
appId: com.patient.nabd
---
- launchApp:
    clearState: true
# The emulator's own launcher can freeze under load and cover the app with "isn't responding"; answer Wait.
- runFlow:
    when:
      visible: ".*isn.t responding.*"
    commands:
      - tapOn: "Wait"
# the splash plays for ~2.6 s, then a first launch opens the language step
- extendedWaitUntil:
    visible:
      id: "onboarding-language"
    timeout: 120000
- tapOn:
    id: "language-continue"
- extendedWaitUntil:
    visible:
      id: "onboarding-intro"
    timeout: 30000
- tapOn:
    id: "onboarding-skip"
- extendedWaitUntil:
    visible:
      id: "welcome-login"
    timeout: 30000
- tapOn:
    id: "welcome-login"
- extendedWaitUntil:
    visible:
      id: "login-identifier"
    timeout: 30000
- tapOn:
    id: "login-identifier"
- waitForAnimationToEnd
# On the iOS simulator Maestro's inputText stopped at the "@" (run 99: the field held only the part before it and the app answered
# "enter a valid email"), so iOS types the three parts separately. Android types the address in one go.
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${EMAIL_LOCAL}
      - waitForAnimationToEnd
      - inputText: "@"
      - waitForAnimationToEnd
      - inputText: ${EMAIL_DOMAIN}
      - waitForAnimationToEnd
# Run 100 (iOS): the identifier field ended up holding "n@nabd.test" + the PASSWORD, and the password field stayed empty, so either the
# first characters are dropped while the keyboard is still coming up, or the tap on the password field did not move the focus. Assert
# what the identifier field holds before going on, so the next failure names which of the two it is.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: ${EMAIL}
# Run 41438178943 (iOS): with the keyboard up, the form scrolls so the identifier sits at the top of the visible area and the password
# field is under the sticky footer (app/(auth)/login.tsx StickyFooter), so the tap landed on the footer, focus stayed on the identifier
# and the password was typed into it (screenshot: "...nabd.testNb-69XU..."). Scroll the form up first so both fields are above the footer.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 8%
      - waitForAnimationToEnd
- tapOn:
    id: "login-password"
- waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${PASSWORD}
# Run 41444366476 (iOS): the field is focused now, but the app answered 401 three times: the typed password was not the account's (the
# app clears the field after a refused sign-in). Same cure as the e-mail address: type in pieces with the keyboard settled between them
# (run_job_ios.sh passes PASS_1..PASS_4), then reveal the field and assert what it holds, so a mismatch shows the actual text.
# Run 41446867266 (iOS): the password field opens with the ARABIC keyboard (the app is in Arabic; only the e-mail field forces a Latin one),
# so the Latin letters were dropped and the field held "969-" of the password. Switch to the English keyboard (the globe key) when the
# Arabic one is up, and only then type.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "ض"
          commands:
            - tapOn: "Next keyboard"
            - waitForAnimationToEnd
      - inputText: ${PASS_1}
      - waitForAnimationToEnd
      - inputText: ${PASS_2}
      - waitForAnimationToEnd
      - inputText: ${PASS_3}
      - waitForAnimationToEnd
      - inputText: ${PASS_4}
      - waitForAnimationToEnd
      - tapOn: "إظهار كلمة المرور|Show password"
      - assertVisible: ${PASSWORD}
# Maestro cannot dismiss the iOS keyboard ("Couldn't hide the keyboard"); the submit button sits in a footer that rides above the
# keyboard there, so it can be tapped without hiding it. Android hides it.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "login-submit"
# a successful sign-in replaces the screen with Home (the tabs)
- extendedWaitUntil:
    notVisible:
      id: "login-identifier"
    timeout: 30000
