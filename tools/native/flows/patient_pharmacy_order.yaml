# Patient orders medicines through the real pharmacy screens up to the broadcast screen: Pharmacy tab -> add a medicine to the cart ->
# cart -> checkout (the seeded patient's saved address, pay on delivery) -> send the request to the pharmacies -> "waiting for offers"
# (pharmacy/broadcast-status). Pharmacy orders are broadcast and answered with offers, so the flow stops there. The catalogue, the
# address and the order come from the seeded backend, nothing is mocked.
appId: com.patient.nabd
---
- runFlow: lib/patient_signin.yaml
- tapOn:
    id: "main-tab-bar-pharmacy"
- extendedWaitUntil:
    visible:
      id: "pharmacy-hub"
    timeout: 30000
# the first medicine of the catalogue that can be added from its card
# a card whose medicine cannot be added (out of stock, prescription needed) shows a disabled button: only an enabled one is tapped
# (run 103: the first match was disabled, the tap did nothing and the cart was empty)
- scrollUntilVisible:
    element:
      id: "med-add-.*"
      enabled: true
    timeout: 60000
# let the list settle (the catalogue refetches right after sign-in and a re-render can swallow a tap), then add; the add button turns into the
# quantity stepper once the item is in the cart, so the tap is repeated until the stepper shows (run 106: the tap did nothing, no error, no crash)
- waitForAnimationToEnd
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "med-add-.*"
          enabled: true
      - extendedWaitUntil:
          visible:
            id: "med-stepper-.*"
          timeout: 8000
- takeScreenshot: pharmacy-after-add
- tapOn:
    id: "cart-button"
- extendedWaitUntil:
    visible:
      id: "cart-screen"
    timeout: 30000
# the cart screen id is also on its loading and empty states: wait for the button itself
- extendedWaitUntil:
    visible:
      id: "cart-continue"
    timeout: 30000
- tapOn:
    id: "cart-continue"
- extendedWaitUntil:
    visible:
      id: "checkout-screen"
    timeout: 30000
- tapOn:
    id: "checkout-submit"
# POST /patient/pharmacy/orders + /submit answered: the screen that waits for the pharmacies' offers
- extendedWaitUntil:
    visible:
      id: "broadcast-status-screen"
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: "checkout-screen"
    timeout: 30000
- takeScreenshot: patient_pharmacy_broadcast
