# Lab booking: Lab tests tab -> a common test -> add to cart -> basket -> the best lab -> time -> confirm -> the booking is created (open the order).
appId: com.patient.nabd
---
- runFlow:
    file: common_fresh_session.yaml
    env:
      FLAGS: "address=1"
- tapOn:
    text: "التحاليل"
    index: 0
- extendedWaitUntil:
    visible:
      id: "diagnostics-hub"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "diag-test-0"
- tapOn:
    id: "diag-test-0"
- extendedWaitUntil:
    visible:
      id: "diagnostics-test-detail"
    timeout: 20000
- tapOn:
    id: "diag-book-now"
- extendedWaitUntil:
    visible:
      id: "diagnostics-cart"
    timeout: 20000
# the basket opens on "at home" (the hub's place choice is not carried: findings #3) and the seeded tests have no home service in the area: choose "I will go myself"
- tapOn:
    id: "ordering-ctx-where"
- tapOn: "سأذهب بنفسي"
# the prices and coverage are asked again for the centre; the "no home service" line goes and the button turns on
- extendedWaitUntil:
    notVisible: "لا توجد خدمة منزلية.*"
    timeout: 40000
- tapOn:
    id: "diag-cart-continue"
- extendedWaitUntil:
    visible:
      id: "diagnostics-lab-comparison"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "provider-choose"
    timeout: 40000
- tapOn:
    id: "provider-choose"
- extendedWaitUntil:
    visible:
      id: "diagnostics-when"
    timeout: 30000
# take the first of the offered days that has times
- tapOn:
    id: "time-day"
    index: 0
- runFlow:
    when:
      visible: "لا توجد مواعيد متاحة في هذا اليوم.*"
    commands:
      - tapOn:
          id: "time-day"
          index: 1
- runFlow:
    when:
      visible: "لا توجد مواعيد متاحة في هذا اليوم.*"
    commands:
      - tapOn:
          id: "time-day"
          index: 2
- extendedWaitUntil:
    visible:
      id: "time-window"
    timeout: 20000
- tapOn:
    id: "time-window"
    index: 0
- tapOn:
    id: "diag-when-continue"
- extendedWaitUntil:
    visible:
      id: "diagnostics-confirm"
    timeout: 20000
- tapOn:
    id: "diag-confirm-submit"
- extendedWaitUntil:
    visible:
      id: "diag-view-order"
    timeout: 40000
- tapOn:
    id: "diag-view-order"
- extendedWaitUntil:
    visible:
      id: "diagnostics-booking-status"
    timeout: 30000
- takeScreenshot: patient_lab_booking_status
