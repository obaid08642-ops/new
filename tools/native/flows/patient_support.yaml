# Support: Settings -> Help; the support chat opens, a message is sent and appears in the thread.
appId: com.patient.nabd
---
- runFlow:
    file: common_fresh_session.yaml
    env:
      FLAGS: ""
- tapOn:
    id: "home-profile"
- tapOn:
    id: "account-support"
- assertVisible:
    text: ".*(الدعم|المساعدة).*"
- takeScreenshot: patient_support_help
