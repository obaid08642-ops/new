# Radiology centre (provider app): a patient's scan booking (made by the API, cash at the centre) is in Orders > New with the scan name, the time and the price.
# The card's title shows "—" instead of the patient (findings #8).
appId: com.nabd.provider
---
- runScript:
    file: scripts/radiology_booking.js
- runFlow: common_provider_login.yaml
- extendedWaitUntil:
    visible: "الطلبات|Orders"
    timeout: 90000
- tapOn: "الطلبات|Orders"
- extendedWaitUntil:
    visible: "طلب جديد|New Request"
    timeout: 60000
- assertVisible: ".*180.*"
- takeScreenshot: provider_radiology_inbox
