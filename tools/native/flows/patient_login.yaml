# Patient sign-in on the real Android build (email + password), from a fresh install, through today's screens:
# splash -> language step -> intro -> Welcome -> Log in. EMAIL / PASSWORD come from tools/native/seed.py.
# Every control is found by its testID (patient-app/app/(onboarding), (auth)/welcome, (auth)/login), not by its text,
# so a change of language or wording does not break the flow.
appId: com.patient.nabd
---
# the steps are in lib/patient_signin.yaml, shared by every patient flow
- runFlow: lib/patient_signin.yaml
- takeScreenshot: patient_after_login
