# Patient sign-in on the real Android build (email + password), from a fresh install, through today's screens:
# splash -> language step -> intro -> Welcome -> Log in. EMAIL / PASSWORD come from tools/native/seed.py.
# Every control is found by its testID (patient-app/app/(onboarding), (auth)/welcome, (auth)/login), not by its text,
# so a change of language or wording does not break the flow.
appId: com.patient.nabd
---
- launchApp:
    clearState: true
# The emulator's own launcher can freeze under load and cover the app with "isn't responding"; answer Wait.
- runFlow:
    when:
      visible: ".*isn.t responding.*"
    commands:
      - tapOn: "Wait"
# the splash plays for ~2.6 s, then a first launch opens the language step
- extendedWaitUntil:
    visible:
      id: "onboarding-language"
    timeout: 120000
- tapOn:
    id: "language-continue"
- extendedWaitUntil:
    visible:
      id: "onboarding-intro"
    timeout: 30000
- tapOn:
    id: "onboarding-skip"
- extendedWaitUntil:
    visible:
      id: "welcome-login"
    timeout: 30000
- tapOn:
    id: "welcome-login"
- extendedWaitUntil:
    visible:
      id: "login-identifier"
    timeout: 30000
- tapOn:
    id: "login-identifier"
# On the iOS simulator Maestro's inputText stopped at the "@" (run 99: the field held only the part before it and the app answered
# "enter a valid email"), so iOS types the three parts separately. Android types the address in one go.
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${EMAIL}
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${EMAIL_LOCAL}
      - inputText: "@"
      - inputText: ${EMAIL_DOMAIN}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
# Maestro cannot dismiss the iOS keyboard ("Couldn't hide the keyboard"); the submit button sits in a footer that rides above the
# keyboard there, so it can be tapped without hiding it. Android hides it.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "login-submit"
# a successful sign-in replaces the screen with Home (the tabs)
- extendedWaitUntil:
    notVisible:
      id: "login-identifier"
    timeout: 30000
- takeScreenshot: patient_after_login
