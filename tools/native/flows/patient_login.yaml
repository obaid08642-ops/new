# Patient sign-in on the real Android build (email + password). EMAIL / PASSWORD come from tools/native/seed.py.
appId: com.patient.nabd
---
- launchApp
# the splash replaces the route with the tabs after ~2.6 s; open the link once the tabs are up
# The emulator's own launcher can freeze under load and cover the app with "isn't responding"; answer Wait.
- runFlow:
    when:
      visible: ".*isn.t responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: ".*(الرئيسية|Home).*"
    timeout: 120000
- openLink: nabdplus:///login
- extendedWaitUntil:
    visible: "example@mail.com"
    timeout: 45000
- tapOn: "example@mail.com"
- inputText: ${EMAIL}
- tapOn: "••••••••"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    text: "تسجيل الدخول|Log ?[Ii]n"
    below: "كلمة المرور|Password"
- extendedWaitUntil:
    notVisible: "example@mail.com"
    timeout: 30000
- takeScreenshot: patient_after_login
