# Sign in with the seeded patient, check the account screen, sign out, then check the signed-out state (Welcome) and that a restart stays signed out.
appId: com.patient.nabd
---
- runFlow: common_to_welcome.yaml
- runFlow: common_sign_in.yaml
- tapOn:
    id: "home-profile"
- assertVisible:
    id: "profile-screen"
- assertVisible:
    id: "account-sign-out"
- tapOn:
    id: "account-sign-out"
- extendedWaitUntil:
    visible:
      id: "welcome-login"
    timeout: 20000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "welcome-login"
    timeout: 60000
- assertNotVisible:
    id: "home-screen"
