# My appointments (opened by the app's own link), with the booked appointment as a card.
appId: com.patient.nabd
---
- openLink: "nabdplus:///consultations/appointments"
- extendedWaitUntil:
    visible:
      id: "appointments-screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "appointment-card"
    timeout: 20000
