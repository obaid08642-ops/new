# Forgot password: email -> OTP (reset) -> new password -> sign in with the NEW password; the old one no longer works.
appId: com.patient.nabd
---
- runScript:
    file: scripts/new_patient.js
- runFlow: common_to_welcome.yaml
- tapOn:
    id: "welcome-login"
- extendedWaitUntil:
    visible:
      id: "login-identifier"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*(نسيت|Forgot).*"
- tapOn:
    text: ".*(نسيت|Forgot).*"
- extendedWaitUntil:
    visible:
      id: "forgot-email"
    timeout: 20000
- tapOn:
    id: "forgot-email"
- inputText: ${output.email}
- hideKeyboard
- tapOn:
    id: "forgot-submit"
- runFlow:
    file: common_enter_otp.yaml
    env:
      TO: ${output.email}
- extendedWaitUntil:
    visible:
      id: "reset-password"
    timeout: 30000
- tapOn:
    id: "reset-password"
- inputText: "N3w!Passw0rd"
- tapOn:
    id: "reset-confirm"
- inputText: "N3w!Passw0rd"
- hideKeyboard
- tapOn:
    id: "reset-submit"
- extendedWaitUntil:
    visible:
      id: "reset-done-login"
    timeout: 30000
- tapOn:
    id: "reset-done-login"
- runFlow:
    file: common_login_form.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: "N3w!Passw0rd"
- assertVisible:
    id: "home-screen"
