# Doctor (provider app): Settings -> "Patient Blacklist": a patient blocked by the API is listed with the reason, "Unblock" removes it.
# The row's title is the patient id (the endpoint returns no patient name): see docs/qa/findings/native.md.
appId: com.nabd.provider
---
- runScript:
    file: scripts/doctor_blacklist.js
- runFlow: common_provider_login.yaml
- extendedWaitUntil:
    visible: "الإعدادات|Settings"
    timeout: 90000
- tapOn: "الإعدادات|Settings"
- scrollUntilVisible:
    element: "قائمة الحظر|Patient Blacklist"
    timeout: 30000
- tapOn: "قائمة الحظر|Patient Blacklist"
- extendedWaitUntil:
    visible: ".*${output.reason}.*"
    timeout: 30000
- takeScreenshot: provider_doctor_blacklist
- tapOn: "رفع الحظر|Unblock"
- extendedWaitUntil:
    notVisible: ".*${output.reason}.*"
    timeout: 30000
