# The pharmacy order, from the cart to the pay button: send -> the seeded pharmacy offers (API) -> accept the offer -> tracking -> final quote accepted -> payment screen.
appId: com.patient.nabd
---
- runFlow: common_pharmacy_send.yaml
- runScript:
    file: scripts/pharmacy_offer.js
- extendedWaitUntil:
    visible:
      id: "offer-card"
    timeout: 90000
- tapOn:
    id: "offer-pick"
- tapOn:
    id: "offer-confirm"
- extendedWaitUntil:
    visible:
      id: "order-tracking-screen"
    timeout: 40000
- tapOn:
    id: "tracking-next"
- extendedWaitUntil:
    visible:
      id: "final-quote-screen"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "quote-accept"
    commands:
      - tapOn:
          id: "quote-accept"
- extendedWaitUntil:
    visible:
      id: "quote-pay-now"
    timeout: 30000
- tapOn:
    id: "quote-pay-now"
- extendedWaitUntil:
    visible:
      id: "payment-pay"
    timeout: 30000
