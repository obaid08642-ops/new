# Pharmacy (provider app): a patient's order arrives on the dashboard -> Create offer -> mark the line available, bind the stocked item -> server preview ->
# save the draft -> send for the patient's choice; then the patient (API) sees the offer.
appId: com.nabd.provider
---
- runScript:
    file: scripts/pharmacy_order.js
- runScript:
    file: scripts/meds.js
- runFlow: common_provider_login.yaml
- extendedWaitUntil:
    visible: ".*(إنشاء عرض|Create offer).*"
    timeout: 90000
- takeScreenshot: provider_pharmacy_incoming_order
- tapOn: ".*(إنشاء عرض|Create offer).*"
- extendedWaitUntil:
    visible: "متوفر|Available"
    timeout: 30000
- tapOn: "متوفر|Available"
- tapOn:
    id: "field:.*(Search by name or barcode|بحث بالاسم أو الباركود).*"
- inputText: ${output.medTag}
- hideKeyboard
- tapOn: "بحث|Search"
- takeScreenshot: provider_pharmacy_composer_search
