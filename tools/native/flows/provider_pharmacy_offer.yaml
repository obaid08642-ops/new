# Pharmacy (provider app): a patient's order arrives on the dashboard -> Create offer -> mark the line available, bind the stocked item -> server preview ->
# save the draft -> send for the patient's choice; then the patient (API) sees the offer.
appId: com.nabd.provider
---
- runScript:
    file: scripts/pharmacy_order.js
- runScript:
    file: scripts/meds.js
- runFlow: common_provider_login.yaml
- extendedWaitUntil:
    visible: ".*(إنشاء عرض|Create offer).*"
    timeout: 90000
- takeScreenshot: provider_pharmacy_incoming_order
- tapOn: ".*(إنشاء عرض|Create offer).*"
- extendedWaitUntil:
    visible: "متوفر|Available"
    timeout: 30000
- tapOn: "متوفر|Available"
- tapOn:
    id: "field:.*(Search by name or barcode|بحث بالاسم أو الباركود).*"
- inputText: ${output.medTag}
- hideKeyboard
- tapOn: "بحث|Search"
- extendedWaitUntil:
    visible: ".*Stock.*|.*المخزون.*"
    timeout: 30000
- tapOn: ".*Stock.*|.*المخزون.*"
- scrollUntilVisible:
    element: "معاينة خادمية|Server quote preview"
    timeout: 30000
- tapOn: "معاينة خادمية|Server quote preview"
- extendedWaitUntil:
    visible: "حفظ المسودة|Save draft"
    timeout: 30000
- scrollUntilVisible:
    element: "حفظ المسودة|Save draft"
- tapOn: "حفظ المسودة|Save draft"
- scrollUntilVisible:
    element: "إرسال العرض للاختيار|Submit for patient selection"
- tapOn: "إرسال العرض للاختيار|Submit for patient selection"
- takeScreenshot: provider_pharmacy_offer_sent
- runScript:
    file: scripts/patient_offers.js
    env:
      ORDER: ${output.orderId}
      TOKEN: ${output.patientToken}
