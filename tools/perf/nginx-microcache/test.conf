# P14.11 test server: the real snippet (deploy/nginx/snippets/api-microcache.conf) and the real skip map, copied from
# deploy/nginx/nginx.conf by run.sh, in front of stub.py.
events {}
http {
  proxy_cache_path /tmp/ngx-microcache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;
  include /etc/nginx/test/skip-map.conf;
  server {
    listen 9872;
    location /api/v1/ {
      proxy_pass http://127.0.0.1:9871;
      include /etc/nginx/snippets/api-microcache.conf;
    }
  }
}
