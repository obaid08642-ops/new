# P14.28 step 3 rehearsal: the load balancer of deploy/SCALING.md step 3 (nginx `upstream` with both API nodes).
# Same balancing rules as production would use: least connections, a node that fails is taken out for 10 s, and an
# idempotent request (GET/HEAD) that hits a dead node is retried once on the other one. Writes are never retried.
# run.sh fills in __OUT__ (logs, pid) and starts it with `nginx -p __OUT__ -c nginx.conf`.
worker_processes 2;
pid __OUT__/nginx.pid;
error_log __OUT__/nginx-error.log warn;
events { worker_connections 4096; }
http {
  log_format lb '$msec $status $request_method $uri $upstream_addr $upstream_status $request_time';
  access_log __OUT__/lb-access.log lb;
  client_body_temp_path __OUT__/tmp-body;
  proxy_temp_path __OUT__/tmp-proxy;
  upstream api_pool {
    least_conn;
    server 127.0.0.1:8101 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8102 max_fails=1 fail_timeout=10s;
    keepalive 64;
  }
  server {
    listen 127.0.0.1:8100;
    client_max_body_size 10m;
    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
