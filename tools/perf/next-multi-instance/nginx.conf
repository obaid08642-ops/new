# Two web instances behind one nginx, round robin (P14.10 rehearsal).
events {}
http {
  upstream web { server 127.0.0.1:3101; server 127.0.0.1:3102; }
  server {
    listen 8088;
    location / { proxy_pass http://web; proxy_set_header Host $host; add_header x-upstream $upstream_addr always; }
  }
}
