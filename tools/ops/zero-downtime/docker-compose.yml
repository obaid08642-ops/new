# Production layout for the part the rolling deploy touches: backend (name, alias, healthcheck, grace) behind nginx.
name: zd
services:
  backend:
    image: zd-stub:${VERSION:-v1}
    container_name: nabdah-backend
    stop_grace_period: 40s
    environment:
      SHUTDOWN_DRAIN_MS: "6000"
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/api/v1/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 2s
  nginx:
    image: nginx:1.28.0-alpine
    container_name: nabdah-nginx
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [internal]
networks:
  internal:
