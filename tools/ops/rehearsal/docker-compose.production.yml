# Rehearsal copy of the production layout: same project, service and container names, same
# healthchecks and mounts as /opt/nabdah/deploy/docker-compose.production.yml for the parts the
# ops scripts touch (backend, livekit, nginx).
name: nabdah-prod
services:
  backend:
    build: ./backend
    container_name: nabdah-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      CLUSTER_MODE: "false"
      PORT: "8002"
    depends_on: [livekit]
    networks: [web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/api/v1/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: nabdah-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
  nginx:
    image: nginx:1.27-alpine
    container_name: nabdah-nginx
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks: [web]
networks:
  web:
