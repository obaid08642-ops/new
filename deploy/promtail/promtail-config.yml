server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - docker: {}
      - labels:
          container_name:
          image_name:
      - match:
          selector: '{container_name=~"nabd-.*"}'
          stages:
            - json:
                expressions:
                  requestId: requestId
                  traceId: traceId
                  spanId: spanId
                  level: level
                  message: message
                  timestamp: timestamp
                  service: service
                  version: version
                  environment: environment
            - labels:
                requestId:
                traceId:
                spanId:
                level:
                service:
                version:
                environment:

  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<proto>\S+)" (?P<status>\d+) (?P<size>\d+) "(?P<referer>[^"]*)" "(?P<ua>[^"]*)" (?P<request_time>\S+)'
      - labels:
          ip:
          method:
          path:
          status:
          referer:
          ua:

  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: nabd-backend
          __path__: /var/log/nabd-backend/*.log
    pipeline_stages:
      - json:
          expressions:
            requestId: context.requestId
            traceId: context.traceId
            spanId: context.spanId
            level: level
            message: message
            timestamp: timestamp
            method: context.method
            url: context.url
            statusCode: context.statusCode
            duration: context.duration
      - labels:
          requestId:
          traceId:
          spanId:
          level:
          method:
          url:
          statusCode: