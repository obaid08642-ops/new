# ═══════════════════════════════════════════════════════════════════
# Nabdah Plus — PRODUCTION stack (nabd.plus)
# Services: backend(NestJS) fastapi admin-web(Next.js) mongodb redis
#           meilisearch livekit coturn nginx certbot
# All stateful data in named volumes. All services auto-restart.
# ═══════════════════════════════════════════════════════════════════
name: nabdah-prod

# Shared logging defaults for EVERY service: json-file, at most 3 files of 20 MB (60 MB per container). Before 2026-10-16 it
# was 5 x 50 MB (250 MB per container) and the mongodb/coturn logs alone were dozens of rotated 50 MB files. The rule is
# pinned by tools/ops/check-compose-limits.py (CI "compose limits"): a service without `logging: *logopts`, or a larger
# cap, fails the build. Existing containers keep their old cap until they are recreated by the deploy.
x-logging: &logopts
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ── MongoDB ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: nabdah-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-nabd_nestjs}
    volumes:
      - mongo_data:/data/db
      - ./mongo/mongod.conf:/etc/mongod.conf:ro
      - ./mongo/mongo-keyfile:/etc/mongo-keyfile:ro
    command: ["mongod", "--config", "/etc/mongod.conf"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logopts

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nabdah-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logopts

  # ── Redis cache (P14.14 role "cache"; 2026-10-16 #1603): rebuildable copies only — the Next.js page/data cache of
  # patient-web (patient-web/cache-handler.cjs) and, once REDIS_CACHE_URL points here, the backend's HotCache. A separate
  # INSTANCE (not a DB of `redis`): maxmemory-policy is per instance, and the main one keeps the queues, rate limiters and
  # sessions. allkeys-lru + a hard maxmemory: when full it evicts the least recently used page, never refuses a write and
  # never touches the app's data. Nothing is saved (no RDB, no AOF), nothing is on a volume, the root filesystem is read-only:
  # this container cannot write to the disk at all. A restart empties it; pages are rendered again on demand.
  redis-cache:
    image: redis:7-alpine
    container_name: nabdah-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}",
              "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no", "--dir", "/tmp"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 384m
    networks: [cache]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *logopts

  # ── Meilisearch (D-29 search engine; ~300 MB RAM; mirror of the MongoDB search_index) ──
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: nabdah-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    volumes:
      - meili_data:/meili_data
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logopts

  # ── NestJS Backend (API + Socket.IO + BullMQ workers + crons in-process) ──
  backend:
    build:
      context: ../nabdah-backend
      dockerfile: ../deploy/docker/Dockerfile.backend
      network: host
    container_name: nabdah-backend
    stop_grace_period: 40s   # 20.9: SIGTERM drain before SIGKILL (rolling deploys stop the old container with docker stop -t)
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      CLUSTER_MODE: "false"   # ops 2026-10-04: cluster mode crashed the deployed build; one process also saves RAM
      PORT: "8002"
      # P14.26: HTTP and sockets only; cron jobs, queue consumers and the search sync run in `worker` below
      PROCESS_ROLE: api
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-6000}   # 20.9: keep serving with Connection: close this long after SIGTERM
      # 20.3: debug|info|warn|error. info in production (stdout, capped 20m x 3); warn and error are also stored in
      # Mongo `app_logs` (30-day TTL, size-capped) and shown in the admin dashboard > Logs. Set it in .env.production to change it.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_COMPRESSION: edge   # P14.25: nginx gzips (gzip_proxied any); the API does not compress twice
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-nabd_nestjs}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-}   # P14.14: empty = the cache shares REDIS_URL (one Redis until scale step 2)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Search answers from MongoDB while Meilisearch is down or not configured (no hard dependency).
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # 16.5: every upload is scanned by ClamAV (the `clamav` service) before it is stored. An infected file is always refused;
      # with `required` (the production default) an upload is also refused while the scanner cannot answer.
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      UPLOAD_SCAN: required
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, web]
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:8002/api/v1/health/liveness").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logopts

  # ── Background worker (P14.26) ────────────────────────────────────
  # Same image as the backend in the worker role: cron jobs, BullMQ consumers (notifications, push) and the search
  # sync run here once, never inside the API process. Not on the web network: nginx never routes to it. Emits reach
  # sockets on the API through the Socket.IO Redis adapter (P14.13). Scale with more replicas only for queue
  # consumers; cron jobs would then run once per replica.
  worker:
    build:
      context: ../nabdah-backend
      dockerfile: ../deploy/docker/Dockerfile.backend
      network: host
    container_name: nabdah-worker
    stop_grace_period: 60s   # 20.9: SIGTERM drain before SIGKILL (rolling deploys stop the old container with docker stop -t)
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      CLUSTER_MODE: "false"
      PROCESS_ROLE: worker
      LOG_LEVEL: ${LOG_LEVEL:-info}   # 20.3, see the backend service
      PORT: "8002"
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-nabd_nestjs}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-}   # P14.14: empty = the cache shares REDIS_URL (one Redis until scale step 2)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:8002/api/v1/health/liveness").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logopts

  # ── ClamAV (16.5): the antivirus the backend streams every upload to (INSTREAM on 3310, internal network only). The
  # signature database lives on a volume so a restart does not download it again; the first start takes a few minutes
  # (freshclam), during which uploads are refused rather than waved through (UPLOAD_SCAN=required on the backend).
  clamav:
    image: clamav/clamav:1.4
    container_name: nabdah-clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [internal]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 240s
    logging: *logopts

  # ── FastAPI auxiliary service (AI/ETL) ────────────────────────────
  fastapi:
    build:
      context: ../nabdah-backend/infra/fastapi
      dockerfile: ../../../deploy/docker/Dockerfile.fastapi
    container_name: nabdah-fastapi
    restart: unless-stopped
    env_file: .env.production
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-nabd_nestjs}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-}   # P14.14: empty = the cache shares REDIS_URL (one Redis until scale step 2)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NESTJS_URL: http://backend:8002
    depends_on:
      mongodb: { condition: service_healthy }
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/docs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logopts

  # ── Admin dashboard (Next.js web-admin) ───────────────────────────
  admin-web:
    build:
      context: ../Napd-admin/web-admin
      dockerfile: ../../deploy/docker/Dockerfile.admin-web
    container_name: nabdah-admin-web
    stop_grace_period: 30s   # 20.9: SIGTERM drain before SIGKILL (rolling deploys stop the old container with docker stop -t)
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.nabd.plus
      NEXT_PUBLIC_WS_URL: https://api.nabd.plus
      NEXT_PUBLIC_SITE_URL: https://admin.nabd.plus
      NEXT_PUBLIC_APP_NAME: "Nabdah Plus Admin"
      ADMIN_BACKEND_URL: http://backend:8002
    depends_on: [backend]
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logopts

  # ── LiveKit (self-hosted SFU) ─────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: nabdah-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"  # websocket — localhost only; public access via nginx wss://live.nabd.plus
      - "7881:7881"            # RTC over TCP
      - "7882:7882/udp"        # RTC over UDP
      - "50000-50100:50000-50100/udp"  # RTC UDP port range
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logopts

  # ── Coturn (STUN/TURN, self-hosted) ───────────────────────────────
  coturn:
    image: coturn/coturn:4.6.2
    container_name: nabdah-coturn
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      # The committed turnserver.conf is a template; the real static-auth-secret is
      # rendered into turnserver.rendered.conf by deploy/scripts/render-coturn-config.sh
      - ./coturn/turnserver.rendered.conf:/etc/coturn/turnserver.conf:ro
      - ./certs/turn:/etc/coturn/certs:ro
    network_mode: host  # TURN requires host networking (relay ports + source IPs)
    # #1603: coturn writes a daily log (/var/tmp/turn_*.log) and a pid file into its container layer, with no rotation
    # (isr-disk CI, `coturn-writes`). Read-only root + small memory-backed tmpfs: it starts, answers and writes nothing to disk.
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/tmp:size=16m
    depends_on: []
    healthcheck:
      test: ["CMD-SHELL", "turnadmin -l -N turnserver.conf 2>/dev/null || nc -z 127.0.0.1 3478"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logopts

  # ── Nginx reverse proxy (TLS termination + routing + caching) ─────
  nginx:
    image: nginx:1.28.0-alpine   # pinned: upstream `resolve` (deploy/nginx/nginx.conf) needs >= 1.27.3
    container_name: nabdah-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs/live:/etc/letsencrypt:ro
      - ./certs/webroot:/var/www/certbot
      - ./docker/provider-landing:/usr/share/nginx/provider:ro
      - ./nginx/well-known:/usr/share/nginx/well-known:ro
      - nginx_cache:/var/cache/nginx
    depends_on: [backend, admin-web, livekit]
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logopts

  # ── Certbot (issue + renew loop) ──────────────────────────────────
  patient-web:
    image: nabdah-patient-web:v50
    container_name: nabdah-patient-web
    stop_grace_period: 30s   # 20.9: SIGTERM drain before SIGKILL (rolling deploys stop the old container with docker stop -t)
    restart: unless-stopped
    environment:
      NABD_API_BASE_URL: http://backend:8002/api/v1
      NEXT_PUBLIC_SITE_ORIGIN: https://nabd.plus
      # P14.9: shared secret of the edge worker (deploy/cloudflare/edge-html-worker); empty = edge mode off
      NABD_EDGE_STAMP_TOKEN: ${NABD_EDGE_STAMP_TOKEN:-}
      RUN_SANDBOX_TESTS: "false"
      RUN_SANDBOX_CREDENTIAL_TEST: "false"
      NODE_ENV: production
      NEXT_PUBLIC_SENTRY_DSN: "https://b85367ac6782629e65b311de92c0e3bc@o4511819998429184.ingest.de.sentry.io/4512078080245840"
      SENTRY_DSN: "https://b85367ac6782629e65b311de92c0e3bc@o4511819998429184.ingest.de.sentry.io/4512078080245840"
      # #1603: the ISR/data cache lives in redis-cache (the image is built with NEXT_CACHE_HANDLER=redis), not in the
      # container layer. Redis down or slow: the page is rendered without it (a small in-process copy), never an error.
      NEXT_CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis-cache:6379
    depends_on: [backend]
    networks: [web, cache]
    # #1603: nothing can grow the container layer. The root filesystem is read-only; the only writable places are
    # memory-backed and capped (Next's image-optimizer cache, scratch). A write beyond the cap fails that one write.
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/.next/cache:size=128m
    logging: *logopts

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: nabdah-certbot
    volumes:
      - ./certs/live:/etc/letsencrypt
      - ./certs/webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks: [web]
    logging: *logopts

volumes:
  mongo_data:
  redis_data:
  clamav_db:
  meili_data:
  nginx_cache:

networks:
  internal:   # no public exposure — mongo/redis/fastapi live here
    driver: bridge
  web:        # nginx-facing services
    driver: bridge
  cache:      # redis-cache and its clients only (patient-web; the backend joins when REDIS_CACHE_URL is switched on)
    driver: bridge
    internal: true
