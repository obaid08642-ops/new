storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # Kept at 0.5 GB (the container limit in docker-compose.production.yml is 1600m, raised from 1200m on 2026-10-30 after 32 restarts: cache + connections + sorts + index builds). At rest mongod
      # holds about 700 MB in total on this host (docker stats, 2026-10-30); a larger cache only moves memory from the other containers into the page cache.
      cacheSizeGB: 0.5

net:
  port: 27017
  # Ops 2026-10-04: the deployed build asks the driver for zstd, which is not in the image;
  # offering zlib only (built into Node) keeps the connection working.
  compression:
    compressors: zlib
  bindIp: 0.0.0.0
  # every connection costs about 1 MB of stack and buffers; the API, the worker and the tools use a few dozen, so 300 is far above need and far below the 65536 default
  maxIncomingConnections: 300

security:
  authorization: enabled
  keyFile: /etc/mongo-keyfile

replication:
  replSetName: rs0

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 200
