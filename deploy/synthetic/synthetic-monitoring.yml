# Synthetic Monitoring Configuration for Nabd
# Runs critical user journeys every 5-15 minutes

synthetic_monitoring:
  enabled: true
  interval: 300  # 5 minutes default
  
  journeys:
    - name: "home-page"
      description: "Verify home page loads successfully"
      interval: 300  # 5 minutes
      steps:
        - action: "navigate"
          url: "https://nabd.plus"
          wait_for: "networkidle"
          timeout: 10000
        - action: "assert"
          selector: "[data-testid='hero-section']"
          condition: "visible"
        - action: "assert"
          condition: "status_code"
          expected: 200

    - name: "search-functionality"
      description: "Test search with common queries"
      interval: 600  # 10 minutes
      steps:
        - action: "navigate"
          url: "https://nabd.plus"
          wait_for: "networkidle"
        - action: "fill"
          selector: "[data-testid='search-input']"
          value: "cardiologist"
        - action: "click"
          selector: "[data-testid='search-button']"
        - action: "wait_for"
          selector: "[data-testid='search-results']"
        - action: "assert"
          selector: "[data-testid='search-results']"
          condition: "visible"
        - action: "assert"
          condition: "results_count"
          expected: ">0"

    - name: "product-detail"
      description: "Verify product detail page loads"
      interval: 600  # 10 minutes
      steps:
        - action: "navigate"
          url: "https://nabd.plus/products/test-product-id"
          wait_for: "networkidle"
        - action: "assert"
          selector: "[data-testid='product-title']"
          condition: "visible"
        - action: "assert"
          selector: "[data-testid='add-to-cart']"
          condition: "enabled"

    - name: "cart-flow"
      description: "Add to cart flow (no payment)"
      interval: 900  # 15 minutes
      steps:
        - action: "navigate"
          url: "https://nabd.plus/products/test-product-id"
          wait_for: "networkidle"
        - action: "click"
          selector: "[data-testid='add-to-cart']"
        - action: "wait_for"
          selector: "[data-testid='cart-drawer']"
        - action: "assert"
          selector: "[data-testid='cart-item']"
          condition: "visible"
        - action: "click"
          selector: "[data-testid='view-cart']"
        - action: "wait_for"
          selector: "[data-testid='cart-page']"
        - action: "assert"
          selector: "[data-testid='checkout-button']"
          condition: "enabled"

    - name: "doctor-slots"
      description: "Verify doctor slots are displayed"
      interval: 600  # 10 minutes
      steps:
        - action: "navigate"
          url: "https://nabd.plus/doctors/cardiology"
          wait_for: "networkidle"
        - action: "assert"
          selector: "[data-testid='doctor-card']"
          condition: "visible"
        - action: "click"
          selector: "[data-testid='doctor-card']:first-child"
        - action: "wait_for"
          selector: "[data-testid='available-slots']"
        - action: "assert"
          selector: "[data-testid='slot-button']"
          condition: "enabled"

    - name: "patient-login"
      description: "Test patient login flow"
      interval: 900  # 15 minutes
      steps:
        - action: "navigate"
          url: "https://nabd.plus/login"
          wait_for: "networkidle"
        - action: "fill"
          selector: "[data-testid='email-input']"
          value: "{{SYNTHETIC_TEST_PATIENT_EMAIL}}"
        - action: "fill"
          selector: "[data-testid='password-input']"
          value: "{{SYNTHETIC_TEST_PATIENT_PASSWORD}}"
        - action: "click"
          selector: "[data-testid='login-button']"
        - action: "wait_for"
          selector: "[data-testid='patient-dashboard']"
        - action: "assert"
          selector: "[data-testid='patient-dashboard']"
          condition: "visible"

  alerts:
    - journey: "home-page"
      condition: "failure_rate > 0"
      severity: "critical"
      notification_channels: ["pagerduty", "slack", "email"]

    - journey: "search-functionality"
      condition: "failure_rate > 0.1"
      severity: "warning"
      notification_channels: ["slack"]

    - journey: "cart-flow"
      condition: "failure_rate > 0"
      severity: "critical"
      notification_channels: ["pagerduty", "slack", "email"]

    - journey: "doctor-slots"
      condition: "failure_rate > 0.1"
      severity: "warning"
      notification_channels: ["slack"]

    - journey: "patient-login"
      condition: "failure_rate > 0"
      severity: "critical"
      notification_channels: ["pagerduty", "slack", "email"]

  # Playwright configuration for browser-based checks
  browser:
    headless: true
    viewport:
      width: 1280
      height: 720
    user_agent: "Mozilla/5.0 (compatible; NabdSynthetic/1.0; +https://nabd.plus/synthetic)"
    timeout: 30000

  # Reporting
  reporting:
    prometheus_metrics: true
    prometheus_job_name: "nabd-synthetic"
    grafana_dashboard_uid: "nabd-synthetic-monitoring"