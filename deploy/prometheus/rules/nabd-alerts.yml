groups:
  - name: nabd-backend-alerts
    interval: 30s
    rules:
      # Service availability
      - alert: NabdBackendDown
        expr: up{job="nabd-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Nabd Backend is down"
          description: "Nabd Backend has been down for more than 1 minute"
          runbook_url: "https://github.com/your-org/nabd-plus/wiki/Runbook-BackendDown"

      # API availability SLO
      - alert: NabdApiAvailabilityBelowSLO
        expr: |
          (
            sum(rate(nabd_http_requests_total{status_code!~"5.."}[5m]))
            /
            sum(rate(nabd_http_requests_total[5m]))
          ) < 0.999
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API availability below 99.9% SLO"
          description: "API availability dropped below 99.9% over the last 5 minutes"
          runbook_url: "https://github.com/your-org/nabd-plus/wiki/Runbook-ApiAvailability"

      # HTTP error rate
      - alert: NabdHighHttpErrorRate
        expr: |
          sum(rate(nabd_http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(nabd_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "HTTP 5xx error rate is above 5% for more than 2 minutes"

      # Latency SLO
      - alert: NabdHighP95Latency
        expr: |
          histogram_quantile(0.95, sum(rate(nabd_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High p95 latency"
          description: "HTTP p95 latency is above 1 second"

      - alert: NabdHighP99Latency
        expr: |
          histogram_quantile(0.99, sum(rate(nabd_http_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical p99 latency"
          description: "HTTP p99 latency is above 5 seconds"

      # Checkout success rate SLO
      - alert: NabdCheckoutSuccessRateLow
        expr: |
          (
            sum(rate(nabd_checkout_success_total[5m]))
            /
            sum(rate(nabd_checkout_attempts_total[5m]))
          ) < 0.99
        for: 5m
        labels:
          severity: critical
          team: payments
        annotations:
          summary: "Checkout success rate below 99%"
          description: "Checkout success rate dropped below 99%"
          runbook_url: "https://github.com/your-org/nabd-plus/wiki/Runbook-CheckoutFailures"

      # Memory
      - alert: NabdHighMemoryUsage
        expr: |
          (nabd_memory_heap_used_bytes / nabd_memory_heap_limit_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High memory usage"
          description: "Heap memory usage is above 85% of limit"

      - alert: NabdCriticalMemoryUsage
        expr: |
          (nabd_memory_heap_used_bytes / nabd_memory_heap_limit_bytes) > 0.95
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical memory usage"
          description: "Heap memory usage is above 95% of limit - OOM risk"

      # Event loop lag
      - alert: NabdEventLoopLagHigh
        expr: nabd_event_loop_lag_p99_seconds > 0.1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High event loop lag"
          description: "Event loop p99 lag is above 100ms"

      # MongoDB
      - alert: NabdMongoHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(nabd_mongo_query_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "MongoDB high latency"
          description: "MongoDB p95 query latency is above 500ms"

      - alert: NabdMongoConnectionExhausted
        expr: |
          nabd_mongo_connections_active / (nabd_mongo_connections_active + nabd_mongo_connections_idle) > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "MongoDB connection pool exhausted"
          description: "MongoDB connection pool usage is above 90%"

      # Redis
      - alert: NabdRedisHighMemory
        expr: |
          nabd_redis_memory_used_bytes / nabd_redis_memory_peak_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 85% of peak"

      - alert: NabdRedisHighEvictions
        expr: |
          rate(nabd_redis_evictions_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High Redis eviction rate"
          description: "Redis is evicting more than 10 keys per second"

      - alert: NabdRedisConnectionRejected
        expr: |
          rate(nabd_redis_rejected_connections_total[5m]) > 1
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Redis rejecting connections"
          description: "Redis is rejecting connections"

      # Queue
      - alert: NabdQueueBacklog
        expr: nabd_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Queue backlog growing"
          description: "Queue depth exceeds 1000 jobs for more than 10 minutes"

      - alert: NabdQueueJobAgeHigh
        expr: nabd_queue_job_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Queue job age high"
          description: "Oldest job in queue is older than 5 minutes"

      - alert: NabdQueueHighFailureRate
        expr: |
          sum(rate(nabd_queue_failed_jobs_total[5m])) / sum(rate(nabd_queue_jobs_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High queue failure rate"
          description: "Queue job failure rate is above 5%"

      # Cache
      - alert: NabdCacheHitRatioLow
        expr: nabd_cache_hit_ratio < 0.7
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Low cache hit ratio"
          description: "Cache hit ratio is below 70%"

      # LiveKit
      - alert: NabdLivekitHighCpu
        expr: nabd_livekit_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "LiveKit high CPU usage"
          description: "LiveKit CPU usage is above 80%"

      # Notifications
      - alert: NabdPushNotificationFailureRateHigh
        expr: |
          sum(rate(nabd_push_notifications_failed_total[5m])) / sum(rate(nabd_push_notifications_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: notifications
        annotations:
          summary: "High push notification failure rate"
          description: "Push notification failure rate is above 10%"

      - alert: NabdSmsFailureRateHigh
        expr: |
          sum(rate(nabd_sms_failed_total[5m])) / sum(rate(nabd_sms_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: notifications
        annotations:
          summary: "High SMS failure rate"
          description: "SMS failure rate is above 10%"

      - alert: NabdEmailFailureRateHigh
        expr: |
          sum(rate(nabd_email_failed_total[5m])) / sum(rate(nabd_email_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: notifications
        annotations:
          summary: "High email failure rate"
          description: "Email failure rate is above 10%"

  - name: nabd-recording-rules
    interval: 30s
    rules:
      # Pre-compute common queries for dashboards
      - record: nabd:http:requests:rate5m
        expr: sum(rate(nabd_http_requests_total[5m]))

      - record: nabd:http:latency:p50:5m
        expr: histogram_quantile(0.50, sum(rate(nabd_http_request_duration_seconds_bucket[5m])) by (le))

      - record: nabd:http:latency:p95:5m
        expr: histogram_quantile(0.95, sum(rate(nabd_http_request_duration_seconds_bucket[5m])) by (le))

      - record: nabd:http:latency:p99:5m
        expr: histogram_quantile(0.99, sum(rate(nabd_http_request_duration_seconds_bucket[5m])) by (le))

      - record: nabd:http:error_rate:5m
        expr: sum(rate(nabd_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(nabd_http_requests_total[5m]))

      - record: nabd:checkout:success_rate:5m
        expr: sum(rate(nabd_checkout_success_total[5m])) / sum(rate(nabd_checkout_attempts_total[5m]))

      - record: nabd:mongo:latency:p50:5m
        expr: histogram_quantile(0.50, sum(rate(nabd_mongo_query_duration_seconds_bucket[5m])) by (le))

      - record: nabd:mongo:latency:p95:5m
        expr: histogram_quantile(0.95, sum(rate(nabd_mongo_query_duration_seconds_bucket[5m])) by (le))

      - record: nabd:mongo:latency:p99:5m
        expr: histogram_quantile(0.99, sum(rate(nabd_mongo_query_duration_seconds_bucket[5m])) by (le))

      - record: nabd:redis:latency:p50:5m
        expr: histogram_quantile(0.50, sum(rate(nabd_redis_command_duration_seconds_bucket[5m])) by (le))

      - record: nabd:redis:latency:p95:5m
        expr: histogram_quantile(0.95, sum(rate(nabd_redis_command_duration_seconds_bucket[5m])) by (le))

      - record: nabd:redis:latency:p99:5m
        expr: histogram_quantile(0.99, sum(rate(nabd_redis_command_duration_seconds_bucket[5m])) by (le))

      - record: nabd:queue:failure_rate:5m
        expr: sum(rate(nabd_queue_failed_jobs_total[5m])) / sum(rate(nabd_queue_jobs_total[5m]))