global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@nabd.plus'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    # Warning alerts - delayed notification
    - match:
        severity: warning
      receiver: 'warning'
      continue: true
    # Payment-related alerts
    - match:
        team: payments
      receiver: 'payments'
      continue: true
    # Notification-related alerts
    - match:
        team: notifications
      receiver: 'notifications'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'oncall@nabd.plus'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
        title: 'Nabd Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

  - name: 'critical'
    email_configs:
      - to: 'oncall@nabd.plus'
        send_resolved: true
        headers:
          subject: '[CRITICAL] Nabd Alert: {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_CRITICAL}'
        channel: '#alerts-critical'
        send_resolved: true
        title: '[CRITICAL] Nabd Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\nRunbook: {{ .Annotations.runbook_url }}{{ end }}'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}'
        details:
          summary: '{{ .Annotations.summary }}'
          description: '{{ .Annotations.description }}'
          runbook: '{{ .Annotations.runbook_url }}'

  - name: 'warning'
    email_configs:
      - to: 'team@nabd.plus'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_WARNING}'
        channel: '#alerts-warning'
        send_resolved: true
        title: '[WARNING] Nabd Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

  - name: 'payments'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_PAYMENTS}'
        channel: '#alerts-payments'
        send_resolved: true
        title: '[PAYMENTS] Nabd Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
    email_configs:
      - to: 'payments-team@nabd.plus'
        send_resolved: true

  - name: 'notifications'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_NOTIFICATIONS}'
        channel: '#alerts-notifications'
        send_resolved: true
        title: '[NOTIFICATIONS] Nabd Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']