version: '3.8'

services:
  # Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nabd-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - nabd-observability
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager - Alert routing and deduplication
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: nabd-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - nabd-observability

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: nabd-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - nabd-observability
    depends_on:
      - prometheus
      - loki
      - tempo

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.2
    container_name: nabd-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - nabd-observability

  # Promtail - Log shipper
  promtail:
    image: grafana/promtail:2.9.2
    container_name: nabd-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    networks:
      - nabd-observability
    depends_on:
      - loki

  # Tempo - Distributed tracing
  tempo:
    image: grafana/tempo:2.3.1
    container_name: nabd-tempo
    command:
      - '-config.file=/etc/tempo/tempo-config.yml'
    volumes:
      - ./deploy/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"  # Tempo HTTP
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    restart: unless-stopped
    networks:
      - nabd-observability

  # Jaeger (alternative to Tempo)
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: nabd-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/jaeger/data
      - BADGER_DIRECTORY_KEY=/jaeger/data
    volumes:
      - jaeger-data:/jaeger/data
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent
      - "14268:14268"  # Jaeger collector HTTP
    restart: unless-stopped
    networks:
      - nabd-observability

  # Node Exporter - Host metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: nabd-node-exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - nabd-observability

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: nabd-cadvisor
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
      - '/dev/disk/:/dev/disk:ro'
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - nabd-observability

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: nabd-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    restart: unless-stopped
    networks:
      - nabd-observability
    depends_on:
      - redis

  # MongoDB Exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.39.0
    container_name: nabd-mongodb-exporter
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    ports:
      - "9216:9216"
    restart: unless-stopped
    networks:
      - nabd-observability
    depends_on:
      - mongodb

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.0.0
    container_name: nabd-nginx-exporter
    environment:
      - NGINX_SCRAPE_URI=http://nginx:8080/stub_status
    ports:
      - "9113:9113"
    restart: unless-stopped
    networks:
      - nabd-observability
    depends_on:
      - nginx

  # Synthetic monitoring (Playwright-based)
  synthetic:
    build:
      context: .
      dockerfile: deploy/synthetic/Dockerfile
    container_name: nabd-synthetic
    environment:
      - SYNTHETIC_CONFIG=/config/synthetic-monitoring.yml
      - BASE_URL=https://nabd.plus
      - SYNTHETIC_TEST_PATIENT_EMAIL=${SYNTHETIC_TEST_PATIENT_EMAIL}
      - SYNTHETIC_TEST_PATIENT_PASSWORD=${SYNTHETIC_TEST_PATIENT_PASSWORD}
    volumes:
      - ./deploy/synthetic/synthetic-monitoring.yml:/config/synthetic-monitoring.yml:ro
    restart: unless-stopped
    networks:
      - nabd-observability

networks:
  nabd-observability:
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
  jaeger-data: