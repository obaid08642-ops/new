# ═══ Redis production — QUEUE instance ═══
# BullMQ jobs, locks, rate limiters — persistence-critical
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence — queues must survive restarts
appendonly yes
appendfsync everysec

# Memory policy — NO eviction for queue keys; only volatile keys with TTL can be evicted if policy permits
maxmemory 800mb
maxmemory-policy noeviction

# Speed
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 80% memory alert threshold
notify-keyspace-events "Ex"
client-output-buffer normal 0 0 0
client-output-buffer user 0 0 0