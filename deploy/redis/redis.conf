# ═══ Redis production — cache + BullMQ queues + rate limiters ═══
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence — queues must survive restarts
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Memory policy — cache eviction, queue keys are excluded by maxmemory-policy
maxmemory 512mb
maxmemory-policy volatile-lru

# Speed
tcp-backlog 511
timeout 0
tcp-keepalive 300
