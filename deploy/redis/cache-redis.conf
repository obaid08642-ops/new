# ═══ Redis production — CACHE instance ═══
# Ephemeral cache (interceptors, SWR, rate-limit spillover)
bind 0.0.0.0
protected-mode yes
port 6380

# Memory policy — allkeys-lru eviction under memory pressure
maxmemory 512mb
maxmemory-policy allkeys-lru

# No persistence — cache can be rebuilt
appendonly no
appendfsync no

# Speed
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Speed optimizations for cache workload
save "" 
tcp-keepalive 300