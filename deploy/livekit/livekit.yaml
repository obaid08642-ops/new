# ═══ LiveKit — self-hosted SFU for nabd.plus calls ═══
port: 7880

rtc:
  # ICE over TCP straight to the SFU: the fallback for networks that block UDP
  tcp_port: 7881
  # ONE UDP port for all media (ICE mux): one firewall rule instead of a range, and it works behind carrier NAT
  udp_port: 7882
  # The public IPv4 is discovered with STUN (use_external_ip) and advertised next to the host addresses. It used to be a fixed node_ip that the deploy script
  # filled with whatever `curl ifconfig.me` returned, which on a dual-stack host is the IPv6 address: IPv4-only clients (many Wi-Fi and CGNAT networks) then
  # had no candidate to reach and could not join a call. Do not put a node_ip back.
  use_external_ip: true

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

# Embedded TURN disabled — our dedicated coturn container handles STUN/TURN
turn:
  enabled: false

room:
  empty_timeout: 300
  departure_timeout: 20

logging:
  level: info
