# P14.11: safe API micro-cache. Included in api.nabd.plus locations.
# Fail-closed: nginx stores only what the backend marks public (@PublicCache sends `public, s-maxage=…`); `private`,
# `no-store` and answers without a cache header are never stored. Any request with an Authorization header or any cookie
# skips the cache both ways ($nabd_skip_cache, nginx.conf), so one person's answer can never be served to another.
proxy_cache api_cache;
proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_language";
proxy_cache_methods GET HEAD;
proxy_cache_bypass $nabd_skip_cache;
proxy_no_cache $nabd_skip_cache;
# one request refreshes a key while the others wait or get the stale copy (no stampede on the backend)
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_background_update on;
# a failing backend serves the last good copy instead of an error (stale-if-error, owner decision 2026-10-06)
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
add_header X-Cache-Status $upstream_cache_status always;
