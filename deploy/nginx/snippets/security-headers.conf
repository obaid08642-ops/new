# 16.4 — the security headers for every server that serves content itself (static files, well-known files).
# The proxied apps set their own (Nest: security.module.ts, Next: next.config.ts); this is for what nginx answers.
# NOTE: nginx does not inherit `add_header` into a block that has its own `add_header` — a location with
# `add_header Cache-Control ...` must `include` this file again (tools/audit/nginx_headers_check.py enforces it).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
