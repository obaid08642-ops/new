# ── nabd.plus / www.nabd.plus → patient web (Next.js standalone) ────
server {
  listen 443 ssl;
  http2 on;
  server_name nabd.plus www.nabd.plus;

  ssl_certificate     /etc/letsencrypt/live/nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;



  location / {
    proxy_pass http://patient_web_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    # A product page answers with a Link header of 7 hreflang URLs; with Arabic/Urdu slugs (percent-encoded) plus the CSP the
    # response headers pass nginx's default 4 KB buffer and nginx answered 502 ("upstream sent too big header").
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
  }

  # Product and category pages (/<locale>/p/<slug>, /<locale>/c/<category>): unknown automated clients are limited (zone web_bot in nginx.conf), people and the known
  # search bots are not. A page that is not in the ISR cache yet costs an API read, which is what a crawler of thousands of slugs multiplies.
  location ~ ^/(ar|en|ur|hi|bn|fil|tl)/(p|c)/ {
    limit_req zone=web_bot burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://patient_web_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
  }

  location /_next/static/ {
    proxy_pass http://patient_web_pool;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
