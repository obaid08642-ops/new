# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
  listen 80;
  server_name api.nabd.plus admin.nabd.plus provider.nabd.plus live.nabd.plus turn.nabd.plus nabd.plus www.nabd.plus;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  location / { return 301 https://$host$request_uri; }
}

# ── api.nabd.plus → NestJS backend (upstream keepalive pool) ─────────────────
server {
  listen 443 ssl;
  listen 443 quic reuseport;
  listen [::]:443 quic reuseport;
  http2 on;
  http3 on;
  add_header Alt-Svc 'h3=":443"; ma=86400' always;
  server_name api.nabd.plus;

  ssl_certificate     /etc/letsencrypt/live/api.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(), hid=(), idle-detection=(), interest-cohort=(), local-fonts=(), otp-credentials=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), web-share=(), window-management=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location = /.well-known/security.txt {
    default_type text/plain;
    return 200 'Contact: mailto:security@nabd.plus\nExpires: 2027-12-31T23:59:59.000Z\nPreferred-Languages: en\nCanonical: https://nabd.plus/.well-known/security.txt\nPolicy: https://nabd.plus/security-policy\nAcknowledgments: https://nabd.plus/hall-of-fame\nHiring: https://nabd.plus/careers';
  }

  location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /usr/share/nginx/well-known/assetlinks.json;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    alias /usr/share/nginx/well-known/apple-app-site-association;
    add_header Cache-Control "public, max-age=3600";
  }

  # Socket.IO — websocket
  location /socket.io/ {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # ── X0 allow-list: ONLY these anonymous catalog reads are cached. ──────────
  # Everything else falls through to `location /` (no shared cache) and the
  # backend default `private, no-store`. Every cached location bypasses on
  # Authorization or any session cookie. Real session cookies:
  # nabd_patient_access / nabd_patient_refresh (app), nabd_access /
  # nabd_refresh / nabd_device (web BFF), nabd_admin_token /
  # nabd_admin_device (admin). Cloudflare is NOT touched here (owner action).

  # Medicine catalog root list — @Public() GET /api/v1/medicines
  location = /api/v1/medicines {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Medicine public leaves only — never bookings/mine, me/*, search/recent, admin/*.
  location ~ ^/api/v1/medicines/(autocomplete|by-barcode/[^/]+|categories|filters|hot|stream|search/did-you-mean|search/trending|[^/]+/details|[^/]+/alternatives)/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Medicine item detail — single path segment, excluding private leaves.
  location ~ ^/api/v1/medicines/(?!admin($|/)|search($|/)|me($|/))[^/]+/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Health endpoints — no rate limit
  location ~ ^/(health|api/v1/health) {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  # Auth endpoints — strict rate limit
  location ~ ^/api/v1/auth/(login|register|send-otp|verify-otp|social-login) {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Radiology + labs public catalog reads only (15 min).
  # Public: radiology/{services,compatible-providers,modalities,services/:id},
  # labs/{services,packages,categories,compatible-providers,services/:id,packages/:id}.
  # Private (bookings/mine, bookings/:id, tracking, reports/mine,
  # provider/inbox, team/*, samples, wallet, queue, admin/*) are NOT matched
  # and fall through to `location /` with no shared cache.
  location ~ ^/api/v1/radiology/(services|compatible-providers|modalities|services/[^/]+)/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  location ~ ^/api/v1/labs/(services|packages|categories|compatible-providers|services/[^/]+|packages/[^/]+)/?(\?.*)?$ {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    proxy_no_cache $http_authorization $cookie_nabd_patient_access $cookie_nabd_patient_refresh $cookie_nabd_access $cookie_nabd_refresh $cookie_nabd_device $cookie_nabd_admin_token $cookie_nabd_admin_device;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Everything else
  location / {
    limit_req zone=api burst=500 nodelay;
    limit_conn conn 1000;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
}

# ── admin.nabd.plus → Next.js admin dashboard ────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name admin.nabd.plus;

  ssl_certificate     /etc/letsencrypt/live/admin.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(), hid=(), idle-detection=(), interest-cohort=(), local-fonts=(), otp-credentials=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), web-share=(), window-management=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location = /.well-known/security.txt {
    default_type text/plain;
    return 200 'Contact: mailto:security@nabd.plus\nExpires: 2027-12-31T23:59:59.000Z\nPreferred-Languages: en\nCanonical: https://nabd.plus/.well-known/security.txt\nPolicy: https://nabd.plus/security-policy\nAcknowledgments: https://nabd.plus/hall-of-fame\nHiring: https://nabd.plus/careers';
  }

  location / {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://admin-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── provider.nabd.plus → static ──────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name provider.nabd.plus;
  ssl_certificate     /etc/letsencrypt/live/provider.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/provider.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  root /usr/share/nginx/provider;
  index index.html;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(), hid=(), idle-detection=(), interest-cohort=(), local-fonts=(), otp-credentials=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), web-share=(), window-management=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  location = /.well-known/security.txt {
    default_type text/plain;
    return 200 'Contact: mailto:security@nabd.plus\nExpires: 2027-12-31T23:59:59.000Z\nPreferred-Languages: en\nCanonical: https://nabd.plus/.well-known/security.txt\nPolicy: https://nabd.plus/security-policy\nAcknowledgments: https://nabd.plus/hall-of-fame\nHiring: https://nabd.plus/careers';
  }

  location / { try_files $uri $uri/ /index.html; expires 1h; add_header Cache-Control "public"; }
}

