# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
  listen 80;
  server_name api.nabd.plus admin.nabd.plus provider.nabd.plus live.nabd.plus turn.nabd.plus nabd.plus www.nabd.plus;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  location / { return 301 https://$host$request_uri; }
}

# ── api.nabd.plus → NestJS backend (upstream keepalive pool) ─────────────────
server {
  listen 443 ssl;
  listen 443 quic reuseport;
  listen [::]:443 quic reuseport;
  http2 on;
  http3 on;
  add_header Alt-Svc 'h3=":443"; ma=86400' always;
  server_name api.nabd.plus;

  ssl_certificate     /etc/letsencrypt/live/api.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /usr/share/nginx/well-known/assetlinks.json;
    add_header Cache-Control "public, max-age=3600";
  }
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    alias /usr/share/nginx/well-known/apple-app-site-association;
    add_header Cache-Control "public, max-age=3600";
  }

  # Socket.IO — websocket
  location /socket.io/ {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Medicine catalog — cached 5 min at Nginx
  location ~ ^/api/v1/medicines {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Health endpoints — no rate limit
  location ~ ^/(health|api/v1/health) {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  # Auth endpoints — strict rate limit
  location ~ ^/api/v1/auth/(login|register|send-otp|verify-otp|social-login) {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Catalog endpoints — cached 15 min
  location ~ ^/api/v1/(lab-services|radiology|care/services) {
    limit_req zone=api burst=300 nodelay;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache api_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15m;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
    proxy_read_timeout 30s;
  }

  # Everything else
  location / {
    limit_req zone=api burst=500 nodelay;
    limit_conn conn 1000;
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
}

# ── admin.nabd.plus → Next.js admin dashboard ────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name admin.nabd.plus;

  ssl_certificate     /etc/letsencrypt/live/admin.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;

  location / {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://admin-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── provider.nabd.plus → static ──────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name provider.nabd.plus;
  ssl_certificate     /etc/letsencrypt/live/provider.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/provider.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/provider;
  index index.html;
  location / { try_files $uri $uri/ /index.html; expires 1h; add_header Cache-Control "public"; }
}

# ── live.nabd.plus → LiveKit ──────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name live.nabd.plus;
  ssl_certificate     /etc/letsencrypt/live/live.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/live.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  location / {
    proxy_pass http://livekit:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
