# ── staging.nabd.plus → Isolated Staging Environment ────────────────
server {
  listen 80;
  server_name staging.nabd.plus;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name staging.nabd.plus;

  ssl_certificate     /etc/letsencrypt/live/staging.nabd.plus/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.nabd.plus/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(), hid=(), idle-detection=(), interest-cohort=(), local-fonts=(), otp-credentials=(), picture-in-picture=(), publickey-credentials-get=(self), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), web-share=(), window-management=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Environment "staging-isolated" always;

  location = /.well-known/security.txt {
    default_type text/plain;
    return 200 'Contact: mailto:security@nabd.plus\nExpires: 2027-12-31T23:59:59.000Z\nPreferred-Languages: en\nCanonical: https://nabd.plus/.well-known/security.txt\nPolicy: https://nabd.plus/security-policy\nAcknowledgments: https://nabd.plus/hall-of-fame\nHiring: https://nabd.plus/careers';
  }

  # Route all backend API requests directly to the isolated staging backend
  location /api/v1/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass http://nabdah-staging-backend:8003/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://patient-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }

  location /_next/static/ {
    proxy_pass http://patient-web:3000;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
