user  nginx;
worker_rlimit_nofile 1048576;
worker_processes  auto;
worker_cpu_affinity auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 65535;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_user_agent" rt=$request_time uc=$upstream_cache_status';
  access_log /var/log/nginx/access.log main buffer=16k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 75;
  keepalive_requests 10000;
  client_max_body_size 25m;
  client_body_timeout 30s;
  client_header_timeout 30s;

  # ── Gzip compression ──
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml+rss
             image/svg+xml font/woff font/woff2;

  # ── Rate limiting zones (relaxed — Cloudflare handles external DDoS) ──
  limit_req_zone $binary_remote_addr zone=api:20m rate=500r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:20m;

  # ── WebSocket upgrade map ──
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Upstream keepalive pool (avoids TCP handshake per request) ──
  upstream backend_pool {
    server backend:8002;
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }

  upstream staging_pool {
    server nabdah-staging-backend:8003;
    keepalive 128;
    keepalive_requests 5000;
    keepalive_timeout 60s;
  }

  # ── Static API cache (public GET catalog endpoints only) ──
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m
                   max_size=1g inactive=60m use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
