user  nginx;
worker_rlimit_nofile 1048576;
worker_processes  auto;
worker_cpu_affinity auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 65535;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  # 16.4: no directory listing anywhere, set explicitly (it is the default, but a later `autoindex on` must show in review).
  autoindex off;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_user_agent" rt=$request_time uc=$upstream_cache_status';
  access_log /var/log/nginx/access.log main buffer=16k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 75;
  keepalive_requests 10000;
  client_max_body_size 25m;
  client_body_timeout 30s;
  client_header_timeout 30s;

  # ── Gzip compression ──
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml+rss
             image/svg+xml font/woff font/woff2;

  # ── Rate limiting zones (relaxed — Cloudflare handles external DDoS) ──
  limit_req_zone $binary_remote_addr zone=api:20m rate=500r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # P14.11: search and checkout get their own limits (a search storm or a checkout replay cannot use the whole api budget)
  limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=checkout:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:20m;

  # P14.11: a request with credentials (Authorization or any cookie) never reads or writes the shared API cache
  map "$http_authorization$http_cookie" $nabd_skip_cache {
    default 1;
    ""      0;
  }

  # ── WebSocket upgrade map ──
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Upstreams: names re-resolved while nginx runs ──
  # nginx resolves a plain `proxy_pass http://host:port` once, when it loads its config. A container that is recreated
  # (a deploy, a restart outside a deploy) can come back on another address, and nginx then keeps sending its traffic
  # to whoever holds the old one: the 2026-10-15 rehearsal sent nabd.plus to admin-web (404 on /ar). Each upstream
  # below has a shared zone and `resolve`, so nginx asks Docker's DNS (127.0.0.11) again at most every 10 s; a name
  # that does not resolve yet does not stop nginx from starting or reloading. Needs nginx >= 1.27.3 (compose pins it).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # keepalive pool to the API (avoids a TCP handshake per request)
  upstream backend_pool {
    zone backend_pool 64k;
    server backend:8002 resolve;
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }

  upstream patient_web_pool {
    zone patient_web_pool 64k;
    server patient-web:3000 resolve;
  }

  upstream admin_web_pool {
    zone admin_web_pool 64k;
    server admin-web:3000 resolve;
  }

  upstream livekit_pool {
    zone livekit_pool 64k;
    server livekit:7880 resolve;
  }

  upstream staging_pool {
    # staging disabled 2026-10-04 (it shared the production server); a missing host here makes
    # every nginx reload fail, so the upstream points at a closed local port, marked down.
    server 127.0.0.1:9 down;
    keepalive 128;
    keepalive_requests 5000;
    keepalive_timeout 60s;
  }

  # ── Static API cache (public GET catalog endpoints only) ──
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m
                   max_size=1g inactive=60m use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
