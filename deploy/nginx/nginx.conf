user  nginx;
worker_rlimit_nofile 1048576;
worker_processes  auto;
worker_cpu_affinity auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 65535;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  # 16.4: no directory listing anywhere, set explicitly (it is the default, but a later `autoindex on` must show in review).
  autoindex off;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_user_agent" rt=$request_time uc=$upstream_cache_status';
  access_log /var/log/nginx/access.log main buffer=16k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 75;
  keepalive_requests 10000;
  client_max_body_size 25m;
  client_body_timeout 30s;
  client_header_timeout 30s;

  # ── Gzip compression ──
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml+rss
             image/svg+xml font/woff font/woff2;

  # ── Rate limiting zones (relaxed — Cloudflare handles external DDoS) ──
  limit_req_zone $binary_remote_addr zone=api:20m rate=500r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # P14.11: search and checkout get their own limits (a search storm or a checkout replay cannot use the whole api budget)
  limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=checkout:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn:20m;

  # 2026-11-14 (P0): the patient web (nabd-web.conf) had NO limit; a crawler asking for thousands of /p/<slug> and /c/<category> pages made the web server
  # call the API for every page it had not rendered yet, while mongod was being killed. Unknown automated clients are limited per client address on the
  # catalogue pages only; people and the well-known search / preview bots are never limited by this rule. Cloudflare is in front, so the client address
  # is CF-Connecting-IP (nginx sees Cloudflare's own address in $remote_addr), falling back to $remote_addr when the header is absent.
  map $http_cf_connecting_ip $web_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
  }
  # first match wins: the known good bots come first (they stay unlimited here: Cloudflare's verified-bot handling and robots.txt are theirs to manage)
  map $http_user_agent $web_bot_class {
    default 0;
    ~*(googlebot|adsbot-google|mediapartners-google|google-inspectiontool|bingbot|duckduckbot|applebot|yandex|baiduspider|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot) 0;
    ~*(bot|crawl|spider|scrap|python-requests|python-urllib|aiohttp|httpx|curl/|wget/|libwww|go-http-client|okhttp|java/|node-fetch|axios|headlesschrome|phantomjs) 1;
  }
  map $web_bot_class $web_bot_key {
    0 "";
    1 $web_client_ip;
  }
  # an empty key is not counted: only unknown automated clients use this zone. 30 requests a minute each, a burst of 10, then 429 (Retry-After via the error page).
  limit_req_zone $web_bot_key zone=web_bot:10m rate=30r/m;

  # P14.11: a request with credentials (Authorization or any cookie) never reads or writes the shared API cache
  map "$http_authorization$http_cookie" $nabd_skip_cache {
    default 1;
    ""      0;
  }

  # ── WebSocket upgrade map ──
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Upstreams: names re-resolved while nginx runs ──
  # nginx resolves a plain `proxy_pass http://host:port` once, when it loads its config. A container that is recreated
  # (a deploy, a restart outside a deploy) can come back on another address, and nginx then keeps sending its traffic
  # to whoever holds the old one: the 2026-10-15 rehearsal sent nabd.plus to admin-web (404 on /ar). Each upstream
  # below has a shared zone and `resolve`, so nginx asks Docker's DNS (127.0.0.11) again at most every 10 s; a name
  # that does not resolve yet does not stop nginx from starting or reloading. Needs nginx >= 1.27.3 (compose pins it).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # keepalive pool to the API (avoids a TCP handshake per request)
  upstream backend_pool {
    zone backend_pool 64k;
    # R4: with 2+ API replicas under the alias `backend`, a replica that refuses or times out twice is skipped for 5 s; the request is retried once on another one
    # (nginx only retries idempotent methods unless `non_idempotent` is set, so a POST is never sent twice).
    server backend:8002 resolve max_fails=2 fail_timeout=5s;
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }

  upstream patient_web_pool {
    zone patient_web_pool 64k;
    server patient-web:3000 resolve;
  }

  upstream admin_web_pool {
    zone admin_web_pool 64k;
    server admin-web:3000 resolve;
  }

  upstream livekit_pool {
    zone livekit_pool 64k;
    server livekit:7880 resolve;
  }

  upstream staging_pool {
    # staging disabled 2026-10-04 (it shared the production server); a missing host here makes
    # every nginx reload fail, so the upstream points at a closed local port, marked down.
    server 127.0.0.1:9 down;
    keepalive 128;
    keepalive_requests 5000;
    keepalive_timeout 60s;
  }

  # ── Static API cache (public GET catalog endpoints only) ──
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m
                   max_size=1g inactive=60m use_temp_path=off;

  include /etc/nginx/conf.d/*.conf;
}
