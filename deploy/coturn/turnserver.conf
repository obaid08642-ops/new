# ═══ Coturn — nabd.plus self-hosted STUN/TURN ═══
# Shared-secret auth (use-auth-secret) matches the backend COTURN_SECRET —
# the API issues time-limited HMAC credentials via GET /coturn/credentials.

listening-port=3478
tls-listening-port=5349

# Realm — MUST match backend env TURN_REALM
realm=nabd.plus

# Time-limited credential mechanism.
# The secret is NEVER committed: a TURN static-auth-secret in git compromises every
# relayed call, because the server mints valid credentials for anyone presenting it.
# deploy/scripts/render-coturn-config.sh writes the real value into
# deploy/coturn/turnserver.rendered.conf (git-ignored) from COTURN_STATIC_AUTH_SECRET,
# and docker-compose mounts that file. The placeholder below makes an unrendered
# config fail loudly rather than start with a known secret.
use-auth-secret
static-auth-secret=${COTURN_STATIC_AUTH_SECRET:?render deploy/coturn/turnserver.rendered.conf via deploy/scripts/render-coturn-config.sh}

# Server identity
server-name=turn.nabd.plus
fingerprint
lt-cred-mech

# TLS certs for TURNS (issued by certbot for turn.nabd.plus)
cert=/etc/coturn/certs/turn.nabd.plus/fullchain.pem
pkey=/etc/coturn/certs/turn.nabd.plus/privkey.pem

# Relay ports (UDP) — opened in UFW
min-port=40000
max-port=49999

# Public IP — replaced by deploy script with the real server IP
external-ip=2001:41d0:701:1100::cbb3

# Security hardening
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Logging
log-file=stdout
verbose
