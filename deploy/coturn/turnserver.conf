# ═══ Coturn — nabd.plus self-hosted STUN/TURN ═══
# Shared-secret auth (use-auth-secret) matches the backend COTURN_SECRET —
# the API issues time-limited HMAC credentials via GET /coturn/credentials.

listening-port=3478
tls-listening-port=5349

# Realm — MUST match backend env TURN_REALM
realm=nabd.plus

# Time-limited credential mechanism (secret injected at deploy time)
use-auth-secret
static-auth-secret=8c4ca0c366bd8c8158a429d896e0509f7cac427b992b120d

# Server identity
server-name=turn.nabd.plus
fingerprint
lt-cred-mech

# TLS certs for TURNS (issued by certbot for turn.nabd.plus)
cert=/etc/coturn/certs/turn.nabd.plus/fullchain.pem
pkey=/etc/coturn/certs/turn.nabd.plus/privkey.pem

# Relay ports (UDP) — opened in UFW
min-port=40000
max-port=49999

# Public IP — replaced by deploy script with the real server IP
external-ip=2001:41d0:701:1100::cbb3

# Security hardening
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Logging
log-file=stdout
verbose
