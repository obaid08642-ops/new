apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "traceId"
          matcherRegex: "traceId=(\\w+)"
          url: "http://tempo:3200/tempo/traces/${__value.raw}"
          datasourceUid: "tempo"

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: "prometheus"
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["service.name", "service.namespace"]
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: "loki"
        tags: ["service.name"]
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"