name: changed-paths
description: >-
  Which suites does this pull request need (tools/ci/path_groups.json)? One output per group, 'true' or 'false'. Push, schedule and manual
  runs, and a pull request whose changed files cannot be listed, get 'true' for every group. Needs a checkout with fetch-depth: 0.
outputs:
  backend: { description: backend suites, value: "${{ steps.run.outputs.backend }}" }
  web: { description: patient web suites, value: "${{ steps.run.outputs.web }}" }
  app: { description: patient app suites, value: "${{ steps.run.outputs.app }}" }
  provider: { description: provider app suites, value: "${{ steps.run.outputs.provider }}" }
  admin: { description: admin suites, value: "${{ steps.run.outputs.admin }}" }
  design: { description: design gates, value: "${{ steps.run.outputs.design }}" }
  live: { description: live gate, value: "${{ steps.run.outputs.live }}" }
  acceptance: { description: acceptance specs, value: "${{ steps.run.outputs.acceptance }}" }
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: python3 tools/ci/changed_paths.py --event "$EVENT" --base "$BASE" --head "$HEAD" | tee -a "$GITHUB_OUTPUT"
