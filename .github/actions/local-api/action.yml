name: local-api
description: >
  A local API for the checks that build or render patient-web: MongoDB replica set, Redis, S3 stand-in, the real backend on 127.0.0.1:8002
  (the same start the live gate uses), and the published legal texts. Production must never be a CI dependency (owner/lead, 2026-11-02:
  every PR went red while api.nabd.plus was down). The caller must already have checked the repository out and set up Node 22.
outputs:
  api-base-url:
    description: The API base URL to give NABD_API_BASE_URL and INTERNAL_API_BASE_URL
    value: http://127.0.0.1:8002/api/v1
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'

    - name: MongoDB replica set, Redis, S3 stand-in
      shell: bash
      run: |
        docker run -d --name local-api-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
        docker run -d --name local-api-redis -p 6379:6379 redis:7
        for i in $(seq 1 30); do docker exec local-api-mongo mongosh --quiet --eval 'db.runCommand({ping:1})' && break; sleep 2; done
        docker exec local-api-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
        for i in $(seq 1 30); do docker exec local-api-mongo mongosh --quiet --eval 'rs.status().ok' | grep -q 1 && break; sleep 2; done
        pip install 'moto[server]==5.*' boto3
        nohup moto_server -p 9000 > /tmp/local-api-moto.log 2>&1 &
        for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000 && break; sleep 1; done
        python3 -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', aws_access_key_id='live', aws_secret_access_key='live-secret', region_name='us-east-1').create_bucket(Bucket='nabd-live')"

    - name: Backend (built from this commit, started like the live gate)
      shell: bash
      working-directory: backend
      run: |
        npm ci
        npm run build
        bash ../tools/live/start-backend.sh

    - name: Publish the legal texts (the policy pages answer 404 until they exist)
      shell: bash
      working-directory: backend
      env:
        NODE_ENV: development
        MONGO_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        DB_NAME: nabd_live
        APPLY: 'yes'
        POLICIES: all
      run: |
        # Test database only. A refusal here is printed, not fatal: the pages that need a text are then skipped by the checks (a 4xx route is not rendered).
        npx ts-node -T src/scripts/publish-legal-policy.ts 2>&1 | tail -15 || echo "legal texts not published (see above); the policy pages will answer 404 in this run"

    - name: The local API answers
      shell: bash
      run: |
        for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8002/api/v1/health/liveness && break; sleep 2; done
        curl -s -o /dev/null -w 'health: HTTP %{http_code}\n' http://127.0.0.1:8002/api/v1/health/liveness
        curl -s -o /dev/null -w 'doctors list: HTTP %{http_code}\n' 'http://127.0.0.1:8002/api/v1/doctors?limit=6'
        curl -s -o /dev/null -w 'config: HTTP %{http_code}\n' http://127.0.0.1:8002/api/v1/config
