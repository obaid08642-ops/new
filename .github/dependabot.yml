version: 2
updates:
  - package-ecosystem: npm
    directories: [/backend, /admin, /patient-web, /patient-app, /provider-app, /packages/ui, /packages/ui-native, /packages/shared-contracts]
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: chore
    # R20: one PR per app for all minor and patch updates (the weekly window, docs/ops/SUPPLY_CHAIN_R20.md); majors arrive as single PRs and follow docs/ops/UPGRADE_PLAN_MAJORS.md
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
  # Phase 16.7: base images of the production Dockerfiles (the Trivy image scan reports what they carry).
  - package-ecosystem: docker
    directories: [/backend, /deploy/docker]
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
