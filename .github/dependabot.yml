version: 2
updates:
  - package-ecosystem: npm
    directories: [/backend, /admin, /patient-web, /patient-app, /provider-app, /packages/ui, /packages/ui-native, /packages/shared-contracts]
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
  # Phase 16.7: base images of the production Dockerfiles (the Trivy image scan reports what they carry).
  - package-ecosystem: docker
    directories: [/backend, /deploy/docker]
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
