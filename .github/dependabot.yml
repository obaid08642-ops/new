version: 2
updates:
  - package-ecosystem: npm
    directories: [/backend, /patient-web, /patient-app, /provider-app]
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
