name: Patient Production CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - release/patient-production

permissions:
  contents: read

concurrency:
  group: patient-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Policy and source guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release governance documents
        run: |
          set -euo pipefail
          for file in \
            docs/release/DECISIONS_LOCKED.md \
            docs/release/SOURCE_PROVENANCE.md \
            docs/release/TRACEABILITY_MATRIX.md \
            docs/release/MIGRATION_AND_ROLLBACK.md \
            docs/release/REVIEW_PACKET.md; do
            test -s "$file"
          done
      - name: Reject customer wallet payment implementations
        run: |
          set -euo pipefail
          if git grep -nEi -- \
            'payment_method[[:space:]:]*[=:][[:space:]]*["'"'"']wallet["'"'"']|paymentMethod[[:space:]:]*[=:][[:space:]]*["'"'"']wallet["'"'"']|wallet_(paid|debit|payment)|payWithWallet' \
            -- backend patient-web patient-app; then
            echo 'Customer wallet payment code is prohibited by PAY-001.' >&2
            exit 1
          fi
      - name: Reject tracked secrets and application archives
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(google-services\.json|GoogleService-Info\.plist|.*\.p8|.*\.keystore|.*\.zip)$'; then
            echo 'Tracked credentials or application archives are prohibited in release source.' >&2
            exit 1
          fi

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Build governed shared contracts
        run: npx tsc --project ../packages/shared-contracts/tsconfig.json
      - name: Type check
        run: npx tsc --noEmit
      - name: Run unit and contract tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build

  design-system:
    name: Design tokens, brand assets and contrast
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generated artefacts are committed so every client can import them
      # without a build step. This step is what stops anyone hand-editing them
      # or changing a token without regenerating: a diff means dist/ is stale.
      - name: Generated artefacts are in sync with tokens.json
        run: npm run check
      # patient-web cannot @import a sibling package (Next refuses to resolve
      # outside the app root, via every mechanism), so the token sheets are
      # MIRRORED into patient-web/app/design-tokens/. The mirror is generated and
      # committed; this step is what stops it drifting from tokens.json and
      # quietly reintroducing a second source of truth.
      - name: Mirrored token sheets in patient-web are not stale
        run: npm run sync-web:check
      - name: Contrast check (both themes)
        run: npm run contrast
      # A5's guard. Ratcheted: the 289 sizes that predate the design system are
      # recorded in tools/design/no-px-font-size.baseline.json, and 12.A11
      # removes them as screens are rebuilt. This fails on any NEW one.
      - name: No new hard-coded font size (ratchet)
        run: npm run type-scale
      # A0 is the principle the owner set: nothing in a screen may hardcode a
      # colour, so changing a token changes every screen at once. This rule is
      # what makes that true rather than aspirational. RATCHETED and PARTIAL:
      # 9,563 colours predate the system and are frozen per file. 12.A11 clears
      # them; any NEW one fails here.
      - name: No new hard-coded colour, in any of the four clients (ratchet)
        run: npm run no-raw-color
      - name: No new emoji in UI (ratchet)
        run: npm run no-emoji
      - name: Install compiler
        run: npm install --ignore-scripts --no-save typescript@5.9.3
      - name: Type check the generated TypeScript module
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler dist/ts/tokens.ts

  brand-assets:
    name: Brand assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/brand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same rule as the tokens: dist/ is committed, so this fails if anyone
      # hand-edits a generated icon or redraws the mark away from the approved
      # geometry in src/logo-mark.svg.
      - name: Generated assets are in sync with the SVG sources
        run: node build.mjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install sharp (rasteriser)
        run: npm install --no-save --prefix ../admin sharp
      - name: Re-verify after a clean rasteriser
        run: node build.mjs --check

  design-artwork:
    name: Icon and illustration set (12.A6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same rule as the tokens and the brand: the generated icon sheets and the
      # preview page are committed so a reviewer can open dist/preview.html
      # without booting anything. This fails if anyone hand-edits a generated
      # file or redraws geometry without regenerating it.
      - name: Generated icon sheets and preview are in sync with the geometry
        run: npm test
      # The artwork is checked, not just generated: the generator refuses to emit
      # anything whose colour is not a `color.iconArt` key, so a stray hex fails
      # the build rather than shipping a colour the palette cannot change.
      - name: Install compiler
        run: npm install --ignore-scripts --no-save typescript@5.9.3
      - name: Type check the wrappers
        run: npx tsc --noEmit -p tsconfig.json
      - name: Type check the React Native wrapper over the same geometry
        working-directory: packages/ui-native
        run: npx tsc --noEmit -p tsconfig.json

  design-components:
    name: Component contract and conformance (12.A7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `tsc` here is not a formality. `packages/ui/components/conformance.ts`
      # compares the contract against BOTH renderers' prop maps, so this step
      # fails when a component exists on one platform and not the other, when a
      # renderer stops accepting a prop the contract promises, or when the two
      # disagree on a shape. That is the whole enforcement mechanism for "same
      # API on web and native", and it costs nothing to run.
      - name: Install the web design system
        working-directory: packages/ui
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: The two renderers implement one contract
        working-directory: packages/ui
        run: npx tsc --noEmit -p tsconfig.json
      - name: The React Native renderer type checks against the same contract
        working-directory: packages/ui-native
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
      # The gallery is the review artifact, and it renders the REAL components
      # rather than a hand-written template, so a component that does not
      # compile cannot appear in it.
      - name: The gallery renders every component
        working-directory: packages/ui
        run: npm test
      # The contract tests themselves (palette binding, the no-text rule, the a11y
      # contract, the grid sizes) run inside `patient-web` and `patient-mobile`,
      # which already run each app's full suite — duplicating the install here
      # would buy nothing and double the slowest part of CI.

  shared-contracts:
    name: Governed shared contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install compiler
        run: npm install --ignore-scripts --no-save typescript@5.9.3
      - name: Type check
        run: npx tsc --project tsconfig.json --noEmit
      - name: Build
        run: npx tsc --project tsconfig.json
      - name: Verify governed transitions
        run: npm test

  patient-web:
    name: Patient Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: patient-web/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm build

  patient-mobile:
    name: Patient Mobile build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patient-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: patient-app/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        # Expo's native bridge may report a non-zero exit after all tests pass.
        # The verifier rejects every failed/missing test based on Jest's JSON
        # result and does not treat a failing test suite as successful.
        run: |
          set +e
          npm test -- --runInBand --json --outputFile=/tmp/mobile-jest-result.json
          jest_exit=$?
          set -e
          node scripts/verify-jest-result.mjs /tmp/mobile-jest-result.json "$jest_exit"
      - name: Export web bundle
        run: npm run export:web

  provider-app:
    name: Provider App typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: provider-app/package-lock.json
      - name: Install frozen dependencies
        # Expo 54 + jest-expo 52 has a legacy optional peer in the locked tree.
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test -- --runInBand --forceExit

  admin:
    name: Admin Dashboard typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
