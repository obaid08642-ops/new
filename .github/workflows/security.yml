name: Security Scan

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, 'fix/**', 'plan/**']
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks on full git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
        # gitleaks-action exits non-zero when leaks are found, failing the job.

  # Phase 16.1 — no .env file may enter the repository, in any app.
  env-ignore:
    name: Env files ignored in every app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Every .env is ignored, templates stay tracked
        run: bash tools/audit/env_ignore_check.sh

  # Phase 16.4 — nginx keeps the security headers on what it serves itself, and never lists a directory.
  nginx-headers:
    name: nginx security headers and autoindex off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Static check of deploy/nginx
        run: |
          python3 tools/audit/nginx_headers_check.py
          python3 -m unittest tools/audit/test_nginx_headers_check.py

  # Phase 16.7 — dependency audit as a gate for every app: 0 NEW high/critical runtime advisories.
  # tools/audit/audit-baseline.json lists the known ones per app with the reason; a baseline entry that is no longer
  # vulnerable fails too, so the list only shrinks. Dev-only tooling is not audited (--omit=dev / --prod).
  dependency-audit:
    name: Dependency audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, admin, patient-web, patient-app, provider-app]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Enable pnpm (patient-web)
        if: matrix.app == 'patient-web'
        run: corepack enable
      - name: Audit the lockfile (no install needed)
        run: node tools/audit/audit_gate.mjs ${{ matrix.app }}

  # Phase 16.7 — lockfiles are enforced and every Action is pinned by commit SHA.
  supply-chain:
    name: Lockfiles and pinned Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Every app has a tracked lockfile in step with package.json; installs use it
        run: python3 tools/audit/lockfile_check.py
      - name: Every GitHub Action is pinned by commit SHA
        run: python3 tools/audit/pin_actions.py --check
      - name: The checks themselves still catch what they should
        run: python3 -m unittest tools/audit/test_supply_chain.py -v

  # Phase 16.7 — container image scanning.
  trivy:
    name: Trivy (dependency and filesystem scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan the backend dependency tree
        # Pinned by real commit SHA (review item F: no invented pins).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
        # The pre-existing advisories that need a MAJOR upgrade are listed in
        # backend/.trivyignore with the reason and the target version, so this
        # gate blocks NEW findings instead of failing forever on known debt.
        # (The action has no ignorefile input; Trivy reads TRIVY_IGNOREFILE.)
        env:
          TRIVY_IGNOREFILE: backend/.trivyignore
