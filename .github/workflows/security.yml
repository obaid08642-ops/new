name: Security Scan

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, 'fix/**', 'plan/**']
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks on full git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
        # gitleaks-action exits non-zero when leaks are found, failing the job.
