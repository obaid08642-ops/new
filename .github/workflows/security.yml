name: Security Scan

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, 'fix/**', 'plan/**']
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Run gitleaks on full git history
        uses: gitleaks/gitleaks-action@7a9390d0e8c5d8b6f5c8b5a8f8e8c8b5a8f8e8c8b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
        # gitleaks-action exits non-zero when leaks are found, failing the job.
