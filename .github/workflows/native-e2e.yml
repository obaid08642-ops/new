name: Native E2E (Android, Maestro)

# Real Android build of patient-app or provider-app on an emulator, against the real test stack (backend, MongoDB, Redis,
# S3/SMTP/payment test doubles). Maestro flows (tools/native/flows) sign in from a fresh install; the crawl (optional)
# opens each screen and taps every control (tools/native/native_crawl.py). Results and screenshots are uploaded as
# artifacts; the report job merges them (tools/native/report.py) into the run summary: pass/fail per flow, then the crawl.
# Owner-approved 2026-10-03 (Android first); brought to main 2026-10-25.
# Manual only: it is slow and costs runner minutes, so it has no pull_request or push trigger.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build and test
        type: choice
        options: [patient, provider]
        default: patient
      flow:
        description: 'Maestro flows to run: part of a file name in tools/native/flows (login), "all" or "none"'
        type: string
        default: login
      crawl:
        description: Also crawl every screen after the flows (slow)
        type: boolean
        default: false
      target:
        description: 'Account/crawl target: patient shard 0/6..5/6, or provider type (pharmacy, doctor, lab, radiology, home_care, hospital). Empty = first one, "all" = every one'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.ref }}-${{ inputs.app }}-${{ inputs.target }}-${{ inputs.flow }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      args: ${{ steps.args.outputs.args }}
    steps:
      - id: args
        env:
          APP: ${{ inputs.app }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          app, target = os.environ['APP'], os.environ['TARGET'].strip()
          everything = [f'{i}/6' for i in range(6)] if app == 'patient' else ['pharmacy', 'doctor', 'lab', 'radiology', 'home_care', 'hospital']
          args = everything if target == 'all' else [target or everything[0]]
          if any(a not in everything for a in args):
              raise SystemExit(f'target {target!r} is not one of {everything}')
          print('args=' + json.dumps(args))
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules/@aws-amplify && df -h /
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.app }}-app/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build release APK (x86_64, test backend)
        run: bash tools/native/build_android.sh ${{ inputs.app }}-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-${{ inputs.app }}-app
          path: |
            /tmp/native/${{ inputs.app }}-app.apk
            /tmp/native/jcenter_${{ inputs.app }}-app.txt
          retention-days: 7

  run:
    needs: [setup, build]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arg: ${{ fromJson(needs.setup.outputs.args) }}
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-${{ inputs.app }}-app
          path: /tmp/native
      - name: Test stack (backend, DB, test doubles, admin BFF)
        run: bash tools/native/ci_stack.sh
      - name: Seed real test data (live journeys) and accounts
        run: |
          pip install -q requests
          python3 tools/native/seed.py /tmp/native/accounts.json > /tmp/native/seed.log 2>&1 || (tail -n 80 /tmp/native/seed.log; exit 1)
          tail -n 5 /tmp/native/seed.log
          python3 tools/native/routes.py > /tmp/native/routes.json
      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator + Maestro flows + crawl
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          NATIVE_FLOW: ${{ inputs.flow }}
          NATIVE_CRAWL: ${{ inputs.crawl }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/native/run_job.sh ${{ inputs.app }} ${{ matrix.arg }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/native/out
          cp /tmp/native/seed.log /tmp/nabd-backend.log /tmp/native/out/ 2>/dev/null || true
      - id: name
        if: always()
        run: echo "n=run-${{ inputs.app }}-$(echo '${{ matrix.arg }}' | tr '/' 'of')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ steps.name.outputs.n }}
          path: /tmp/native/out
          retention-days: 14

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: run-*
          path: /tmp/native/all
      - name: Merge
        run: |
          mkdir -p /tmp/native/all
          python3 tools/native/report.py /tmp/native/all > /tmp/native/all/NATIVE_REPORT.md
          head -c 900000 /tmp/native/all/NATIVE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-report
          path: /tmp/native/all
          retention-days: 30
