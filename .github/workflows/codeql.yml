name: CodeQL Security Scan

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  schedule:
    - cron: '20 3 * * 6'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@1b54949b5f8e4b8b8b8b8b8b8b8b8b8b8b8b8b8b
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@7e8c8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8
      - uses: github/codeql-action/analyze@8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b
        with:
          category: '/language:${{ matrix.language }}'
