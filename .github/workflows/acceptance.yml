name: Acceptance

# Reviewer-written acceptance specs (backend/acceptance/<id>/). Every item the reviewer approved is
# listed in backend/acceptance/DONE and runs here on each PR to main (owner, 2026-10-06: the D-15
# AI-assistant test set runs in CI). Items still open are not run: they fail by design until done.
# The specs that start the real server need redis-server; MongoDB comes from mongodb-memory-server.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer push to the same PR replaces the older run; a run on main is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which suites does this pull request need (tools/ci/path_groups.json)? Docs-only and ops-only changes need none; a push, a schedule and a
  # manual run always run everything. Gated jobs are skipped, and a skipped job reports success, so the required checks still pass.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.p.outputs.backend }}
      web: ${{ steps.p.outputs.web }}
      app: ${{ steps.p.outputs.app }}
      provider: ${{ steps.p.outputs.provider }}
      admin: ${{ steps.p.outputs.admin }}
      design: ${{ steps.p.outputs.design }}
      live: ${{ steps.p.outputs.live }}
      acceptance: ${{ steps.p.outputs.acceptance }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: p
        uses: ./.github/actions/changed-paths

  acceptance:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: redis-server for the specs that start the real backend
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && sudo systemctl stop redis-server || true

      - run: npm ci --no-audit --no-fund

      - name: Approved acceptance items (acceptance/DONE)
        run: node scripts/run-acceptance.mjs --done
