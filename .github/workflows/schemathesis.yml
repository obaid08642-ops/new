name: Schemathesis fuzz

# 15.6: fuzz the OpenAPI spec with Schemathesis in CI, failing on any 5xx.
# The fuzz HARNESS script lives under backend/ and is owned by the backend
# agent (see the contract in docs/audit/P15_GATES_NOTES.md). This job brings
# up the same stack the live gate uses, checks the harness exists at its
# contract path, and runs it. A missing harness fails LOUDLY with the
# contract text — never a silent pass.
on:
  # Every pull request and every push to main runs it (no path filter); the nightly run and the manual run stay.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer commit on the same PR replaces the older run (the newest commit still runs every suite); a run on main, a schedule and a manual run are never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'rs.status().ok' | grep -q 1 && break; sleep 2; done

      - name: Test doubles (S3, SMTP sink, Moyasar) — the backend boots against all three
        run: |
          set -euo pipefail
          pip install 'moto[server]==5.*' boto3 aiosmtpd
          nohup moto_server -p 9000 > /tmp/moto.log 2>&1 &
          nohup python3 tools/live/smtp_sink.py > /tmp/smtp.log 2>&1 &
          nohup python3 tools/live/fake_moyasar.py > /tmp/moyasar.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000 && break; sleep 1; done
          python3 -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', aws_access_key_id='live', aws_secret_access_key='live-secret', region_name='us-east-1').create_bucket(Bucket='nabd-live')"
          # The backend is configured against the SMTP sink (:2525) and the fake
          # Moyasar gateway (:9100) as well — start-backend.sh points SES_SMTP_PORT
          # and MOYASAR_API_BASE at them. A double that is not up silently turns
          # every email/payment path into a 5xx, so fail here instead, loudly.
          python3 - <<'PY'
          import socket, sys
          for port, name in ((2525, 'smtp_sink'), (9100, 'fake_moyasar')):
              s = socket.socket()
              s.settimeout(2)
              try:
                  s.connect(('127.0.0.1', port))
              except OSError as e:
                  print(f'DOUBLE NOT UP: {name} on :{port} ({e}) — the backend would 5xx on every mail/payment call', file=sys.stderr)
                  sys.exit(1)
              finally:
                  s.close()
              print(f'{name} listening on :{port}')
          PY

      - name: Fuzzer
        run: pip install 'schemathesis==4.*' 'hypothesis==6.*'

      - name: Backend (build regenerates backend/openapi.json)
        working-directory: backend
        run: |
          npm ci
          npm run build
          node ../tools/live/seed_admin.js
          bash ../tools/live/start-backend.sh

      - name: Contract check — the backend-owned fuzz harness
        run: |
          if [[ ! -x backend/scripts/schemathesis_fuzz.sh ]]; then
            echo "DEFERRED-OUT-OF-SCOPE: backend fuzz harness missing." >&2
            echo "Contract (docs/audit/P15_GATES_NOTES.md): the backend agent owns" >&2
            echo "  backend/scripts/schemathesis_fuzz.sh --base-url <url> --spec <openapi.json>" >&2
            echo "which must exit non-zero on any 5xx. This job cannot invent a mismatch, so it fails here." >&2
            exit 1
          fi

      - name: Fuzz the spec — 0 server errors allowed
        run: bash backend/scripts/schemathesis_fuzz.sh --base-url http://127.0.0.1:8002 --spec backend/openapi.json --max-examples 10 --workers 4  # 1,652 operations: bounded so every phase fits the 60-min job

      - name: Logs on failure
        if: failure()
        run: tail -n 200 /tmp/nabd-backend.log || true
