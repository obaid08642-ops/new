name: P15 device farm

# 15.10 (CI side): per-release Firebase Test Lab run over tools/live/device_farm.yml.
# Manual per release (workflow_dispatch): it uploads the EAS-built binaries and
# runs the Robo matrix, then attaches the report. The farm is a PAID external
# service — without GCP credentials / built binaries this job stops at the
# explicit BLOCKED step instead of pretending to test.
on:
  workflow_dispatch:
    inputs:
      apk_artifact:
        description: 'Artifact name holding the EAS-built patient APK'
        required: true
        default: 'patient-apk'
      ipa_artifact:
        description: 'Artifact name holding the EAS-built patient IPA (optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: YAML tooling
        run: pip install pyyaml
      - name: Gate without credentials is BLOCKED, not green
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [[ -z "$GCP_SA_KEY" ]]; then
            echo "BLOCKED: device farm is a paid external service with no account configured (needs GCP_SA_KEY, GCLOUD_PROJECT, RESULTS_BUCKET secrets + EAS-built binaries)" >&2
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Install gcloud beta (firebase test)
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Fetch binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.apk_artifact }}
          path: /tmp/farm
      - name: Run the farm matrix
        env:
          GCLOUD_PROJECT: ${{ secrets.GCLOUD_PROJECT }}
          RESULTS_BUCKET: ${{ secrets.RESULTS_BUCKET }}
        run: |
          bash tools/live/run_device_farm.sh --apk "$(ls /tmp/farm/*.apk | head -1)" --out /tmp/ftl-report.json
      - name: Attach the device-farm report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-farm-report
          path: /tmp/ftl-report.json
