name: server-ops
# Owner-delegated server operations (2026-10-04). Every run uses the `production` environment,
# so it waits for the owner's Approve click. tools/ops/RUN lists the task scripts to run, in order.
# The repo is public: the full report is encrypted to tools/ops/report_pubkey.pub before upload,
# and the log shows only short status lines (lines starting with a task tag, e.g. "x0:").
on:
  workflow_dispatch:
  push:
    branches: ['review/server-inspect']
    paths: ['tools/ops/**', '.github/workflows/server-inspect.yml']
concurrency: { group: server-ops, cancel-in-progress: false }
jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: SSH setup
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          PORT=${PORT:-22}
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" -T 15 "$H" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] || { echo "::error::server not reachable"; exit 1; }
          printf '%s\n' "$K" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      - name: Hand the Cloudflare TURN keys to the server (only when RUN lists 70b-turn-env)
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          grep -qE '^\s*70b-turn-env\s*$' tools/ops/RUN || { echo "skipped"; exit 0; }
          if [ -z "$CF_TURN_KEY_ID" ] || [ -z "$CF_TURN_API_TOKEN" ]; then
            echo "::warning::CF_TURN_KEY_ID or CF_TURN_API_TOKEN is not set in the production environment: the task keeps the names already on the server"
            exit 0
          fi
          PORT=${PORT:-22}
          # the values travel on ssh stdin into a mode-600 file the task reads and shreds; never on a command line, never echoed (GitHub also masks them)
          printf 'CF_TURN_KEY_ID=%s\nCF_TURN_API_TOKEN=%s\n' "$CF_TURN_KEY_ID" "$CF_TURN_API_TOKEN" \
            | ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$U@$H" 'umask 077; cat > "$HOME/ops-turn.env"'
          echo "TURN keys handed to the server (names only)"
      - name: Run tasks
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set +e   # a failing task must never stop the report from being saved
          PORT=${PORT:-22}
          : > report.txt
          for t in $(grep -vE '^\s*(#|$)' tools/ops/RUN); do
            f=tools/ops/tasks/$t.sh
            [ -f "$f" ] || continue
            echo "== task $t" | tee -a report.txt
            timeout 420 ssh -p "$PORT" -o BatchMode=yes -o ServerAliveInterval=15 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$U@$H" 'bash -s' < "$f" >> report.txt 2>&1
            echo "   exit=$?"
          done
          # public log: only the short status lines of mutating tasks, and `status:` lines a task writes on purpose
          # (non-secret summaries: counts, ok/fail, percentages, variable NAMES; never a value, address or path with data).
          grep -E '^(x0|cleanup|deploy|rotate|status):' report.txt \
            | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g; s/(KEY|SECRET|PASS(WORD|PHRASE)?|TOKEN)=[^ ]*/\1=<hidden>/g' > public.txt || true
          cat public.txt
          # the same masked status: lines as annotations, readable through the checks API (sessions cannot download job logs)
          grep -E '^status:' public.txt | head -40 | while IFS= read -r l; do echo "::notice title=server-ops::$l"; done || true
          rm -f public.txt
          echo "report lines: $(wc -l < report.txt)"
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in report.txt -out report.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey tools/ops/report_pubkey.pub -pkeyopt rsa_padding_mode:oaep -in k.txt -out k.enc
          rm -f report.txt k.txt
      - name: Cloudflare purge of api.nabd.plus (only when RUN lists cf-purge-api)
        if: ${{ !cancelled() }}
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          Z: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          grep -qE '^\s*cf-purge-api\s*$' tools/ops/RUN || { echo "skipped"; exit 0; }
          curl -s -X POST -H "Authorization: Bearer $CF" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$Z/purge_cache" --data '{"hosts":["api.nabd.plus"]}' \
            | jq -r '"cf-purge: success=\(.success) errors=\(.errors|map(.message)|join("; "))"'
      - name: External port probe of the calls ports from this runner (only when RUN lists net-probe)
        if: ${{ !cancelled() }}
        env:
          H: ${{ secrets.DEPLOY_HOST }}
        run: |
          grep -qE '^\s*net-probe\s*$' tools/ops/RUN || { echo "skipped"; exit 0; }
          # read-only: one connection or one STUN request per port; prints only ok/fail per port (no address, no payload)
          python3 tools/ops/net-probe.py "$H" | tee probe.txt || true
          grep -E '^status:' probe.txt | while IFS= read -r l; do echo "::notice title=net-probe::$l"; done
          rm -f probe.txt

      - name: Remove the TURN key file from the server if the task did not (only when RUN lists 70b-turn-env)
        if: ${{ always() }}
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          grep -qE '^\s*70b-turn-env\s*$' tools/ops/RUN || exit 0
          [ -f ~/.ssh/id_deploy ] || exit 0
          PORT=${PORT:-22}
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$U@$H" 'shred -u "$HOME/ops-turn.env" 2>/dev/null || rm -f "$HOME/ops-turn.env"' || true
      - name: Cleanup key
        if: ${{ always() }}
        run: rm -f ~/.ssh/id_deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: ops-report-encrypted
          path: |
            report.enc
            k.enc
          retention-days: 3
