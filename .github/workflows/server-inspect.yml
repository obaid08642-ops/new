name: server-ops
# Owner-delegated server operations (2026-10-04). Every run uses the `production` environment,
# so it waits for the owner's Approve click. tools/ops/RUN lists the task scripts to run, in order.
# The repo is public: the full report is encrypted to tools/ops/report_pubkey.pub before upload,
# and the log shows only short status lines (lines starting with a task tag, e.g. "x0:").
on:
  workflow_dispatch:
  push:
    branches: ['review/server-inspect']
    paths: ['tools/ops/**', '.github/workflows/server-inspect.yml']
concurrency: { group: server-ops, cancel-in-progress: false }
jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          PORT=${PORT:-22}
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "$PORT" -T 15 "$H" > ~/.ssh/known_hosts 2>/dev/null
          [ -s ~/.ssh/known_hosts ] || { echo "::error::server not reachable"; exit 1; }
          printf '%s\n' "$K" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      - name: Build and upload a release (only when RUN lists "release:<full sha>")
        # Images are built here, never on the 3.8 GB production host (tools/ops/release/build-release.sh), then copied
        # to /opt/nabdah/releases/<sha8>/ for a deploy task to load.
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          REL=$(grep -oE '^\s*release:[0-9a-f]{40}\s*$' tools/ops/RUN | sed -E 's/^\s*release://; s/\s*$//' | head -1 || true)
          [ -n "$REL" ] || { echo "no release line; skipped"; exit 0; }
          PORT=${PORT:-22}; S8=${REL:0:8}
          git clone -q --filter=blob:none https://github.com/${{ github.repository }}.git rel-src
          git -C rel-src checkout -q "$REL"
          git -C rel-src merge-base --is-ancestor "$REL" origin/main || { echo "::error::$REL is not on main"; exit 1; }
          bash tools/ops/release/build-release.sh rel-src rel-out
          SSH="ssh -p $PORT -o BatchMode=yes -o ServerAliveInterval=15 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_deploy $U@$H"
          $SSH "mkdir -p /opt/nabdah/releases/$S8"
          scp -q -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy rel-out/images.tar.gz rel-out/deploy.tgz rel-out/SHA rel-out/SHA256SUMS "$U@$H:/opt/nabdah/releases/$S8/"
          $SSH "cd /opt/nabdah/releases/$S8 && sha256sum -c --quiet SHA256SUMS" && echo "deploy: release $S8 uploaded and verified on the server"
      - name: Run tasks
        # Lines of tools/ops/RUN run in their order. "r2-backup-bucket" (D-33) runs tools/ops/cf/20-r2-backup-bucket.sh
        # here with the Global API Key: the private bucket, its 30-day expiry and a key limited to it; the key reaches
        # the server only on ssh stdin, as a mode-600 file that tasks/61-backups-env.sh moves into .env.production.
        # A task that exits 99 stops the run: nothing after it runs (63-inspect-rollback does this when an older
        # deploy task is still running on the server).
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CFE: ${{ secrets.CLOUDFLARE_EMAIL }}
          Z: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # mail providers (owner, 2026-10-16): reach the server only on ssh stdin, for tasks/70-mail-env.sh
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
        run: |
          set +e   # a failing task must never stop the report from being saved
          PORT=${PORT:-22}
          : > report.txt
          SSH="ssh -p $PORT -o BatchMode=yes -o ServerAliveInterval=15 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_deploy $U@$H"
          for t in $(grep -vE '^\s*(#|$)' tools/ops/RUN); do
            if [ "$t" = r2-backup-bucket ]; then
              echo "== r2-backup-bucket" | tee -a report.txt
              R2_HAS_KEY_CMD="$SSH \"sudo -n grep -qE '^BACKUP_S3_ACCESS_KEY_ID=.+' /opt/nabdah/deploy/.env.production\"" \
              R2_DELIVER_CMD="$SSH 'umask 077; cat > ops-r2-backup.env'" \
                timeout 300 bash tools/ops/cf/20-r2-backup-bucket.sh > r2.txt 2>&1; rc=$?
              cat r2.txt >> report.txt; grep -E '^r2:' r2.txt; rm -f r2.txt
              echo "   exit=$rc"
              continue
            fi
            f=tools/ops/tasks/$t.sh
            [ -f "$f" ] || continue
            echo "== task $t" | tee -a report.txt
            if [ "$t" = 70-mail-env ]; then
              # the three keys as a mode-600 file in the deploy user's home; the task moves them into .env.production
              # and shreds the file. printf is a shell builtin: the values are on no command line.
              { [ -n "$BREVO_API_KEY" ] && printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY"
                [ -n "$MAILJET_API_KEY" ] && printf 'MAILJET_API_KEY=%s\n' "$MAILJET_API_KEY"
                [ -n "$MAILJET_SECRET_KEY" ] && printf 'MAILJET_SECRET_KEY=%s\n' "$MAILJET_SECRET_KEY"; } \
                | $SSH 'umask 077; cat > ops-mail.env' && echo "mail: key file delivered" | tee -a report.txt
            fi
            if grep -q '^# ops-detach' "$f"; then
              # long mutating tasks run detached on the server (setsid), so a dropped SSH session cannot stop them
              # half way; the log is polled until the task writes its exit line
              scp -q -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$f" "$U@$H:ops-$t.sh"
              $SSH "rm -f ops-$t.log; setsid nohup sh -c 'bash ops-$t.sh; echo ops-exit=\$?' > ops-$t.log 2>&1 < /dev/null &"
              for i in $(seq 1 480); do sleep 15; $SSH "grep -q '^ops-exit=' ops-$t.log" 2>/dev/null && break; done
              $SSH "cat ops-$t.log" >> report.txt 2>&1
              rc=$($SSH "grep -m1 '^ops-exit=' ops-$t.log" 2>/dev/null | cut -d= -f2); rc=${rc:-still running after 120 min}
            else
              timeout 420 ssh -p "$PORT" -o BatchMode=yes -o ServerAliveInterval=15 -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy "$U@$H" 'bash -s' < "$f" >> report.txt 2>&1
              rc=$?
            fi
            echo "   exit=$rc"
            if [ "$rc" = 99 ]; then echo "x0: run stopped by $t (exit 99); nothing after it ran" | tee -a report.txt; break; fi
          done
          # public log: only the short status lines of mutating tasks
          grep -E '^(x0|cleanup|deploy|rotate|backups|recover|mail):' report.txt | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' || true
          # migrations: names, exit codes and the JSON count lines only; an error line keeps its class, never its values
          grep -E '^migrate: ' report.txt | grep -E '^migrate: [0-9a-z-]+ (--apply|exit=[0-9]+)$|^migrate:   \{.*\}$|^migrate:   [A-Za-z]*Error' \
            | sed -E 's/dup key: \{.*$/dup key: <value>/; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g; s/\+?[0-9][0-9 ()-]{8,}[0-9]/<number>/g' | cut -c1-200 || true
          echo "report lines: $(wc -l < report.txt)"
      - name: Cloudflare tasks (RUN lines "cf:<name>" -> tools/ops/cf/<name>.sh, output into the encrypted report)
        if: ${{ !cancelled() }}
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CFE: ${{ secrets.CLOUDFLARE_EMAIL }}   # set when CF holds a Global API Key (tools/ops/cf/_auth.sh)
          Z: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}           # cf/41-mail-verify.sh: Brevo's domain status
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}       # and Mailjet's
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
        run: |
          set +e
          for t in $(grep -E '^\s*cf:' tools/ops/RUN | sed -E 's/^\s*cf://'); do
            f=tools/ops/cf/$t.sh
            [ -f "$f" ] || { echo "missing $f"; continue; }
            echo "== cf task $t" | tee -a report.txt
            timeout 300 bash "$f" >> report.txt 2>&1
            echo "   exit=$?"
          done
          grep -E '^(cf):' report.txt || true
      - name: Encrypt report
        if: ${{ !cancelled() }}
        run: |
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in report.txt -out report.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey tools/ops/report_pubkey.pub -pkeyopt rsa_padding_mode:oaep -in k.txt -out k.enc
          rm -f report.txt k.txt
      - name: Cloudflare purge of api.nabd.plus (only when RUN lists cf-purge-api)
        if: ${{ !cancelled() }}
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CFE: ${{ secrets.CLOUDFLARE_EMAIL }}
          Z: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          grep -qE '^\s*cf-purge-api\s*$' tools/ops/RUN || { echo "skipped"; exit 0; }
          . tools/ops/cf/_auth.sh
          cf_curl -X POST -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$Z/purge_cache" --data '{"hosts":["api.nabd.plus"]}' \
            | jq -r '"cf-purge: success=\(.success) errors=\(.errors|map(.message)|join("; "))"'
      - name: Cleanup key
        if: ${{ always() }}
        run: rm -f ~/.ssh/id_deploy
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ops-report-encrypted
          path: |
            report.enc
            k.enc
          retention-days: 3
