name: uptime

# P20.6: an external vantage point (GitHub's network, a different region from Cloudflare's edge) probes the public site and API every
# 5 minutes and reports to the status page. A down component fails the run, which GitHub emails to the repository's watchers.
# GitHub may delay a scheduled run under load; the status page counts a report as fresh for 15 minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/uptime/**'
      - '.github/workflows/uptime.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The probe script itself (offline tests)
        run: node --test tools/uptime/probe.test.mjs
      - name: Probe the public site and API, report to the status page
        if: github.event_name != 'pull_request'
        env:
          STATUS_INGEST_SECRET: ${{ secrets.STATUS_INGEST_SECRET }}
        run: node tools/uptime/probe.mjs --vantage github-actions
