name: Live gate

# End-to-end user journeys against a real stack: backend (built), MongoDB replica set, Redis,
# S3 (moto), SMTP sink (OTP/2FA mails), a fake Moyasar gateway and the admin panel BFF.
# tools/live/run_gate.sh lists the journeys; each must pass 100%.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'rs.status().ok' | grep -q 1 && break; sleep 2; done

      - name: Test doubles (S3, SMTP sink, Moyasar)
        run: |
          pip install 'moto[server]==5.*' boto3 aiosmtpd
          nohup moto_server -p 9000 > /tmp/moto.log 2>&1 &
          nohup python3 tools/live/smtp_sink.py > /tmp/smtp.log 2>&1 &
          nohup python3 tools/live/fake_moyasar.py > /tmp/moyasar.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000 && break; sleep 1; done
          python3 -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', aws_access_key_id='live', aws_secret_access_key='live-secret', region_name='us-east-1').create_bucket(Bucket='nabd-live')"

      - name: Real browser for admin click tests (R7-1)
        run: |
          pip install 'playwright==1.60.*'
          python3 -m playwright install --with-deps chromium
          python3 -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); print('chromium ok:', b.version); b.close(); p.stop()"

      # Decision 4 (2026-10-14): video calls are proven against a real local LiveKit (tools/live/j_web_call.py).
      - name: LiveKit media server
        run: bash tools/live/start-livekit.sh

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          node ../tools/live/seed_admin.js
          bash ../tools/live/start-backend.sh

      - name: Admin panel (BFF)
        working-directory: admin
        run: |
          npm ci
          npx next build
          ADMIN_GATE_TOKEN=live-gate-token ADMIN_BACKEND_URL=http://127.0.0.1:8002 NODE_ENV=production nohup npx next start -p 3001 -H 127.0.0.1 > /tmp/admin.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3001/ && break; sleep 2; done

      # Fix session: patient-web screens are proven in a real browser too (tools/live/j_web_*.py), so the gate
      # builds the website against this backend and serves it on :3100 (tools/live/start-web.sh). run_gate.sh points the
      # browser half of j_throttled_network (NABD_PATIENT_WEB) at the same :3100 site.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1

      - name: Patient web
        working-directory: patient-web
        run: |
          corepack enable && pnpm install --frozen-lockfile
          NABD_API_BASE_URL=http://127.0.0.1:8002/api/v1 INTERNAL_API_BASE_URL=http://127.0.0.1:8002/api/v1 NEXT_PUBLIC_SITE_ORIGIN=http://127.0.0.1:3100 NEXT_TELEMETRY_DISABLED=1 pnpm run build
          PATIENT_WEB_PORT=3100 PATIENT_WEB_ORIGIN=http://127.0.0.1:3100 bash ../tools/live/start-web.sh patient-web

      - name: Journeys
        run: bash tools/live/run_gate.sh

      # Phase 16.8: OWASP ZAP runs in its own workflow (.github/workflows/zap.yml); the step that stood here was a no-op
      # (continue-on-error, only /health, and it read a report key ZAP does not write), so it could never fail.

      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/nabd-backend.log || true
          tail -n 50 /tmp/admin.log || true
