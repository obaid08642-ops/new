name: Content QA

on:
  push:
    branches: [main, develop]
    paths:
      - 'patient-app/**'
      - 'patient-web/**'
      - 'provider-app/**'
      - 'admin/**'
      - 'backend/**'
      - 'workers/**'
      - 'docs/**'
      - 'tools/content/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'patient-app/**'
      - 'patient-web/**'
      - 'provider-app/**'
      - 'admin/**'
      - 'backend/**'
      - 'workers/**'
      - 'docs/**'
      - 'tools/content/**'

jobs:
  brand-name-check:
    name: Brand Name Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefix tools/content 2>/dev/null || npm install --prefix tools/content
      
      - name: Run brand name check
        run: npx tsx tools/content/brand-check.ts
        working-directory: ${{ github.workspace }}

  claims-check:
    name: Banned Claims Check (SFDA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefix tools/content 2>/dev/null || npm install --prefix tools/content
      
      - name: Run claims check
        run: npx tsx tools/content/claims-check.ts
        working-directory: ${{ github.workspace }}

  content-length-check:
    name: Content Length Limits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefix tools/content 2>/dev/null || npm install --prefix tools/content
      
      - name: Run length check
        run: npx tsx tools/content/length-check.ts
        working-directory: ${{ github.workspace }}

  translation-parity:
    name: Translation Key Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Run translation parity check
        run: |
          # Check all locales have the same keys
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const localesDir = 'patient-app/src/i18n/locales';
          const files = fs.readdirSync(localesDir).filter(f => f.endsWith('.json'));
          const baseKeys = new Set(Object.keys(JSON.parse(fs.readFileSync(path.join(localesDir, 'en.json'), 'utf-8'))));
          
          let hasErrors = false;
          for (const file of files) {
            if (file === 'en.json') continue;
            const keys = new Set(Object.keys(JSON.parse(fs.readFileSync(path.join(localesDir, file), 'utf-8'))));
            const missing = [...baseKeys].filter(k => !keys.has(k));
            const extra = [...keys].filter(k => !baseKeys.has(k));
            
            if (missing.length > 0) {
              console.error(\`❌ \${file}: Missing \${missing.length} keys: \${missing.slice(0, 10).join(', ')}\${missing.length > 10 ? '...' : ''}\`);
              hasErrors = true;
            }
            if (extra.length > 0) {
              console.warn(\`⚠️ \${file}: Extra \${extra.length} keys not in base\`);
            }
          }
          
          if (hasErrors) process.exit(1);
          console.log('✅ All locales have parity with en.json');
          "

  screenshot-regression:
    name: Screenshot Regression (12.A10)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci --prefix patient-web
          npx playwright install --with-deps chromium
      
      - name: Build patient-web
        run: npm run build --prefix patient-web
        env:
          NEXT_TELEMETRY_DISABLED: 1
      
      - name: Run visual regression tests
        run: |
          # This runs the 12.A10 visual test suite across all locales
          # Catches overflow in long languages (ar, ur, hi, bn, fil)
          npx playwright test --project=chromium --grep="visual|screenshot|locale|overflow" --prefix patient-web || true
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: patient-web/test-results/
          retention-days: 7

  content-lint-summary:
    name: Content Lint Summary
    runs-on: ubuntu-latest
    needs: [brand-name-check, claims-check, content-length-check, translation-parity, screenshot-regression]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Brand Name Check: ${{ needs.brand-name-check.result }}"
          echo "Claims Check: ${{ needs.claims-check.result }}"
          echo "Length Check: ${{ needs.content-length-check.result }}"
          echo "Translation Parity: ${{ needs.translation-parity.result }}"
          echo "Screenshot Regression: ${{ needs.screenshot-regression.result }}"
          
          if [ "${{ needs.brand-name-check.result }}" != "success" ] || \
             [ "${{ needs.claims-check.result }}" != "success" ] || \
             [ "${{ needs.content-length-check.result }}" != "success" ] || \
             [ "${{ needs.translation-parity.result }}" != "success" ]; then
            echo "::error::Content QA failed - see individual job logs"
            exit 1
          fi
          
          echo "✅ All content QA checks passed"