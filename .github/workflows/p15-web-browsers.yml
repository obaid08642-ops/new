name: P15 web browsers

# 15.10 (CI side): patient-web on desktop browsers via Playwright
# WebKit (Safari proxy), Firefox and Chromium (Chrome desktop + the Samsung
# Internet proxy — Samsung Internet ships no Playwright build; it is
# Chromium-based, so Chromium covers the engine here and a real Galaxy
# device covers the shell in the device-farm matrix). Safari iOS 16+ and
# Chrome Android shells are covered by real devices in the farm
# (tools/live/device_farm.yml); this job covers the engines in CI.
#
# Playwright is NOT assumed on the image: the job installs the pinned
# build itself (same pin style as patient-production-ci.yml) with
# --with-deps so the browsers exist too.
#
# API TARGET: the public, read-only production API (https://api.nabd.plus/api/v1), as
# patient-production-ci.yml and lighthouse.yml already do. Staging sits behind
# Cloudflare Access (it answers 302) and has been off since 2026-10-04; a static
# page with no data throws to keep its last good copy, so a staging target made
# the smoke report 500/503. The smoke only loads public pages anonymously (GET,
# no sign-in, no form, no click); the guard step below fails the job if the
# smoke script ever starts interacting with the page or sending a body.
on:
  pull_request:
    paths:
      - 'patient-web/**'
      - 'tools/live/web_browsers_smoke.mjs'
      - '.github/workflows/p15-web-browsers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p15-browsers-${{ github.ref }}
  cancel-in-progress: true

env:
  NABD_API_BASE_URL: https://api.nabd.plus/api/v1

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: patient-web/pnpm-lock.yaml
      - name: Install
        working-directory: patient-web
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Playwright + browsers (self-contained, pinned)
        # The smoke script imports 'playwright' from tools/live, so the package is installed
        # there (not only the CLI through npx); then only this matrix leg's browser.
        run: |
          npm install --no-save --no-package-lock --prefix tools/live playwright@1.63.0
          tools/live/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Guard — the smoke against the production API stays read-only
        run: |
          set -euo pipefail
          if grep -nE '\.(click|fill|type|press|check|selectOption|setInputFiles|dblclick|tap)\(|method:|postData|request\.(post|put|patch|delete)|fetch\(' tools/live/web_browsers_smoke.mjs; then
            echo "REFUSING: tools/live/web_browsers_smoke.mjs interacts with pages or sends requests; it runs against the production API and must only load public pages" >&2
            exit 1
          fi
          echo "API base for the build and the smoke run: $NABD_API_BASE_URL (public pages, anonymous GET only)"
      - name: Build
        working-directory: patient-web
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_ORIGIN: http://localhost:3000
      - name: Start production server
        working-directory: patient-web
        env:
          NEXT_PUBLIC_SITE_ORIGIN: http://localhost:3000
          PORT: 3000
          HOSTNAME: 127.0.0.1
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          # the production entry point (deploy/docker/Dockerfile.patient-web CMD): it stamps the CSP nonce into the
          # static/ISR pages and serves the translated unavailable page when a public page fails with no cached copy
          cp -r server .next/standalone/server
          (node .next/standalone/server/nonce-server.mjs &> /tmp/next.log &)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ar || true)
            if [ "$code" = "200" ]; then echo "server ready after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo "server not ready"; tail -100 /tmp/next.log; exit 1
      - name: Wait until the smoke pages and their RSC prefetch answer 200
        # The first request to an ISR page (e.g. /ar/articles, which the pharmacy page prefetches) is generated from a live
        # read of the production API; a cold API answer past the 8 s read timeout leaves no cached copy, and the prefetch of
        # that page then gets a bare 500 (the translated 503 page is for documents only). Readiness is checked, not slept:
        # every page the smoke loads, and what the pages prefetch, must answer 200 as a document and as an RSC prefetch,
        # each polled for up to 2 minutes. A page that never answers fails the job here with the server log; the smoke
        # itself still fails on any own-origin 5xx.
        run: |
          set -u
          ready() { # $1 = path, $2 = "doc" | "rsc"
            for i in $(seq 1 40); do
              if [ "$2" = "rsc" ]; then
                code=$(curl -s -L -o /dev/null -w '%{http_code}' -H 'RSC: 1' -H 'Next-Router-Prefetch: 1' "http://localhost:3000$1?_rsc=ready" || true)
              else
                code=$(curl -s -L -o /dev/null -w '%{http_code}' "http://localhost:3000$1" || true)
              fi
              if [ "$code" = "200" ]; then echo "ready: $2 $1 (try $i)"; return 0; fi
              sleep 3
            done
            echo "NOT READY: $2 $1 last status ${code:-none}"; tail -100 /tmp/next.log; return 1
          }
          for path in /ar /ar/pharmacy /ar/consultations/doctors /ar/articles; do
            ready "$path" doc || exit 1
            ready "$path" rsc || exit 1
          done
      - name: Browser smoke (${{ matrix.browser }})
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          SMOKE_BASE: http://localhost:3000
        run: node tools/live/web_browsers_smoke.mjs
