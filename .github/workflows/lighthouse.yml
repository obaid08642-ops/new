name: Lighthouse Web Perf

on:
  pull_request:
    paths:
      - 'patient-web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: patient-web/pnpm-lock.yaml
      - name: Install
        working-directory: patient-web
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        working-directory: patient-web
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NABD_API_BASE_URL: https://api.nabd.plus/api/v1
          NEXT_PUBLIC_SITE_ORIGIN: http://localhost:3000
      - name: Start production server (standalone) and wait until ready
        working-directory: patient-web
        env:
          NABD_API_BASE_URL: https://api.nabd.plus/api/v1
          NEXT_PUBLIC_SITE_ORIGIN: http://localhost:3000
          PORT: 3000
          HOSTNAME: 127.0.0.1
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          (node .next/standalone/server.js &> /tmp/next.log &)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ar || true)
            if [ "$code" = "200" ]; then echo "server ready after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo "server not ready"; tail -100 /tmp/next.log; exit 1
      - name: Audit key routes
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/ar
            http://localhost:3000/ar/pharmacy
            http://localhost:3000/ar/consultations/doctors
          budgetPath: ./patient-web/.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
