name: Lighthouse Web Perf

on:
  pull_request:
    paths:
      - 'patient-web/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR replaces the older run (it would be thrown away anyway); pushes to main and scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: patient-web/pnpm-lock.yaml
      - name: Install
        working-directory: patient-web
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        working-directory: patient-web
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NABD_API_BASE_URL: https://api.nabd.plus/api/v1
          NEXT_PUBLIC_SITE_ORIGIN: http://localhost:3000
      - name: Start production server (standalone) and wait until ready
        working-directory: patient-web
        env:
          NABD_API_BASE_URL: https://api.nabd.plus/api/v1
          NEXT_PUBLIC_SITE_ORIGIN: http://localhost:3000
          PORT: 3000
          HOSTNAME: 127.0.0.1
        run: |
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          # F68: production starts through the nonce server (fresh CSP nonce on cached public pages).
          cp -r server .next/standalone/server
          (node .next/standalone/server/nonce-server.mjs &> /tmp/next.log &)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ar || true)
            if [ "$code" = "200" ]; then echo "server ready after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo "server not ready"; tail -100 /tmp/next.log; exit 1
      - name: Audit key routes
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://localhost:3000/ar
            http://localhost:3000/ar/c
            http://localhost:3000/ar/consultations/doctors
          budgetPath: ./patient-web/.github/lighthouse-budget.json
          # QUALITY_STANDARDS §2/§3: performance >= 90, accessibility >= 95, LCP < 2.5 s, CLS < 0.1, TBT <= 200 ms
          # Owner decision 45 (issue 427): applied (devtools) throttling, the median of 3 runs per page, thresholds unchanged.
          # The catalogue is audited at its own address (/ar/c, the nav's link); /ar/pharmacy is an old alias that redirects.
          configPath: ./patient-web/.lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
