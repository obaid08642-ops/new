name: Publish signed images

# R20: the images that would run in production are built in CI (never on a laptop), pushed to GitHub's container registry, and for each image:
#   - a CycloneDX SBOM of the IMAGE (OS packages and app dependencies, not only the lockfile) is generated by Trivy, attached to the release and
#     attested to the image (cosign attest), so "which images contain library X" is answerable per digest;
#   - the image digest is signed keyless with cosign (GitHub's OIDC identity, recorded in the public Rekor log): no signing key exists to steal.
# A server verifies before it runs: deploy/scripts/verify-image.sh <image@sha256:...> (see docs/ops/SUPPLY_CHAIN_R20.md).
# Runs on a published release and on demand. Nothing in production pulls these images yet; see the limits in the document.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: write    # attach the SBOM to the release
      packages: write    # push to ghcr.io
      id-token: write    # keyless signing (OIDC token for Sigstore)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: backend,     context: backend,      dockerfile: backend/Dockerfile.production }
          - { image: admin-web,   context: admin,        dockerfile: deploy/docker/Dockerfile.admin-web }
          - { image: patient-web, context: patient-web,  dockerfile: deploy/docker/Dockerfile.patient-web }
    env:
      REPO_LC: ${{ github.repository_owner }}/nabd-${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name in lower case (registry names must be)
        run: echo "IMAGE=ghcr.io/$(echo "$REPO_LC" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build and push (tags are for people, the digest is what gets signed and deployed)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.event.release.tag_name || 'manual' }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: SBOM of the image (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-image-${{ matrix.image }}.cdx.json
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: The image SBOM is CycloneDX and lists packages
        run: python3 tools/supply-chain/check_image_sbom.py sbom-image-${{ matrix.image }}.cdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the digest (keyless) and attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "sbom-image-${{ matrix.image }}.cdx.json" "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image-${{ matrix.image }}
          path: sbom-image-${{ matrix.image }}.cdx.json
          retention-days: 365
      - name: Attach the SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "sbom-image-${{ matrix.image }}.cdx.json" --clobber
      - name: What was published
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "$IMAGE@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Verify on a server: \`deploy/scripts/verify-image.sh $IMAGE@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
