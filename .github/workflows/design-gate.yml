name: design-gate
on:
  pull_request:
    paths:
      - 'patient-web/**'
      - 'patient-app/**'

# A newer push to the same PR replaces the older run (it would be thrown away anyway); pushes to main and scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impeccable-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Impeccable detector
        continue-on-error: true
        run: |
          # The detector exits 2 when it finds issues; bash -e would stop the step before printing.
          npx --yes impeccable@4.1.0 detect --json patient-web/ > det.json 2>&1 || true
          cat det.json

      # Draft only: this job is informational and does NOT block the merge.
      # To make it a required check, remove `continue-on-error: true` and add
      # a step that exits non-zero when a P0 finding is present.
