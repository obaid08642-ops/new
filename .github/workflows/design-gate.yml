name: design-gate
on:
  pull_request:
    paths:
      - 'patient-web/**'
      - 'patient-app/**'

jobs:
  impeccable-detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Impeccable detector
        continue-on-error: true
        run: |
          npx --yes impeccable@4.1.0 detect patient-web/ 2> /tmp/detector.txt
          echo "exit=$?"
          cat /tmp/detector.txt

      # Draft only: this job is informational and does NOT block the merge.
      # To make it a required check, remove `continue-on-error: true` and add
      # a step that exits non-zero when a P0 finding is present.
