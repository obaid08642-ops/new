name: i18n Translation Coverage

on:
  push:
    branches: [main, develop]
    paths:
      - 'patient-web/messages/**'
      - 'patient-app/src/i18n/locales/**'
      - 'provider-app/src/i18n/locales/**'
      - 'admin/messages/**'
      - 'backend/src/common/errors.i18n.json'
      - 'backend/src/common/i18n/**'
      - 'scripts/i18n/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'patient-web/messages/**'
      - 'patient-app/src/i18n/locales/**'
      - 'provider-app/src/i18n/locales/**'
      - 'admin/messages/**'
      - 'backend/src/common/errors.i18n.json'
      - 'backend/src/common/i18n/**'
      - 'scripts/i18n/**'

jobs:
  validate-i18n:
    name: Validate 100% i18n Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd patient-web && pnpm install --frozen-lockfile
          cd ../patient-app && pnpm install --frozen-lockfile
          cd ../provider-app && pnpm install --frozen-lockfile
          cd ../admin && pnpm install --frozen-lockfile
          cd ../backend && pnpm install --frozen-lockfile

      - name: Install ts-node
        run: pnpm add -g ts-node typescript

      - name: Validate i18n coverage
        run: |
          ts-node scripts/i18n/validate-coverage.ts

      - name: Validate locale files are valid JSON
        run: |
          echo "Checking JSON syntax..."
          find patient-web/messages -name "*.json" -exec jq empty {} \;
          find patient-app/src/i18n/locales -name "*.json" -exec jq empty {} \;
          find provider-app/src/i18n/locales -name "*.json" -exec jq empty {} \;
          find admin/messages -name "*.json" -exec jq empty {} \;
          find backend/src/common -name "*.i18n.json" -exec jq empty {} \;
          find backend/src/common/i18n -name "*.json" -exec jq empty {} \;
        shell: bash

      - name: Check for duplicate keys
        run: |
          echo "Checking for duplicate keys..."
          node -e "
            const fs = require('fs');
            const paths = [
              'patient-web/messages',
              'patient-app/src/i18n/locales',
              'provider-app/src/i18n/locales',
              'admin/messages'
            ];
            paths.forEach(dir => {
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
              files.forEach(f => {
                const content = fs.readFileSync(path.join(dir, f), 'utf8');
                const keys = [];
                JSON.parse(content, (k, v) => { if (k !== '') keys.push(k); return v; });
                const dupes = keys.filter((k, i) => keys.indexOf(k) !== i);
                if (dupes.length) {
                  console.error('Duplicate keys in ' + dir + '/' + f + ': ' + dupes.join(', '));
                  process.exit(1);
                }
              });
            });
            console.log('No duplicate keys found');
          "
        shell: bash

  validate-fallback:
    name: Validate Fallback Logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test fallback logic (English, not Arabic)
        run: |
          node -e "
            const { getLocaleForUser, resolveLocale, FALLBACK_LOCALE } = require('./packages/i18n/src/locales');
            
            // Test 1: User preference takes priority
            console.assert(getLocaleForUser('fr', 'ar') === 'en', 'Unsupported user locale should fallback to English');
            console.assert(getLocaleForUser('ar', 'en') === 'ar', 'Supported user locale should be used');
            
            // Test 2: Device locale used when no user preference
            console.assert(getLocaleForUser(null, 'ar-SA') === 'ar', 'Device locale Arabic should be used');
            console.assert(getLocaleForUser(null, 'hi-IN') === 'hi', 'Device locale Hindi should be used');
            console.assert(getLocaleForUser(null, 'en-US') === 'en', 'Device locale English should be used');
            console.assert(getLocaleForUser(null, 'fr-FR') === 'en', 'Unsupported device locale should fallback to English');
            
            // Test 3: Default fallback is English
            console.assert(FALLBACK_LOCALE === 'en', 'Default fallback must be English');
            console.assert(getLocaleForUser(null, null) === 'en', 'No preference should default to English');
            console.assert(resolveLocale(null, null, null) === 'en', 'Resolve with no params should be English');
            
            // Test 4: Request locale takes priority
            console.assert(resolveLocale('ar', 'en', 'hi') === 'ar', 'Requested locale takes priority');
            console.assert(resolveLocale('fr', 'ar', 'en') === 'ar', 'Invalid request falls to user preference');
            console.assert(resolveLocale('fr', 'fr', 'ar') === 'en', 'Invalid request and user falls to English');
            
            console.log('All fallback tests passed!');
          "
        shell: bash